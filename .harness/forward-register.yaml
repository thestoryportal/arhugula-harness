- id: B-73
  title: Protected result store's GC/publish synchronization is in-process only -- two co-resident
    OS processes sharing one store root are not mutually excluded
  status: closed
  pr: "#1120"
  summary: 'Split out of B-68 at its close (2026-07-25). CLOSED 2026-07-26 at PR #1120:
    `_cross_process_lock()` (an `fcntl.flock` on a dedicated `.cross_process.lock` file,
    disjoint from both `gc_sweep` glob patterns) is now composed INSIDE the existing
    in-process `self._publish_lock` at both `_publish_atomic` and `gc_sweep`''s
    candidate-selection phase -- a single, fixed nesting order everywhere, no lock-ordering
    hazard. Guarded on Windows (`_IS_WINDOWS = sys.platform == "win32"`) per C-STK-10,
    mirroring the same carve-out already shipped at `harness_is.cross_process_ledger_lock`;
    `fcntl` is imported lazily inside the lock method, never at module scope (an unguarded
    top-level import would have broken `import harness_runtime` entirely on Windows, since
    `harness_runtime.types` imports `ProtectedResultStore` unconditionally -- caught at
    out-of-family Codex round 1). 4 rounds of `just codex-review main` to clean convergence:
    round 1 (the Windows-import [P1] above, plus a [P2] where the write-once regression test
    did not isolate `_publish_atomic`''s own lock use -- a fresh child store''s opportunistic
    pre-write GC sweep already acquires the same lock, so the test passed even with
    `_publish_atomic`''s lock removed alone); round 2 (the new tests would spuriously fail on
    Windows, where the lock intentionally no-ops -- added `skipif`; the readiness marker was
    written before `flock` was ever attempted, leaving a scheduling window); round 3 (the same
    underlying concern persisted -- writing the marker "right before" the contending call
    still is not proof of being AT the `flock` attempt, since real serialization + Fernet
    encryption happen first -- fixed by wrapping `fcntl.flock` itself in each child script so
    the marker fires at the actual syscall attempt); round 4 clean. Each fix was
    mutation-probe-verified (revert the fix, confirm the corresponding regression test fails;
    restore, confirm green) before landing. `merge-gate` 3-lens review: concurrency + test-
    witness APPROVE at round 1; spec-conformance BLOCKED once (this ledger row was not
