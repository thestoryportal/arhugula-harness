    summary: "Parent pause_reason ignored a nested child's OWN HITL_PENDING pause, always defaulting to EXPLICIT_OPERATOR."
    close_out: "SCOPE NARROWED from the original coupled finding after out-of-family Codex review caught 3 real bugs in a first attempt at the routing half (see B-39): (1) a naive 'any paused child -> HITL_PENDING' label mislabeled a nested EXPLICIT_OPERATOR pause -- fixed by checking child_snapshot.pause_reason directly at both PARALLELIZATION and ORCHESTRATOR_WORKERS/HIERARCHICAL_DELEGATION sites, any nested HITL_PENDING relabels, EFFECT_FENCE_AMBIGUOUS keeps top precedence. impl-to-cleared-spec (WorkflowPauseReason.HITL_PENDING's existing 'HITL gate opened; workflow paused awaiting operator response' semantic already covers a nested gate without extension) -- no CP spec delta needed. Mutation-probed both the true and false branches (contrasting-baseline + positive test); both confirmed load-bearing. A SECOND out-of-family Codex round then flagged the corrected label itself as a potential false-affordance (an operator seeing accurate HITL_PENDING might assume a single hitl_response safely resolves it even with >1 concurrently-paused child). Grounded via direct grep before deciding: pause_reason is read in exactly one non-telemetry place (this label-derivation code) and the composer's actual resume path (consume_and_clear) never branches on pause_reason at all -- no consumer auto-dispatches a response off this label, so the label is informational-only and safe to ship as corrected. Added an explicit code comment at both sites documenting this + cross-referencing B-39 so the limitation cannot be silently assumed away. The response-ROUTING half (multiple concurrently-paused children each getting their own operator response) is NOT closed here -- see B-39. CORRECTION (merge-gate 3-lens review): the original close_out claimed 'mutation-probed both branches at both sites' -- this was only true of the PARALLELIZATION site; the ORCHESTRATOR_WORKERS/HIERARCHICAL_DELEGATION site had ZERO test witness (test_workflow_driver_fanout_pause.py had no HITL_PENDING assertion at all). Fixed by adding a contrasting-baseline assertion to the existing test_cancellation_race_captures_paused_child_among_failing_siblings + a new positive test test_orchestrator_worker_child_hitl_pending_pause_labels_parent_hitl_pending, both mutation-probed (is -> is not flip at the second site's check correctly fails both new tests; restored, both pass). Also, spec conformance review found design-substrate/Spec_Control_Plane_v1_97.md Section21's registered-forward-work note still canonically asserted gaps (b)+(c) are 'coupled... travel together as one forward arc' -- stale-carry-text now contradicted by shipping (c) alone; closed via a CP spec delta (v1.99->v1.100) correcting that framing, mirroring the B-31/v1.99 precedent for closing a Section21-registered gap."
    council: "no -- mechanical fix once the labeling logic was corrected; the routing half's council question is now moot per B-39's disposition"
