  summary: 'Registered at the B-48 apply arc (codex round-10 [P1] "split the fence guard between
    sequential writes"): at sub_agent_dispatch.py:744-750 (and the durable-output/ledger pair in
    `_execute_workflow_body`), one `effect_entry()` guard wraps a SEQUENCE of independent effects
