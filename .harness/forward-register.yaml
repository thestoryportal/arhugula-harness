# Post-Phase-8 forward-work register — structured source of truth.
#
# WHY THIS EXISTS: `.harness/post-phase-8-forward-register.md` (the prose home) grew to
# 36 B-* items / ~14K words of hand-maintained markdown with no queryable structure —
# the same "hand-maintained markdown drifts / is expensive to re-read from a fresh
# context" defect class R-IF-114 fixed for the R-FS-1 build arc via
# `.harness/arc-ledger.yaml` + `tools/arc_ledger.py`. That fix does NOT cover THIS
# register: `arc-ledger.yaml`'s own `rfs1_status: resolved` pin REQUIRES zero open
# standalone rows (see `tools/arc_ledger.py`'s `RFS1_ZERO_OPEN_ALLOWED` invariant) —
# R-FS-1/R-FS-2 are CLOSED build arcs, and adding new post-closure forward items there
# as `status: registered` rows would hard-fail `arc_ledger.py --check` (verified
# empirically before this file was authored — do not fold this register into
# arc-ledger.yaml). This is a SIBLING schema/tool for a DIFFERENT, still-open
# lifecycle bucket, mirroring arc-ledger.yaml's proven pattern: one structured source,
# a pure derive(), a validate() with a snapshot pin, and a blocking `--check` CI gate.
#
# PROSE HOME: rich per-item prose (What it is / Current state / Close-out steps /
# Council rationale) stays at `.harness/post-phase-8-forward-register.md` — each row
# below carries only a one-line `summary` + `close_out` + a `heading` back-pointer
# (the exact `### B-NN ·...` markdown heading text) so a query tool can pull the full
# prose on demand. No prose is duplicated into this file.
#
# STANDING DIRECTIVE (operator 2026-07-14, [[full-register-ground-every-arc-before-blocking]],
# Project_Roadmap_v1.md §5.0b): every row below — INCLUDING registered_finding /
# operator_gated / design_substrate_gated / the empty B-16 speculative bucket — gets an
# active grounding pass against the cited spec/ADR/plan section(s) before it is built or
# left open. The status enum below describes CURRENT state, not a license to skip
# investigation. Only `held` (an already-ratified operator DEFER) stops without a fresh
# grounding pass.
#
# STATUS ENUM (the ONLY place this mapping lives):
#   open                   — actionable now, no blocker.
#   design_substrate_gated — needs a Class 1 fork doc (X-AL-3) before any code change.
#   registered_finding     — a real gap surfaced during another arc's review/build;
#                            grounded against the spec (not skipped), and opens for BUILD
#                            once grounding confirms a genuinely buildable slice or a live
#                            consumer/trigger appears (the "register-then-triage, not drop"
#                            discipline — 2026-07-14: triage means investigate, not defer).
#   operator_gated         — needs a credential / D-ADR / cloud provisioning decision
#                            only the operator can make; still grounded + Claude-slice-built
#                            up to that genuine gate first.
#   held                   — an explicit operator DEFER-INDEFINITELY ratification;
#                            not silently reopened.
#   closed                 — built + merged, or foreclosed/superseded; kept for history.
#
# FORWARD-ONLY: a real transit (an item opens/closes, a new one surfaces) edits the
# row AND bumps the `snapshot:` block (counts AND `identity_digest`) in the SAME
# commit — mirrors arc-ledger.yaml's own forward-only discipline.
# `identity_digest` = sha256 of the sorted "id:status" pairs; catches two items
# swapping statuses while the aggregate counts stay put (a plain count pin can't).
# `tools/forward_register.py --check` is the CI gate.

