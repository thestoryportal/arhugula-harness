- id: B-60
  title: Cancellation fence not checked at nonlinear-topology child entry points
  status: closed
  pr: '#1075'
  summary: 'Registered at the B-48 apply arc (codex round-10 [P1] "check cancellation before
    nonlinear topology dispatch"): when an offloaded child workflow uses PARALLELIZATION,
    ORCHESTRATOR_WORKERS, or HIERARCHICAL_DELEGATION, `_execute_workflow_body` returns into the
    topology-strategy handler before ever reaching the linear step loop''s `_dispatch_cancel_token.check()`
    (workflow_driver.py:4357-4359). If an ancestor timeout trips the token between fan-out phases (e.g.
    between warm-up Phase 1 and Phase 2, or between a HIERARCHICAL_DELEGATION recursion level), the
    child can continue scheduling later work past the fence grace at those branch/level boundaries --
    the linear-path check this arc added does not extend to the nonlinear dispatch entry points. Not a
    regression introduced by round 9/10''s admission-deferral or future-publication fixes; a pre-existing
    coverage gap in the round 4-8 cancellation-fence work, surfaced for the first time at round 10.'
  close_out: 'Needs equivalent `_dispatch_cancel_token.check()` calls at each nonlinear-topology
    strategy''s entry point (before `_execute_parallelization` / `_execute_orchestrator_workers` /
    the HIERARCHICAL_DELEGATION recursion re-entry begins dispatching) and likely at each fan-out
    phase boundary (post warm-up Phase 1, pre Phase 2) -- not just once at function entry, since the
    fence can trip mid-fan-out. Ground against CP spec v1.102 / Runtime spec v1.102 section 14.8.10.3''s
    fence-ack contract before building: determine whether ''check once at strategy entry'' or ''check at
    every phase boundary'' is the spec-intended granularity.'
  council: 'yes if opened -- C1 orchestration (fan-out phase structure) vs C9 reliability (fence
    completeness) is a nameable tension'
  heading: '### B-60 · Cancellation fence not checked at nonlinear-topology child entry points
    *(registered at the B-48 apply arc, codex round-10, 2026-07-19)*'

- id: B-61
  title: Buffered fan-out ledger drain writes are not fenced
  status: closed
  pr: '#1072'
  summary: 'Registered at the B-48 apply arc (codex round-10 [P1] "fence each buffered ledger
    append"): `drain_branch_buffers`''s real `writer.append(...)` calls (workflow_driver.py:1922-1924)
    run without `effect_entry()` or `check()`. When a timed-out offloaded child is inside a nested
    fan-out, its cancel token can trip while branch tasks are still finishing; `_finish()` still
    reaches these physical ledger appends afterward, uncounted by `_effects_in_flight` and unblocked
    by the fence -- so `wait_ack()` can classify the timeout as `ACKED_CLEAN` even though F2 ledger
    entries actually begin writing after the trip. Not a regression introduced by round 9/10''s
    admission-deferral or future-publication fixes; a pre-existing coverage gap in the round 4-8
    cancellation-fence work (the effect_entry() guard was applied to the direct dispatch write paths,
    not the buffered-writer drain path), surfaced for the first time at round 10.'
  close_out: 'Needs the same `effect_entry()`/`check()` guard `drain_branch_buffers`''s sibling direct
    writes already carry (per the round 6/7 fixes), applied at each real `writer.append()` inside the
    drain loop. Ground against whether drain time is single-threaded-post-barrier (making a coarser
    single guard around the whole drain loop sufficient) or whether per-append granularity is required
    -- resolves the discriminator B-62 below shares.'
  council: 'no -- narrow, single-site guard-application fix once the drain-loop threading model is
    confirmed'
  heading: '### B-61 · Buffered fan-out ledger drain writes are not fenced
    *(registered at the B-48 apply arc, codex round-10, 2026-07-19)*'

- id: B-62
  title: A single effect_entry() guard spans multiple independent sequential writes
  status: closed
  pr: '#1072'
  summary: 'Registered at the B-48 apply arc (codex round-10 [P1] "split the fence guard between
    sequential writes"): at sub_agent_dispatch.py:744-750 (and the durable-output/ledger pair in
    `_execute_workflow_body`), one `effect_entry()` guard wraps a SEQUENCE of independent effects
    (ledger append, then signing, then audit append). If the token trips while the FIRST write is
    executing, the guard remains entered for the whole block -- it permits the already-running
    operation to finish (correct), but ALSO permits the subsequent signing + audit append to begin
    without a fresh consultation of the token, since the guard was entered before the trip and never
    re-checked mid-block. Not a regression introduced by round 9/10''s admission-deferral or
    future-publication fixes; a pre-existing granularity gap in the round 4-8 cancellation-fence work,
    surfaced for the first time at round 10.'
  close_out: 'Needs each independent effect (ledger append / signing / audit append) wrapped in its
    OWN `effect_entry()` call rather than one guard spanning all three, so a trip between operations
    is caught before the next one begins. Ground against whether signing is itself effect-bearing
    (network call to the KMS backend per ADR-D8) or purely computational before deciding scope --
    shares the drain-loop threading-model discriminator with B-61.'
  council: 'no -- narrow, per-site guard-splitting fix once the signing effect-classification is
    confirmed'
  heading: '### B-62 · A single effect_entry() guard spans multiple independent sequential writes
    *(registered at the B-48 apply arc, codex round-10, 2026-07-19)*'

- id: B-63
  title: SigningBackend.verify() infra failures are not typed-availability at the concrete backend
  status: closed
  pr: '#1073'
  summary: 'Registered at the U-OD-55 impl arc (codex round-10 [P2] "translate verify outages into
    the OD availability type"): OD spec v1.34 section 21.2.2 row 7(b) requires backend availability
    errors during verification to surface through a dedicated typed availability error. The
    `AwsKmsSigningBackend.verify()` concrete backend (harness-cp, B-36/ADR-D8) catches only
    `KMSInvalidSignatureException` and returns False for it; any OTHER boto3/KMS failure (credential,
    network, throttling, service exception) propagates as a raw vendor exception, unclassified.
    Confirmed architecturally cross-axis at grounding: the `SigningBackend` Protocol
    (`harness_cp.f5_signing_key_resolution`) documents no availability-exception contract at all
    (checked directly, not inferred) -- and even if it did, the OD-owned
    `AuditVerificationBackendUnavailableError` cannot be raised by a CP-axis backend without CP
    importing FROM OD, which the axis-import direction (OD consumes CP; not the reverse) forbids. A
    blanket `except Exception` at the OD-axis verifier call site is not a substitute -- it would
    misclassify genuine backend defects as availability, which the same row 7(b) text forbids
    ("raises that are NOT the typed availability error and NOT AuditSignatureInvalid are DEFECTS and
    propagate unwrapped"). U-OD-55''s own per_family_audit_verification.py docstring previously
    claimed "a well-behaved backend implementation is expected to raise THIS type itself" -- corrected
    in-place at this same PR to state the gap accurately (no such contract exists yet) rather than
    assert an architecturally-impossible design. CONCRETE INSTANCE (codex round-12, same PR): when a
    resolver returns `AwsKmsSigningBackend` for a key_id absent from that instance''s OWN internal
    `_key_arns` mapping, `verify()` raises `UnknownSigningKeyIdError` (a `KeyError` subclass) BEFORE
    reaching KMS -- semantically identical to "the composition root failed to supply the key" (the
    exact category `AuditVerificationBackendUnavailableError`''s docstring already describes), but
    unreachable to translate at the OD-axis verifier without importing a name from ONE SPECIFIC
    backend''s implementation module (`harness_cp.aws_kms_signing_backend`, not the generic
    `SigningBackend` Protocol module) -- the same wrong-direction coupling this row already forecloses,
    confirmed by grep: `UnknownSigningKeyIdError` is defined and used ONLY in that one backend module,
    not on the Protocol. Same registered gap, not a second independent defect -- the close_out below
    already covers it (the shared contract, once it exists, is what any concrete backend''s "unknown
    key" condition would raise).'
  close_out: 'Needs a shared/CP-side (or harness-core) typed availability-exception contract that
    `SigningBackend` implementations (starting with `AwsKmsSigningBackend`) raise for infra failures
    distinct from a genuine signature mismatch, PLUS a translation catch at the OD-axis verifier call
    sites (`_verify_entry_signature` / `verify_cutover_record_signature`) that maps the CP/core type
    to `AuditVerificationBackendUnavailableError`. Cross-axis scope (touches harness-cp production
    code already shipped under B-36/PR #1031) -- out of U-OD-55''s OD-axis-only reach; does not block
    U-OD-55''s merge (the resolver-path availability typing -- unknown key_id -- is already correct
    and covers the row 7(b) example explicitly named in spec text; this residual is the real-backend
    infra-failure sub-case only).'
  council: 'no -- narrow, single cross-axis contract addition once a concrete infra-failure taxonomy
    is confirmed against the deployed backend(s)'
