- id: B-77
  title: Protected result store's mtime refresh is not durable atomically with the publish
    commit, leaving a crash window where a recovered entry looks pre-aged
  status: closed
  pr: '#pending'
  summary: 'NARROWED TWICE, not closed, 2026-07-26 (PR #1123). This PR went through THREE wrong
    claims before landing here, all caught by out-of-family Codex: round 1 tried to classify
    B-77 as dormant via a "sub-millisecond os.link-to-os.utime window" argument (wrong -- the
    real pre-fix window was the FULL pre-link write+fsync duration, unbounded). Round 2 moved
    the SOLE mtime refresh from post-commit to pre-commit and claimed this "closes the window
    structurally" (wrong -- Codex round 9 [P1] reproduced a DIFFERENT, normal-path regression
    against `main`: with the stamp now BEFORE the metadata-fsync+`os.link`+directory-fsync tail
    instead of after, a successful uninterrupted write could return a reference an IMMEDIATE
    sweep reclaims, `ttl_seconds=0.02` + a 100ms-delayed directory fsync -- something that could
    never happen on `main`, where the stamp already ran after that tail). Round 3 (current):
    `_publish_atomic` now stamps TWICE -- once pre-commit (on the temp file, for crash recovery)
    AND once post-commit (on the entry, restoring `main`''s exact original normal-path
    behavior) -- rather than moving the single stamp. This is a strict improvement over `main`
    on both axes (normal path unchanged from `main`; crash-after-link path now recovers the
    pre-commit stamp instead of `main`''s raw write-time value) with no reopened ground. The
    residual crash window is now `os.link` -> the post-commit refresh completing -- the SAME
    shape B-77 originally named, starting from the fresher pre-commit baseline rather than
    write-time. Restoring the post-commit block also reintroduces a pre-existing, OUT-OF-SCOPE
    inconsistency the round-2 reorder had incidentally fixed: if the post-commit refresh''s own
    fsync fails, `write_once` reports `UnresolvableResultRef` even though `entry_path` is
    already durably linked and readable -- this matches `main`''s original semantics and is
    intentionally NOT fixed here (recording it so it is not later rediscovered as novel).
    Mutation-probe-verified regression tests added for BOTH the crash-recovery path (pre-commit
    stamp) and the normal-path regression Codex round 9 found (post-commit stamp); the residual
    (post-link-to-post-commit-refresh tail) is registered, not tested, since no fix for it has
    landed. merge-gate 3-lens review approved the round-2 diff; only the concurrency lens was
    re-run for round 3 (the durability-step change is inside the same lock its reasoning already
    covered) per advisor()-directed scope. CLOSED 2026-07-30 (PR #pending, branch
    b77-gc-first-observation-grace-20260730) -- the close_out''s own fix landed as a
    FIRST-OBSERVATION GRACE inside `gc_sweep`, with no fourth reordering of the two-stamp
    pipeline and no narrowing of `ttl_seconds`. The residual window this row named (a crash
    strictly between `os.link` and the post-commit refresh completing, leaving a live entry
    carrying the pre-commit stamp) is no longer reclaimable on sight: an entry is collected
    only if it was ALREADY observed past TTL at a PRIOR sweep of the same root. The
    OUT-OF-SCOPE inconsistency this row also recorded (a failing post-commit refresh fsync
    reporting `UnresolvableResultRef` for an entry already durably linked) is UNCHANGED and
    still not fixed -- it remains `main`''s original semantics, recorded here so it is not
    later rediscovered as novel.'
  close_out: 'CLOSED by the landed fix, 2026-07-30. MECHANISM: `gc_sweep` records the
    filenames it verified past TTL under its own lock and reclaims only those a PRIOR sweep
    of the same root already recorded (`ProtectedResultStore._observe_expired` +
    the module-level `_root_observed_expired` registry in
    `harness-runtime/src/harness_runtime/lifecycle/protected_result_store.py`). PERSISTENCE
    JUDGMENT: the observation record is module-wide, keyed by the root''s filesystem
    identity (`_root_identity_key`, extracted from `_lock_for_root` so both key the same
    way) -- NOT per-instance. Grounded against the real call graph: the composition root
    builds a FRESH `ProtectedResultStore` per `run()`/`resume()` bootstrap
    (`bootstrap/factories/protected_result_store_factory.py:78` <- `bootstrap/stage_4_od.py:123`,
    which sweeps immediately), so a per-instance record would hand EVERY bootstrap sweep a
    fresh grace and defer reclaim to shutdown indefinitely, weakening the spec''s
    bounded-retention term. A fresh PROCESS legitimately starts with an empty registry --
    it cannot distinguish a genuine age from a crash-window artifact, so granting the grace
    is the safe direction, and that IS exactly the crash-recovery case. No new config
    surface, no new public API, no persisted sidecar. WITNESSES (all mutation-probed, in
