ers a pre-dispatch gate-owning branch, delivers its HITLDeliveryCell, and drives the dispatch into a REAL nested child pause (via a faithful RuntimeSubAgentDispatcher double dispatching a real execute_workflow that itself pauses) or an effect-fence-ambiguous outcome, proving exclusion from pre_dispatch_gate_owning_branches. All 7 tests total mutation-probe verified against both construction sites, confirmed byte-identical (grepped before starting step 2, per advisor()''s direction, to rule out a production asymmetry before treating this as pure test-parity work). merge-gate 3-lens all-approve at round 1 on both PRs; just codex-review converged clean at round 1 on both. merge-gate test-witness lens on PR #1119 found a docstring accuracy nit (the paused-child dispatcher docstrings overclaimed hitting the direct own-dispatch exception handler when real thread-scheduling timing more likely hits the in-flight-cancellation-race handler; both write the same disposition dict identically, so mutation-probe validity was unaffected) -- fixed inline, no re-gate needed.'
