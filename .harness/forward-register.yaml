- id: B-71
  title: Operator-facing HITL escalation requests carry no run-instance-distinct correlation
    identifier
  status: registered_finding
  summary: HITLEscalationBrief and the HITL webhook payload derive their identifiers from a
    workflow_id-scoped action_id (compose_hitl_action_id), not run_id -- two peer branches sharing
    a child_workflow_id produce byte-identical escalation requests, making B-39's hitl_responses
    run_id-keyed addressing impossible to use in that exact scenario.
  close_out: 'DOC-ONLY GROUNDING PASS 2026-07-27 (no spec/plan change landed -- a drafted fix
    was reverted pre-merge). A run_id-threading fix was authored across both CP and Runtime
    axes (StepExecutionContext + HITLEscalationBrief gain run_id; webhook idempotency-key +
    payload incorporate it) and taken through 5 rounds of out-of-family just codex-review-uncommitted,
    each round catching a genuine defect (Optional-vs-required breakage, missing None-guard,
    wrong exception classification, wrong unit ownership). Round 5 found the fix''s premise
    itself is false: RuntimeHITLGateComposer fires _escalate_to_secondary_channel INSIDE the
    PARENT''s dispatch of a SUB_AGENT_DISPATCH step, BEFORE RuntimeSubAgentDispatcher mints any
    child run_id -- execute_workflow''s run_id is per-PARENT-RUN, not per-branch, so every peer
    branch of one fan-out shares the identical value. A `...:{run_id}` key therefore does NOT
    disambiguate B-71''s actual collision; advisor() confirmed this and directed a full revert
    rather than a 6th patch (5 consecutive rounds each fixing the wrong layer is the non-convergence
    signal). This is the SAME pre-dispatch-identity problem B-72 CP spec v1.108 property 6
    already owns (a branch_index-derived tree-wide-unique INTERNAL identity, deliberately NOT
    hitl_responses/run_id-addressable, per v1.108 Section 1.1(b): "no child_run_id exists to
    key by"). The real fix needs a branch-distinct identity co-designed with B-72''s mechanism
    -- not a mechanical run_id field-add -- and it touches an operator-facing/webhook-EXTERNAL
    payload, which is a new design decision. This is the THIRD falsified premise this row has
    carried (registration-time "run_id already accessible", round-1 "required field is safe",
    round-5 "run_id disambiguates peers") -- next attempt must ground the branch-distinct-identity
    design BEFORE drafting spec text. See .harness/post-phase-8-forward-register.md B-71 for
    full detail.'
  council: 'OPEN -- needs a real convening (C1 orchestration + C9/C10 blast-radius/action-safety)
    co-designed with B-72 property 6''s internal-identity mechanism before the next build
    attempt. The prior "narrow field-add, no council needed" framing was wrong -- this is an
    operator-facing/webhook-external payload carrying a NEW branch-distinct identity, not an
    additive dict-key expansion.'
  heading: '### B-71 · Operator-facing HITL escalation requests carry no run-instance-distinct
    correlation identifier, making `hitl_responses` addressing impossible for peer branches
    sharing a `child_workflow_id` *(registered at the B-39 spec-leg PR #1092, out-of-family
    Codex round 6 (branch-vs-main), 2026-07-23)*'
