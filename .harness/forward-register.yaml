- id: B-73
  title: Protected result store's GC/publish synchronization is in-process only -- two co-resident
    OS processes sharing one store root are not mutually excluded
  status: closed
  pr: "#1120"
  summary: 'Split out of B-68 at its close (2026-07-25). CLOSED 2026-07-26 at PR #1120:
    `_cross_process_lock()` (an `fcntl.flock` on a dedicated `.cross_process.lock` file,
    disjoint from both `gc_sweep` glob patterns) is now composed INSIDE the existing
    in-process `self._publish_lock` at both `_publish_atomic` and `gc_sweep`''s
    candidate-selection phase -- a single, fixed nesting order everywhere, no lock-ordering
    hazard. Guarded on Windows (`_IS_WINDOWS = sys.platform == "win32"`) per C-STK-10,
    mirroring the same carve-out already shipped at `harness_is.cross_process_ledger_lock`;
    `fcntl` is imported lazily inside the lock method, never at module scope (an unguarded
