- id: B-60
  title: Cancellation fence not checked at nonlinear-topology child entry points
  status: closed
  pr: '#1075'
  summary: 'Registered at the B-48 apply arc (codex round-10 [P1] "check cancellation before
    nonlinear topology dispatch"): when an offloaded child workflow uses PARALLELIZATION,
    ORCHESTRATOR_WORKERS, or HIERARCHICAL_DELEGATION, `_execute_workflow_body` returns into the
    topology-strategy handler before ever reaching the linear step loop''s `_dispatch_cancel_token.check()`
    (workflow_driver.py:4357-4359). If an ancestor timeout trips the token between fan-out phases (e.g.
    between warm-up Phase 1 and Phase 2, or between a HIERARCHICAL_DELEGATION recursion level), the
    child can continue scheduling later work past the fence grace at those branch/level boundaries --
    the linear-path check this arc added does not extend to the nonlinear dispatch entry points. Not a
    regression introduced by round 9/10''s admission-deferral or future-publication fixes; a pre-existing
    coverage gap in the round 4-8 cancellation-fence work, surfaced for the first time at round 10.'
  close_out: 'Needs equivalent `_dispatch_cancel_token.check()` calls at each nonlinear-topology
    strategy''s entry point (before `_execute_parallelization` / `_execute_orchestrator_workers` /
    the HIERARCHICAL_DELEGATION recursion re-entry begins dispatching) and likely at each fan-out
    phase boundary (post warm-up Phase 1, pre Phase 2) -- not just once at function entry, since the
    fence can trip mid-fan-out. Ground against CP spec v1.102 / Runtime spec v1.102 section 14.8.10.3''s
    fence-ack contract before building: determine whether ''check once at strategy entry'' or ''check at
    every phase boundary'' is the spec-intended granularity.'
  council: 'yes if opened -- C1 orchestration (fan-out phase structure) vs C9 reliability (fence
    completeness) is a nameable tension'
  heading: '### B-60 · Cancellation fence not checked at nonlinear-topology child entry points
    *(registered at the B-48 apply arc, codex round-10, 2026-07-19)*'

- id: B-61
  title: Buffered fan-out ledger drain writes are not fenced
  status: closed
  pr: '#1072'
  summary: 'Registered at the B-48 apply arc (codex round-10 [P1] "fence each buffered ledger
    append"): `drain_branch_buffers`''s real `writer.append(...)` calls (workflow_driver.py:1922-1924)
    run without `effect_entry()` or `check()`. When a timed-out offloaded child is inside a nested
    fan-out, its cancel token can trip while branch tasks are still finishing; `_finish()` still
    reaches these physical ledger appends afterward, uncounted by `_effects_in_flight` and unblocked
    by the fence -- so `wait_ack()` can classify the timeout as `ACKED_CLEAN` even though F2 ledger
    entries actually begin writing after the trip. Not a regression introduced by round 9/10''s
    admission-deferral or future-publication fixes; a pre-existing coverage gap in the round 4-8
    cancellation-fence work (the effect_entry() guard was applied to the direct dispatch write paths,
    not the buffered-writer drain path), surfaced for the first time at round 10.'
  close_out: 'Needs the same `effect_entry()`/`check()` guard `drain_branch_buffers`''s sibling direct
    writes already carry (per the round 6/7 fixes), applied at each real `writer.append()` inside the
    drain loop. Ground against whether drain time is single-threaded-post-barrier (making a coarser
    single guard around the whole drain loop sufficient) or whether per-append granularity is required
    -- resolves the discriminator B-62 below shares.'
  council: 'no -- narrow, single-site guard-application fix once the drain-loop threading model is
    confirmed'
  heading: '### B-61 · Buffered fan-out ledger drain writes are not fenced
    *(registered at the B-48 apply arc, codex round-10, 2026-07-19)*'

- id: B-62
  title: A single effect_entry() guard spans multiple independent sequential writes
  status: closed
