- id: B-30
  title: Cost-attribution disambiguator replay-semantics inconsistency
  status: registered_finding
  summary: 'Validator''s F2 anchor write (only) IDEMPOTENT_NOOPs on a deterministic-disambiguator replay;
    tool/LLM/webhook always create a new F2 entry. The AUDIT-LEDGER append specifically is PROVEN to dedupe
    for LLM+JOURNAL_RESUME (existing witness test, on-disk audit: entry count only -- the run-scoped cost
    accumulator/RunResult.cost_attribution is NOT exercised by that test) and UNVERIFIED for the other
    3 composers/engine classes (correction, 2026-07-15). NOT an undecided policy, but also not just a
    missing consumer: ADR-D6 v1.2 §1.5 + C-OD-14 §14.5.1 already specify a complete replay-dedup algorithm
    (harness_od.idempotency_join_dedup.dedupe_on_replay) with no production ingestion-layer caller anywhere
    in the codebase, AND all 4 composers hard-code engine_replay_disposition=NO_REPLAY with no override
    -- a producer-side gap in addition to the missing consumer.'
  close_out: 'NOT closed -- sharpened, not council-eligible, not yet buildable. Personally verified (not
    just the grounding agent''s paraphrase) that ADR-D6 v1.2 §1.5''s algorithm is specified as ingest_span(span)
    -- a TRACE-INGESTION-time function operating on spans read from the observability pipeline -- not
    something a per-dispatch composer calls inline while producing its own F2 write. Wiring dedupe_on_replay
    directly into the 4 attribute_*_dispatch_cost composers (as an initial grounding pass recommended)
    would be a category error: the correct call site is an ingestion-layer consumer that doesn''t exist
    in production yet, not merely an unimplemented wiring step inside the composers. Separately, the prior
    B-COST-REPLAY-DEDUP-WITNESS closure record (.harness/b-cost-replay-dedup-witness-closure-record.md,
    CLOSED GREEN no-fix) already verified the IS-layer content-addressed ledger write independently provides
    the real replay-dedup guarantee for the JOURNAL_RESUME/PURE_PATTERN_NO_ENGINE engine class, and its
    own scope note explicitly pre-commits any adjacent replay-dedup finding to register-don''t-build,
    not a broadening of that arc. Webhook''s fresh-uuid4-per-attempt billing is confirmed deliberate --
    the actual rationale lives at webhook_delivery_composer.py:363-371''s inline comment (''this method
    fires unconditionally on every invocation -- no idempotent skip at this layer. A fresh UUID per call
    guarantees each invocation gets its own F2 anchor''), an intentional out-of-family-Codex-round-5 fix,
    not an oversight to align away. Out-of-family Codex flagged three further nuances in THIS correction
    across three rounds, all addressed same-PR: (1) the paragraph above must not be read as settling whether
    validator''s F2-key collision actually dedupes the BILLABLE cost event -- it only describes the F2
    anchor identity write, a SEPARATE content-hash-addressed audit_writer.append whose own dedup depends
    on AuditPayload byte-identity. (2) A third mechanism exists: ALL 4 production cost-wrapper call sites
    unconditionally append the returned SpanCostRecord to a run-scoped accumulator (cost_record_sink),
    which api.py''s _build_run_result rolls into RunResult.cost_attribution, bypassing both the F2 dedup
    and audit-ledger dedup. (3) Round-3 correction to both (1) and (2): test_journal_resume_completed_run_retry_does_not_double_emit_cost
    already drives attribute_llm_dispatch_cost twice under JOURNAL_RESUME and proves the audit-ledger
    layer DOES dedupe for LLM+JOURNAL_RESUME specifically -- ''unverified for any composer'' was too strong;
    the real gap is the OTHER 3 composers and OTHER engine classes. And the run-scoped accumulator is
    FRESH per public run()/resume() invocation (api.py:900, COST_ACCUM_VAR.set(CostRecordAccumulator()))
    -- a crash-then-separate-resume-call does NOT carry the prior invocation''s records forward, so the
    accumulator is NOT a confirmed cross-invocation dedup-failure layer; it only risks double-counting
    for repeated dispatches WITHIN one invocation or external aggregation across separate RunResults,
    neither established as a production concern. (4) Round-4 correction: calling the gap solely a missing
    ingestion consumer is itself incomplete -- verified all 4 attribute_*_dispatch_cost composers hard-code
    engine_replay_disposition=_DEFAULT_REPLAY_DISPOSITION (= ReplayDisposition.NO_REPLAY) with no parameter
    to carry the real disposition (cost_attribution_llm_dispatch.py:88,239; cost_attribution_tool_dispatch.py:90,295;
    cost_attribution_webhook_dispatch.py:65,204; cost_attribution_validator_dispatch.py:86,243). Even
    a built ingest_span consumer could never see CHECKPOINT_RESUME/RECONCILER_ITERATION/WAL_CONSUME from
    any composer today -- a producer-side wiring gap alongside the missing consumer. Close-out path once
    a real trigger exists: (1) resolve where ingest_span''s production call site actually lives (or should
    be built) before touching any composer; (2) verify whether double-billing is an ACTUAL exercised risk
    for the durable engine classes (SAVE_POINT_CHECKPOINT/EVENT_SOURCED_REPLAY/RECONCILER_LOOP/WAL_SEGMENT)
    whose resume_at skip logic may already prevent re-dispatch of completed steps, mirroring the JOURNAL_RESUME
    finding; (3) extend the existing JOURNAL_RESUME+LLM audit-ledger witness pattern to the other 3 composers,
    and separately verify whether a within-invocation retry (not cross-invocation resume) can double-append
    to the accumulator in production; (4) thread the real engine_replay_disposition into all 4 composers
    so a future ingestion consumer can actually discriminate replay dispositions. Only then decide whether
    composer-level wiring is even the right fix, and at which layer. Mirrors the B-19/B-42 discipline
