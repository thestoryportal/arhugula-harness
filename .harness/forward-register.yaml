- id: B-79
  title: 'A resumed branch''s HITLDeliveryCell is constructed from step_id identity alone, so a
    HITL placement/gate-configuration change between pause and resume is not detected as a
    material diff'
  status: registered_finding
  summary: 'Out-of-family Codex round 3 (branch-vs-main, B-72 impl leg PR #1116, 2026-07-25).
    The B-72 impl leg''s _resume_body_mismatch guard (mirroring the pre-existing
    effect_fence_paused_branches/paused_child_branches precedent) validates a pre-dispatch
    gate-owning branch''s step_id identity before delivering the operator''s resolved response,
    but does not validate whether the branch''s HITL placement (e.g. SUB_AGENT_BOUNDARY) or
    step_kind still applies to the resumed step. If a workflow is edited between pause and
    resume while preserving the branch''s step_id -- removing its SUB_AGENT_BOUNDARY placement,
    for instance -- the guard still accepts the resume and RuntimeHITLGateComposer''s Step 0
    unconditionally consumes and applies the stored HITLDeliveryCell (e.g. a REJECT) to the
    now-ungated branch, before any current-placement evaluation runs. Confirmed PRE-EXISTING and
    NOT introduced by the B-72 impl leg -- the identical unconditional construction (no
    placement-identity check at all) already exists at the already-shipped LINEAR resume_at
    delivery-cell site (workflow_driver.py ~4748-4777, landed at the B-39 impl leg), which
    B-72''s fan-out wiring mirrors verbatim -- confirmed by direct grep/read of that site before
    registering this row, per this workspace''s own codex-finding-scope-verify-sibling-pattern
    discipline.'
  close_out: 'Design a HITL placement/gate-configuration identity check (e.g. persisting the
    resolved set of applicable HITL placements, or a content hash of the step''s HITL-relevant
    fields, alongside step_id at pause-capture time) and validate it at BOTH the LINEAR
    resume_at site and the fan-out _resume_body_mismatch closures (_execute_parallelization /
    _execute_orchestrator_workers) before a HITLDeliveryCell is constructed -- reject the resume
    as a material diff if the check fails, mirroring the existing step_id/step_kind precedent.
    This is a genuine design task (what identity to persist, and whether the composer''s own
    persona/engine-class placement-resolution logic -- which harness-cp does not have visibility
    into, that logic being Runtime-owned -- needs a new cross-axis seam to expose it) not a
    mechanical patch. Witness with a test that edits a paused step''s HITL placement (or
    step_kind) between pause and resume while preserving step_id, and asserts the resume is
    rejected as a material diff rather than silently delivering the stale response.

    SCOPE BROADENED 2026-07-26 (B-78 impl leg, out-of-family Codex round 4, branch-vs-main PR
    #1117): the gap also manifests via a SECOND path this row did not originally name -- when NO
    HITLDeliveryCell is constructed at all (no addressed or uniform HITLResult resolves this
    resume cycle), execution still proceeds to dispatch rather than staying inert, relying
    entirely on RuntimeHITLGateComposer''s Step-0 consume-or-fresh-fire logic
    (hitl_gate_composer.py:1684-1688) to treat the dispatch as a brand-new gate evaluation. This
    is SAFE-BUT-WASTEFUL (a second webhook fire) when the step''s HITL placement is unchanged,
    but degrades to the SAME unauthorized-dispatch risk this row already describes if the
    placement was ALSO removed/altered between pause and resume, since the fresh-fire path''s
    "does this step still need a gate" check is exactly the material-diff validation this row
    calls for and that does not yet exist anywhere. Confirmed via direct grep that this is the
    identical pre-existing shape at the already-shipped LINEAR resume_at site AND now also
    reachable at the newly-landed EVALUATOR_OPTIMIZER/DECENTRALIZED_HANDOFF delivery-cell sites
    (B-78 impl leg, PR #1117) -- one shared root cause, four call sites (LINEAR, both fan-out
    closures, EO, DH). The close_out design task above (a persisted HITL-placement/
    gate-configuration identity, checked before ANY resume dispatch regardless of whether a
    delivery cell resolves) already covers this path; no separate fix is owed, this note only
    widens the reachability set the eventual fix must cover.'
  council: 'CONVENED 2026-07-27 (roadmap-continue, dyadic council-orchestrator pass, C10 + C1
    co-primary). Probe-first discipline run BEFORE deliberation falsified this row''s own
    premise: Runtime-owned persona/engine-class placement-resolution logic is NOT opaque to
    harness-cp for the scenario in scope -- step_context.hitl_placements (via
    fold_step_hitl_placements) and StepEffectiveBinding.removed_placements are BOTH CP-native,
    deterministic folds already computed at every dispatch/resume call; the composer
    (hitl_gate_composer.py) only CONSUMES the CP-folded value. Only the gate-LEVEL computation
    (persona_tier x blast_radius x mcp_trust_tier) is genuinely Runtime-resolved, and that is a
    function of deployment config, not the workflow-body edit this row''s reachability
    precondition describes -- so NO new cross-axis seam is needed. TENSION (narrow
    placement.position-only hash vs. broader full-HITLPlacement-tuple hash) probe-resolved:
    HITLPlacement is itself a frozen 4-field Pydantic model already inside the same tuple, so
    hashing all 4 fields (position/tool_filter/cascade_policy/timeout) + removed_placements
    costs nothing extra over the narrow framing -- both voices converged on the broader hash.
    RECOMMENDATION: persist a SHA-256 content hash over (ordered HITLPlacement tuple +
    sorted removed_placements) on the existing pause-capture carriers
    (PausedChildBranchResumeState / PreDispatchGateOwningBranchResumeState, drop-when-None
    byte-compat, mirroring the B-31 child_workflow_id / B-72 step_kind precedent exactly) +
    a new analogous carrier for the LINEAR resume_at site (which the probe found has NO
    per-step identity check at all today, not even step_id -- a slightly larger gap than the
    fan-out sites); companion fix owed at hitl_gate_composer.py''s Step 0 short-circuit
    (~1684-1750), which never gates delivery on placement drift today. FIX SIZE:
    mechanical-with-a-thin-design-decision, not a genuine architectural task. CLASSIFICATION:
    Class 1 -- every prior material-diff identity addition to these same carriers (step_kind;
    child_workflow_id at B-31/v1.99; the B-72 pre-dispatch-gate-owning identity itself at
    v1.107->v1.108) went through a CP spec-leg amendment before impl per C-CP-26 PauseResume
    Protocol authority; this is architecturally identical in kind, not bug-fix-shaped impl
    discretion. NEXT ACTION: open a CP spec-leg (fork doc or B-72-lineage follow-on) proposing
    the additive field(s) + a new §1.x invariant mirroring property 6''s shape, before any
    impl. Not yet opened this pass.'
