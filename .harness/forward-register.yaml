    ChildWorkflowRunner Protocol at lines 88-89/185-186/258-259), and TWO existing sibling
    values (hitl_uniform_fallback_eligible_run_id from B-39; effect_fence_uniform_fallback_
    eligible_key from B-70) already thread a root-computed signal through that identical
    channel. Also confirmed: compute_effect_fence_uniform_fallback_eligible_key is a PURE
    COMPUTED VALUE derived fresh from the already-persisted root_snapshot (workflow_driver.py:
