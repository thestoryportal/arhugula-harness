- id: B-77
  title: Protected result store's mtime refresh is not durable atomically with the publish
    commit, leaving a crash window where a recovered entry looks pre-aged
  status: registered_finding
  summary: 'NARROWED TWICE, not closed, 2026-07-26 (PR #1123). This PR went through THREE wrong
    claims before landing here, all caught by out-of-family Codex: round 1 tried to classify
    B-77 as dormant via a "sub-millisecond os.link-to-os.utime window" argument (wrong -- the
    real pre-fix window was the FULL pre-link write+fsync duration, unbounded). Round 2 moved
    the SOLE mtime refresh from post-commit to pre-commit and claimed this "closes the window
    structurally" (wrong -- Codex round 9 [P1] reproduced a DIFFERENT, normal-path regression
    against `main`: with the stamp now BEFORE the metadata-fsync+`os.link`+directory-fsync tail
    instead of after, a successful uninterrupted write could return a reference an IMMEDIATE
    sweep reclaims, `ttl_seconds=0.02` + a 100ms-delayed directory fsync -- something that could
    never happen on `main`, where the stamp already ran after that tail). Round 3 (current):
    `_publish_atomic` now stamps TWICE -- once pre-commit (on the temp file, for crash recovery)
    AND once post-commit (on the entry, restoring `main`''s exact original normal-path
    behavior) -- rather than moving the single stamp. This is a strict improvement over `main`
    on both axes (normal path unchanged from `main`; crash-after-link path now recovers the
    pre-commit stamp instead of `main`''s raw write-time value) with no reopened ground. The
    residual crash window is now `os.link` -> the post-commit refresh completing -- the SAME
    shape B-77 originally named, starting from the fresher pre-commit baseline rather than
    write-time. Restoring the post-commit block also reintroduces a pre-existing, OUT-OF-SCOPE
    inconsistency the round-2 reorder had incidentally fixed: if the post-commit refresh''s own
    fsync fails, `write_once` reports `UnresolvableResultRef` even though `entry_path` is
    already durably linked and readable -- this matches `main`''s original semantics and is
    intentionally NOT fixed here (recording it so it is not later rediscovered as novel).
    Mutation-probe-verified regression tests added for BOTH the crash-recovery path (pre-commit
    stamp) and the normal-path regression Codex round 9 found (post-commit stamp); the residual
    (post-link-to-post-commit-refresh tail) is registered, not tested, since no fix for it has
    landed. merge-gate 3-lens review approved the round-2 diff; only the concurrency lens was
    re-run for round 3 (the durability-step change is inside the same lock its reasoning already
    covered) per advisor()-directed scope.'
  close_out: 'advisor()-directed: do NOT add a TTL floor -- that is B-74''s own already-declined
    close_out option ("reject TTLs below a guaranteed timestamp resolution... a genuine design
    decision"), and the field is a spec''d deployment-configurable surface (Runtime v1.103
    SS14.8.11 AC 7) Phase-7 impl discretion should not narrow. The actual fix is an age
    authority that cannot predate publication by construction, not a further reordering of a
    two-stamp pipeline: `gc_sweep` should not reclaim an entry it has not observed in a PRIOR
    sweep (a grace period) -- bounded to one sweep interval, immune to arbitrary I/O latency in
    the publish path, implementable entirely inside `gc_sweep`/`_publish_atomic` without
    touching the config contract. Witness with a test that simulates a crash strictly BETWEEN
    `os.link` and the post-commit refresh completing (e.g. a monkeypatched post-commit
    `os.utime` that raises once) and asserts a subsequent bootstrap-style sweep does not reclaim
    the crash-recovered entry immediately.'
  council: no -- the grace-period fix shape is a known pattern (first-observation gating), not
    an open design question; narrow implementation-discretion follow-on once picked up
  heading: '### B-77 · Protected result store''s mtime refresh is not durable atomically with
    the publish commit, leaving a crash window where a recovered entry looks pre-aged *(surfaced
    at the B-68 impl arc, out-of-family Codex round 8 [P2], 2026-07-25)*'
- id: B-78
  title: A SUB_AGENT_DISPATCH step's own SUB_AGENT_BOUNDARY gate under EVALUATOR_OPTIMIZER or
    DECENTRALIZED_HANDOFF can exhibit the same pre-dispatch re-fire livelock B-72 property 6
    closes for the fan-out topologies, ungrounded by any reproduction
  status: closed
  summary: 'Split out of B-72''s spec leg at CP spec v1.108 SS1.2b (out-of-family Codex round 5,
    2026-07-25; round 7 [P2] flagged this exclusion as needing its own durable tracking, not
    just correction-history prose). Property 6 (v1.108 SS1) closes B-72 net-position item (1)
    ONLY for the PARALLELIZATION/ORCHESTRATOR_WORKERS/HIERARCHICAL_DELEGATION topologies -- the
    ones whose gate-owning-branch pause state is captured via the PeerFanOutResumeState/
    FanOutResumeState carrier family. A SUB_AGENT_DISPATCH step carrying its own
    SUB_AGENT_BOUNDARY placement under EVALUATOR_OPTIMIZER or DECENTRALIZED_HANDOFF is captured
    into a DIFFERENT carrier family instead (EvaluatorOptimizerResumeState/HandoffResumeState).
    GROUNDED 2026-07-26 (reproduction-first pass, real-stack integration tests against
    harness-runtime): the actual defect was WORSE than the registered livelock hypothesis -- a
    genuine `HITLPauseRequestedSignal` (a deliberate `BaseException`, not `Exception`) raised
    from `_dispatch_and_buffer`/the stage dispatcher inside `_execute_evaluator_optimizer` and
    `_execute_decentralized_handoff` was UNCAUGHT (no handler matched a bare `BaseException`
    subclass), crashing the run outright rather than pausing it; and separately, neither
    topology constructed a `HITLDeliveryCell` at its own resumed-step dispatch site at all, so
    even a caught pause could never deliver a resolved operator response on resume. CLOSED --
    IMPL LEG LANDED 2026-07-26 (PR #1117, branch b78-eo-dh-hitl-delivery-cell-impl-leg): mirrors
    the already-cleared LINEAR delivery-cell mechanism (CP spec v1.108 SS1 line 37) at both EO''s
    and DH''s own resumed-step dispatch sites -- a name-matched `except BaseException` catch
    (EO wraps it as `_EvaluatorOptimizerHITLPauseError`; DH catches inline) plus
    `HITLDeliveryCell` construction keyed on `resume_context.hitl_responses`/uniform-fallback
    eligibility, identical resolution shape to LINEAR/fan-out. No new CP-spec carrier field
    needed (EO/DH have no branch-ordinal ambiguity, unlike the fan-out topologies property 6 was
    built for) -- plain Phase-7 impl work, not Class 1. 5 rounds of out-of-family
    `just codex-review main` to convergence: round 1 (REJECT responses on resume must be
    terminal, not folded into a resumable pause) and round 2 (the round-1 terminal-carve-out was
    too broad, misclassifying a genuine non-HITL `rt_fail_class` as gate-terminal) and round 3
