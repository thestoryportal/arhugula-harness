    alongside its existing paused_child_branches walk; (c) construct a
    HITLDeliveryCell-equivalent on that branch own StepExecutionContext at the fan-out dispatch
    sites (_execute_parallelization ~7851-7866, _execute_orchestrator_workers ~11696-11710 --
    mirroring workflow_driver.py:4766-4777 LINEAR-only construction) ONLY when this internal
