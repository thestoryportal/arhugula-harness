    round 1 (the Windows-import [P1] above, plus a [P2] where the write-once regression test
    did not isolate `_publish_atomic`''s own lock use -- a fresh child store''s opportunistic
    pre-write GC sweep already acquires the same lock, so the test passed even with
    `_publish_atomic`''s lock removed alone); round 2 (the new tests would spuriously fail on
