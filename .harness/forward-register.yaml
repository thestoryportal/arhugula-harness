- id: B-45
  title: Cross-process ledger lock has no genuine Windows serialization backend
  status: registered_finding
  summary: '`harness_is.cross_process_ledger_lock` (B-40) degrades to a no-op on Windows (`sys.platform
    == "win32"`) rather than providing real cross-process serialization there — Windows sits at exact
    pre-B-40 parity (same as before the module existed), not at feature parity with POSIX. The identical
    gap already exists, unregistered until now, at `harness_runtime.lifecycle.reconciler_pause_resume_substrate`''s
    own unconditional `fcntl` import (that module isn''t eagerly imported at package `__init__`, so it
    doesn''t break basic import on Windows, but its lock is equally POSIX-only). 2026-07-30 post-#1159 re-check (gate-log LOW batch): TWO corrections, neither restructuring the close-out. (a) ENUMERATION -- recounted by direct read at HEAD (the row''s own count was of MODULES; what a Windows backend must actually cover is no-op SURFACES). THREE modules carry same-host POSIX `flock` locks -- unchanged, and correctly recorded at the 2026-07-27 update -- but they expose FIVE distinct `_IS_WINDOWS` no-op branches: `cross_process_write_lock` (`harness-is/src/harness_is/cross_process_ledger_lock.py:358`), `cross_process_replace_lock` (`:478`), `cross_process_read_lock` (`:560`), `cross_process_scope_lock` (`:205`), and `protected_result_store._cross_process_lock` (`harness-runtime/src/harness_runtime/lifecycle/protected_result_store.py:339`). `cross_process_scope_lock` -- added at U-MEM-27 for the memory store''s per-root guarded-write hold -- is the one this row has never named: it is neither a canonical-file lock nor a directory lock (it locks a provisioned lock FILE under a scope root), so the close-out''s "canonical-file/directory lock context managers and `_DirLock`" phrasing does not reach it. It is exclusive-only (it builds on `_DirLock`''s LOCK_EX face), so it maps cleanly onto `msvcrt.locking` and does NOT add to the LOCK_SH/LOCK_EX hard part. `_DirLock` itself has no guard of its own (callers gate), and `reconciler_pause_resume_substrate` still has none either -- its unconditional `fcntl` import is an import-time failure rather than a no-op, already recorded at (c) above. (b) URGENCY -- the "Windows sits at exact pre-B-40 parity" rationale is no longer whole. That framing holds while the no-op only withholds an improvement; U-MEM-27 made it withhold a CORRECTNESS guarantee. `CanonicalMemoryStore.write_record_guarded`''s commit binding is documented as cross-process (`memory_store.py`, the SCOPE paragraph) and witnessed against a genuine second OS process (`harness-is/tests/test_memory_store_cross_process_guard.py`); on Windows that binding silently degrades to in-process-only, so a promotion activation can commit against provenance a concurrent process already superseded -- a wrong durable write, not a missing optimization. Still not blocking (no Windows CI, no active Windows target), but the failure mode to state at build time is data correctness, not parity.'
  close_out: Registered, not built — deliberate scope call (advisor()-reviewed during B-40's own PR),
    not an oversight. `msvcrt.locking` is byte-range and exclusive-only; it does not cleanly provide the
    shared-reader/exclusive-writer (`LOCK_SH`/`LOCK_EX`) split both `cross_process_ledger_lock` and `reconciler_pause_resume_substrate`
    rely on. A correct cross-platform abstraction preserving those semantics (e.g. a small shared/exclusive
    lock facade backed by `fcntl` on POSIX and a genuine Windows-native primitive, or a portable third-party
    lock library) is its own scoped arc, not a hasty `sys.platform` branch bolted onto a PR already touching
    hash-chain integrity. **Close-out steps:** (1) pick a Windows backend (`msvcrt`-based exclusive-only
    lock with a documented downgrade of the shared-read guarantee, or a vetted portable library — a real
    design choice, council-eligible if the tradeoff is non-obvious); (2) wire it in behind the `_IS_WINDOWS`
    no-op branches of the canonical-file/directory lock context managers and `_DirLock` (the
    pre-B-46 `_flock` symbol was deleted at PR 1052), also covering the transitional
    legacy-sidecar protocol retirement once no pre-B-46 writers remain; (3) apply the same fix to `reconciler_pause_resume_substrate`'s
    `_workflow_lock` AND -- widened 2026-07-27 -- `protected_result_store._cross_process_lock` (added by B-73,
    PR 1120) so all THREE same-host lock primitives in this codebase reach genuine Windows parity together,
    not one at a time. The third is exclusive-only (LOCK_EX), so it maps cleanly onto msvcrt.locking and does
    NOT add to the LOCK_SH/LOCK_EX hard part. No Windows CI exists today, so this is currently untested-by-CI on that platform
    regardless — low urgency until Windows becomes an active target, not blocking.
  council: no for now — narrow implementation-discretion follow-on per C-IS-09 §9.4's own deferred-mechanism
    framing; council-eligible AT BUILD TIME only if the msvcrt-exclusive-only-lock tradeoff (weaker-than-POSIX
    shared-read guarantee on Windows) turns out non-obvious once actually scoped
  heading: '### B-45 · Cross-process ledger lock has no genuine Windows serialization backend *(surfaced
    at B-40''s own PR, out-of-family Codex + advisor(), 2026-07-15)*'
- id: B-46
  title: Cross-process ledger lock has a first-write TOCTOU on lazy sidecar provisioning
  status: closed
  pr: '#1052 (canonical-file lock redesign)'
  summary: '`harness_is.cross_process_ledger_lock`''s lock sidecar (B-40) is provisioned lazily by whichever
    writer touches a ledger first. A reader racing that very first writer can pass `cross_process_read_lock`''s
    "sidecar doesn''t exist yet" existence check before the writer creates it, then read the ledger unguarded
    while that writer is mid-append -- defeating the torn-read protection for exactly the first write/read
    race against a brand-new ledger. The identical gap exists in `jsonl_event_ledger_lifecycle.py`''s
    initialization probe (a fresh ledger can take the missing-file branch and return `entry_count=0` without
    waiting, even while another process already holds the writer lock but hasn''t yet created/populated
    the file).'
  close_out: 'CLOSED 2026-07-18 (PR #1052, refreshed at merge-gate round-1 to shipped HEAD) -- the
    ratified shape BUILT and hardened through 9 codex rounds. Canonical-file flock (separate
    lock-only fd) + per-directory EXCLUSIVE lock with a per-thread REENTRANT face covering the
    absent-file state; non-blocking file-probe handoff (never block on a file lock while holding
    the dir); the lock never creates the canonical file (audit round-36 guard preserved); readers
    dir-first, never create/mkdir; inode-stability verify-retry; cross_process_replace_lock for
    inode-replacing sections (shadow_git_rollback switched onto it); ONE global lock order
