  - id: B-30
    title: "Cost-attribution disambiguator replay-semantics inconsistency"
    status: registered_finding
    summary: "Validator's F2 anchor write (only) IDEMPOTENT_NOOPs on a deterministic-disambiguator replay; tool/LLM/webhook always create a new F2 entry. Whether the billed cost event itself dedupes for any composer is UNVERIFIED (correction, 2026-07-15). NOT an undecided policy: ADR-D6 v1.2 §1.5 + C-OD-14 §14.5.1 already specify a complete replay-dedup algorithm (harness_od.idempotency_join_dedup.dedupe_on_replay) -- no production ingestion-layer caller of it exists anywhere in the codebase (a missing consumer, not an unwired composer)."
    close_out: "NOT closed -- sharpened, not council-eligible, not yet buildable. Personally verified (not just the grounding agent's paraphrase) that ADR-D6 v1.2 §1.5's algorithm is specified as ingest_span(span) -- a TRACE-INGESTION-time function operating on spans read from the observability pipeline -- not something a per-dispatch composer calls inline while producing its own F2 write. Wiring dedupe_on_replay directly into the 4 attribute_*_dispatch_cost composers (as an initial grounding pass recommended) would be a category error: the correct call site is an ingestion-layer consumer that doesn't exist in production yet, not merely an unimplemented wiring step inside the composers. Separately, the prior B-COST-REPLAY-DEDUP-WITNESS closure record (.harness/b-cost-replay-dedup-witness-closure-record.md, CLOSED GREEN no-fix) already verified the IS-layer content-addressed ledger write independently provides the real replay-dedup guarantee for the JOURNAL_RESUME/PURE_PATTERN_NO_ENGINE engine class, and its own scope note explicitly pre-commits any adjacent replay-dedup finding to register-don't-build, not a broadening of that arc. Webhook's fresh-uuid4-per-attempt billing is confirmed deliberate -- the actual rationale lives at webhook_delivery_composer.py:363-371's inline comment ('this method fires unconditionally on every invocation -- no idempotent skip at this layer. A fresh UUID per call guarantees each invocation gets its own F2 anchor'), an intentional out-of-family-Codex-round-5 fix, not an oversight to align away. Out-of-family Codex flagged two further nuances in THIS correction across two rounds, both addressed same-PR: (1) the paragraph above must not be read as settling whether validator's F2-key collision actually dedupes the BILLABLE cost event -- it only describes the F2 anchor identity write. Verified directly: compose_cost_f2_entry_core (cost_attribution_f2_write.py:153-166) discards ledger_writer.append's return value entirely and always returns a StateLedgerEntryRef, whether the underlying append was APPENDED or IDEMPOTENT_NOOP. The caller then unconditionally calls audit_writer.append(tenant_id, audit_entry) -- a SEPARATE content-hash-addressed write whose own dedup depends on AuditPayload byte-identity, not on whether the F2 cost-write above it deduped. (2) Deeper still: ALL 4 production cost-wrapper call sites (llm_dispatch.py:3031-3035, runtime_tool_dispatcher.py:625-628, webhook_delivery_composer.py:373-376, and validator's equivalent lines 400-405) unconditionally append the returned SpanCostRecord to a run-scoped accumulator (cost_record_sink), which api.py:1123-1132's _build_run_result rolls into the user-visible RunResult.cost_attribution via _rollup_cost_attribution -- this bypasses BOTH the F2 dedup AND the audit-ledger dedup entirely, so even a genuinely-deduped F2 anchor and audit-ledger entry would NOT stop the accumulator from double-counting in the run's reported cost total. None of the 3 layers (F2 anchor / audit-ledger append / run-result accumulator) has been independently verified to dedupe on a real replay for any of the 4 composers -- the original 'validator dedupes / others double-bill' characterization remains unverified at every level that actually matters, not just restated. Close-out path once a real trigger exists: (1) resolve where ingest_span's production call site actually lives (or should be built) before touching any composer; (2) verify whether double-billing is an ACTUAL exercised risk for the durable engine classes (SAVE_POINT_CHECKPOINT/EVENT_SOURCED_REPLAY/RECONCILER_LOOP/WAL_SEGMENT) whose resume_at skip logic may already prevent re-dispatch of completed steps, mirroring the JOURNAL_RESUME finding; (3) independently verify all 3 layers (F2 anchor identity-only, audit-ledger content-hash dedup, and the run-result accumulator's confirmed-unconditional no-dedup) for each of the 4 composers before assuming any of them currently dedupes correctly. Only then decide whether composer-level wiring is even the right fix, and at which layer. Mirrors the B-19/B-42 discipline against building speculative infrastructure ahead of a real, demonstrated consumer."
    council: "no — a specified policy already exists (ADR-D6 v1.2 §1.5); the open question is call-site + live-risk + 3-layer billing-path verification, not a design fork"
    heading: "### B-30 · Cost-attribution disambiguator replay-semantics inconsistency *(surfaced at B-23 round 6, advisor())*"

