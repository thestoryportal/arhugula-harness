- id: B-74
  title: Protected result store's mtime-based GC age authority can under-report publish time
    below a filesystem's timestamp granularity
  status: registered_finding
  summary: 'Surfaced at the B-68 impl arc, out-of-family Codex round 7 [P2]. `_publish_atomic`''s
    `os.utime(entry_path, None)` refresh sets the entry''s mtime to the CURRENT system time, but
    the underlying filesystem is what actually STORES that value, at whatever timestamp
    resolution it supports -- on a coarse-granularity filesystem (e.g. legacy FAT32, or certain
    network filesystem configurations; NOT the modern POSIX filesystems -- ext4/APFS/NTFS --
    this workspace''s committed local-development/self-hosted-server/managed-cloud deployment
    surfaces default to, which offer sub-millisecond resolution), the stored mtime can round
    DOWN by up to the filesystem''s own granularity (e.g. up to ~1 second on a 1-second-resolution
    filesystem). If the deployment-configured `ttl_seconds` is SHORTER than that rounding error,
    `gc_sweep()` can classify a just-published, genuinely-live entry as already expired and
    reclaim it -- even though the B-68 mtime-authority fix (round 1) is working exactly as
    designed; the filesystem itself cannot represent the precision the fix relies on. This is
    the SAME "operator configures a near-zero TTL" reachability floor B-68''s own original
    registration already named (roughly seven orders of magnitude below the factory 86400s
    default), now sharpened with a SECOND, filesystem-dependent dimension of that floor. Not
    council-eligible as a mechanical patch: codex''s own framing states the fix is either
    "reject TTLs below a guaranteed timestamp resolution" or "use an age authority that cannot
    predate publication by more than the TTL" -- both require picking a concrete resolution
    floor, which is FILESYSTEM-dependent and not knowable a priori without probing the actual
    deployment volume, making this a genuine design decision (what floor? how is it probed or
    configured? what''s the failure mode when unknown?) rather than a mechanical patch a fix
    round can safely author. CROSS-REFERENCE (advisor(), B-76 arc, 2026-07-26): likely ONE
    finding with B-77 -- both concern raw mtime as an untrustworthy age authority (this row:
    filesystem timestamp-granularity rounding; B-77: crash-window non-atomicity); ground as a
    single does-the-age-authority-stay-mtime question before building either in isolation.
    NARROWED (not closed) 2026-07-26 (PR #1123): the "likely ONE finding" framing above was
    directionally right but not literal -- B-77 and B-74 share raw mtime as an untrustworthy age
    authority, but B-77''s reorder fix only removes the DATA write+fsync duration from its own
    crash window, not the whole window (see B-77''s row -- a residual metadata-fsync+commit
    tail remains, reproduced by out-of-family Codex round 9). This row''s own concern (filesystem
    storage-resolution rounding) is UNTOUCHED by that reorder either way -- it was never about
    ordering, only about what a coarse filesystem stores once a value is fsync''d, so it stays
    fully in scope, not reduced. Two same-arc attempts to dispose of this row were both wrong
    and reverted: PR #1123 round 1 tried "no realistic operator would configure a below-floor
    TTL" (rejected by Codex -- `protected_result_store_ttl_seconds` enforces only `gt=0.0`, no
    floor, and the env loader + factory pass an override through unchanged, so this is a
    SUPPORTED configuration, not an unreachable one); a later round considered adding that same
    TTL floor as a mechanical fix and advisor() rejected it too -- it is this row''s own
    close_out option ("reject TTLs below a guaranteed timestamp resolution"), already flagged as
    a genuine design decision, and the field is a spec''d deployment-configurable surface
    (Runtime v1.103 SS14.8.11 AC 7) Phase-7 impl discretion should not narrow unilaterally.
    Remains open, not dormant, not built this arc. NARROWED AGAIN 2026-07-30 (dated
    re-check against the landed B-77 fix, PR #pending): B-77''s first-observation grace
    covers this row''s reachable loss case but does NOT subsume the row. What is now
    covered: a granularity error up to ONE sweep interval -- the sweep that FIRST observes
    a coarse-stamped, genuinely-live entry can no longer reclaim it, which is the
    bootstrap-sweep-immediately-after-publication path (witnessed at
    `test_coarse_filesystem_mtime_granularity_does_not_lose_a_live_entry_on_sight`, whose
    first assertion passes only because of the grace). What SURVIVES, and is now this
    row''s whole remaining scope: a rounding error EXCEEDING the gap between two
    consecutive sweeps. That gap is not TTL-bound -- a bootstrap sweep
    (`stage_4_od.py`) and an explicit or shutdown sweep (`shutdown.py` step 5b) can land
    milliseconds apart, well inside a 1-second filesystem granularity -- so a live entry
    can still be lost on such a volume. That exact residue is PINNED as an executable
    assertion in the same witness (its second `gc_sweep` reclaims the live entry, labelled
    REGISTERED RESIDUAL in the test body), so a future fix here must come back and update
    it rather than silently diverge. Not closed as subsumed-by-B-77; the close_out below
    (probe the deployment volume''s real resolution and either refuse a sub-resolution TTL
    typed or select a higher-resolution age signal) is unchanged and still the fix.'
  close_out: 'Design a TTL-floor validation or a probe-based age-authority selection that
    accounts for the deployment filesystem''s actual timestamp resolution -- e.g. probe the
    store root''s filesystem granularity at construction/first-write time (write a marker file,
    read back its mtime precision) and either refuse a TTL below that floor with a typed error,
    or fall back to a higher-resolution age signal (e.g. a companion sidecar file recording a
    monotonic sequence number or a separate high-resolution timestamp store) when the TTL is
    below the floor. Witness with a test that simulates a coarse-mtime filesystem (e.g. via a
    monkeypatched `os.stat`/`os.utime` rounding to whole seconds) and a TTL below that
    resolution, asserting the store either refuses the TTL or does not lose the live entry.'
  council: no -- narrow, filesystem-dependent TTL-precondition gap; the fix requires picking a
    concrete resolution floor which is a design decision, not an immediate judgment call
  heading: '### B-74 · Protected result store''s mtime-based GC age authority can under-report
    publish time below a filesystem''s timestamp granularity *(surfaced at the B-68 impl arc,
    out-of-family Codex round 7 [P2], 2026-07-25)*'
