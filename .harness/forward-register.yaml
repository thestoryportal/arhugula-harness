- id: B-40
  title: Memory operation ledger has no cross-process write serialization
  status: closed
  summary: append_memory_operation and append_ledger_entry each used a process-local threading.Lock only
    -- no protection against a second OS process (e.g. two concurrent `harness run` invocations against
    the same repo) writing the same canonical ledger. C-IS-09 §9.3 + C-MEM-08 already require serialization;
    §9.4 defers only the mechanism, not the requirement -- no fork needed.
  close_out: 'CLOSED 2026-07-15 at PR #1026, after a 4-round register-correction arc (PR #1025) that repeatedly
    mis-disposed this finding before landing on the correct one: round 1 wrongly called it speculative/already-decided;
    round 2 wrongly reclassified it design_substrate_gated as an open interpretive fork; round 3 correctly
    reclassified registered_finding/buildable-now but still called it dormant; round 4 (out-of-family
    Codex) corrected ''dormant'' to LIVE (RuntimeConfig.memory defaults enabled=True with root_path=<repo>/.harness/memory,
    so two ordinary concurrent `harness run` invocations already share the canonical ledger today). Build
    (PR #1026): added harness_is.cross_process_ledger_lock -- a same-host fcntl.flock helper mirroring
    the proven pattern already shipped at harness_runtime.lifecycle.reconciler_pause_resume_substrate._workflow_lock
    (POSIX advisory, same-host only; true cross-host distributed writers remain out of design horizon
    per ADR-F2 §Rationale(c)(ii), unaffected). Wired into all 4 real call sites found during grounding
    (2 more than the register originally named): append_ledger_entry, append_memory_operation, shadow_git_rollback''s
    ledger-preserve-across-checkout window, and jsonl_event_ledger_lifecycle.initialize_jsonl_event_ledger/validate_jsonl_event_ledger_format
    (the last found by the merge-gate concurrency lens -- reachable on every harness run bootstrap/resume
    via harness_runtime.lifecycle.state_ledger.materialize_state_ledger, so its pre-existing unlocked
    read could undercount entry_count and silently skip the tamper-check gate). read_ledger/read_memory_operation_ledger
    take a shared lock; internal call sites use new _unlocked variants to avoid self-deadlock (flock is
    per-open-file-description, not reentrant). Added genuine multi-process test coverage (multiprocessing,
    fork context) for all 3 append-side call sites, replacing the prior threading-only witnesses that
    could not detect a cross-process race; each new test mutation-probed (reverted the fix, confirmed
    failure across 3 runs, restored) -- the shadow_git_rollback test specifically caught by the merge-gate
    test-witness lens, which found the first 2 tests covered only 2 of 3 wired sites. Full harness-is
    suite green (281+ passed); ruff/pyright/overlay-check clean; 3-lens merge-gate (which caught the 4th
    call site + the missing shadow_git_rollback test above) and out-of-family Codex both run to convergence
    before merge. Out-of-family Codex round 1 on PR #1026 caught two further issues, both fixed before
    merge: (1) the unconditional top-level `import fcntl` broke `import harness_is` on Windows (eagerly
    imported via `memory_operation_ledger`) — C-STK-10 commits to macOS/Linux/Windows host-OS support
    "without per-OS port forking"; fixed by gating the import behind `sys.platform == "win32"` and degrading
    the lock context managers to a no-op on Windows (exact pre-B-40 parity — the in-process `threading.Lock`
    half is unaffected and cross-platform; only the new cross-process dimension is unavailable there).
    (2) the new `.lock` sidecar files were not gitignored; added `.harness/**/*.lock`, verified via `git
    check-ignore` against both actual lock paths. The genuine Windows locking *mechanism* remains unbuilt
    by design (advisor()-reviewed scope call, not an oversight) — registered separately as B-45. A further
    out-of-family Codex round (round 4, against the full PR diff vs main -- an earlier round had been
    invoked with an invalid ref and produced no usable verdict) found two more real, non-regression gaps,
    both registered rather than fixed in this PR: (1) `cross_process_read_lock`''s no-sidecar-yet fallback
    (added to fix the P1 read-only-CLI violation above) reintroduces a narrow TOCTOU -- a reader can pass
    the "sidecar doesn''t exist" check before a racing first-writer creates it, then read unguarded while
    that writer is mid-append; (2) the identical gap in `jsonl_event_ledger_lifecycle.py`''s initialization
    probe. Both are pre-existing (every read was unguarded, always, before this module existed) and narrow
    (once any writer has ever created the sidecar, all subsequent reads/writes correctly serialize) --
    not a regression, and advisor()-confirmed as correctly out of THIS PR''s scope: the durable fix (locking
    the canonical ledger file directly instead of a lazily-created sidecar) is a larger, harness-inspect-compatibility-affecting
    redesign, registered separately as B-46. The torn-read-race claim in `cross_process_read_lock`''s
    docstring was softened to state this precisely (closes the race once a ledger has been written at
    least once under the lock, not before).'
  council: no -- requirement settled (C-IS-09 §9.3 + C-MEM-08), mechanism was implementation discretion
    (§9.4); impl-to-cleared-spec
  pr: '#1026'
  heading: '### B-40 · Memory operation ledger has no cross-process write serialization *(surfaced at
