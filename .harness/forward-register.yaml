  status: closed
  summary: 'merge-gate 3-lens review round 2 (test-witness lens, B-72 impl leg PR #1116, 2026-07-25) found two coverage gaps after round 1''s OW HITLDeliveryCell-construction gap was closed by a dedicated regression test (test_ow_worker_resume_delivers_and_excludes_resolved_pre_dispatch_gate_owner in test_workflow_driver_fanout_pause.py): (1) the OW/HIERARCHICAL_DELEGATION mirror of _resume_body_mismatch''s pre-dispatch-gate-owning material-diff validation (workflow_driver.py, the FanOutResumeState-consuming closure near the PARALLELIZATION site''s ~7772-7831) has zero test coverage -- PARALLELIZATION got three dedicated witnesses (test_peer_resume_rejects_pre_dispatch_gate_owning_kind_changed, test_peer_resume_rejects_pre_dispatch_gate_owning_workflow_id_swap, plus the INFERENCE_STEP round-5 regression test) but the OW mirror has none; (2) the new exclusion tests (both the PARALLELIZATION and OW variants) only exercise the completed/terminal_dispositions arm of the carry-forward filter''s three exclusion conjuncts -- the paused_child_dispositions and effect_fence_paused_dispositions arms remain completely unwitnessed at BOTH construction sites (workflow_driver.py ~9958-9965 and ~14036-14043). Per advisor() consultation during the merge-gate loop: these are guard-hardening on symmetric, already-reviewed code (confirmed structurally identical to the tested PARALLELIZATION paths by the concurrency lens across 2 rounds), not the load-bearing delivery outcome round 1''s finding was -- registered as a follow-on rather than blocking this PR''s merge a third time. CLOSED 2026-07-26 (step 1/2 at PR #1118, step 2/2 at PR #1119). Step (1) ported the 3 PARALLELIZATION material-diff tests to their OW mirror in test_workflow_driver_fanout_pause.py, mutation-probe-verified. Step (2) added the 4 remaining exclusion-conjunct tests (paused_child_dispositions + effect_fence_paused_dispositions arms, at both PeerFanOutResumeState and FanOutResumeState construction sites) -- each recovers a pre-dispatch gate-owning branch, delivers its HITLDeliveryCell, and drives the dispatch into a REAL nested child pause (via a faithful RuntimeSubAgentDispatcher double dispatching a real execute_workflow that itself pauses) or an effect-fence-ambiguous outcome, proving exclusion from pre_dispatch_gate_owning_branches. All 7 tests total mutation-probe verified against both construction sites, confirmed byte-identical (grepped before starting step 2, per advisor()''s direction, to rule out a production asymmetry before treating this as pure test-parity work). merge-gate 3-lens all-approve at round 1 on both PRs; just codex-review converged clean at round 1 on both. merge-gate test-witness lens on PR #1119 found a docstring accuracy nit (the paused-child dispatcher docstrings overclaimed hitting the direct own-dispatch exception handler when real thread-scheduling timing more likely hits the in-flight-cancellation-race handler; both write the same disposition dict identically, so mutation-probe validity was unaffected) -- fixed inline, no re-gate needed.'
  pr: '#1118, #1119'
  close_out: '(1) Port test_peer_resume_rejects_pre_dispatch_gate_owning_kind_changed + test_peer_resume_rejects_pre_dispatch_gate_owning_workflow_id_swap + the INFERENCE_STEP round-5 regression test to test_workflow_driver_fanout_pause.py against _execute_orchestrator_workers''s own _resume_body_mismatch closure (worker_steps-based, not steps-based). (2) Add a paused_child-resolves-this-round exclusion test (a recovered pre-dispatch gate-owning branch''s delivered cell triggers a REAL nested execute_workflow dispatch that itself pauses, landing the branch in paused_child_dispositions instead of terminal_dispositions) and an effect_fence-resolves-this-round exclusion test (the branch''s delivered cell leads to an effect-fence-ambiguous dispatch), at BOTH the PeerFanOutResumeState and FanOutResumeState construction sites -- 4 new tests total. Mutation-probe each by deleting the specific exclusion conjunct it targets, mirroring the discipline already applied to the completed-arm tests this PR shipped.'
  council: 'No -- mechanical test-coverage parity against an already-established pattern (mirror an existing PARALLELIZATION test to its OW twin; add the 2 remaining exclusion-conjunct arms using the same shape as the completed-arm test this PR already ships). Not a design decision.'
  heading: '### B-81 · OW/HIERARCHICAL_DELEGATION test parity gaps remain for the B-72 pre-dispatch gate-owning carrier''s exclusion conjuncts and resume-side material-diff validation *(surfaced at the B-72 impl leg, merge-gate 3-lens review round 2, 2026-07-25; CLOSED 2026-07-26 -- PR #1118 + PR #1119)*'
- id: B-82
  title: 'Ollama dispatch branch never serializes the standard memory tools its selected access mode promises'
  status: closed
  pr: '#1140'
  summary: '`reflect_memory_provider_capabilities` reports `supports_standard_memory_tools=True` for ollama (verified empirically 2026-07-27), so `select_memory_access_mode` (`harness-cp/src/harness_cp/memory_access_mode.py:190-200`) returns `MemoryAccessMode.STANDARD_MEMORY_TOOLS` for an ollama binding under a permissive policy. But the ollama arm of `RuntimeLLMDispatcher.dispatch` (`harness-runtime/src/harness_runtime/lifecycle/llm_dispatch.py`, the `elif provider_name == "ollama":` branch) has no standard-memory-tools counterpart to the openai arm''s `_dispatch_openai_with_standard_memory_tools` -- it calls the bare `_dispatch_ollama` unconditionally. The five C-MEM-14 tools the selected access mode promises are therefore never serialized into the ollama request and no continuation loop exists to execute a returned tool call; the mode silently degrades to no memory access at all. NOT a wire-name defect (`ollama.chat` was never handed a dotted name because it was never handed a memory tool), but its fix is COUPLED to the OpenAI wire-name map: injecting the tools into ollama without routing them through an adapter-owned wire encoding would extend the OpenAI HTTP-400 failure class (dotted `function.name` rejected by `^[a-zA-Z0-9_-]{1,64}$`) to any name-validating ollama build or downstream OpenAI-compatible shim. Discovered 2026-07-27 during the gate-(d) R-300 live re-confirmation, while diagnosing the OpenAI 400 that the wire-name map closes. Class 3 doc-clarity observation surfaced at the same time: C-MEM-14''s tool-name table (`Spec_Memory_Substrate_v1.md` lines 485-497) reads as identity-normative, and the per-provider WIRE ENCODING of those identities is adapter-owned (NOT a spec-level rename) -- the enum stays dotted and provider-neutral; only the OpenAI boundary re-spells it.'
  close_out: '(1) Decide the ollama shape: `ollama.chat` accepts an OpenAI-compatible `tools=` array, so the most likely fix is an `_dispatch_ollama_with_standard_memory_tools` sibling reusing the same tool-schema builder + continuation loop, with the wire-name map (or an ollama-specific equivalent) applied at serialization AND at inbound resolve. Ground the actual ollama tool-call response shape against a real local daemon before writing the loop -- do not assume it is byte-identical to OpenAI''s `choices[].message.tool_calls[]`. (2) Alternatively, if standard memory tools are deliberately out of scope for ollama, the FIX IS IN THE OTHER DIRECTION: `reflect_memory_provider_capabilities` must stop reporting `supports_standard_memory_tools=True` for ollama so the selection degrades explicitly to `PROMPT_EXTENSION_PACKET` rather than silently to nothing. Either way the current state -- a selected mode the dispatch branch does not serve -- is a fail-silent gap. (3) Witness with a deterministic test that captures the kwargs handed to a fake `client.chat` and asserts either the tools are present under provider-safe names, or that the selected access mode is not `STANDARD_MEMORY_TOOLS` for an ollama binding. CLOSED 2026-07-27 (PR #1140) via direction (1); the wire-name coupling this row asserted is DISSOLVED by grounding -- a live probe (ollama==0.6.2, llama3.2:3b) confirmed `/api/chat` accepts the DOTTED C-MEM-14 identities verbatim and echoes them back unchanged, so there is NO wire-name map on this path and adding one would encode a false capability claim. Direction (2) REJECTED: ollama genuinely supports tool calling, so narrowing `reflect_memory_provider_capabilities` would amputate the C-MEM-14 write half for the whole local-open-weight family -- a C-MEM-13 selection-semantics regression, not a fix; the row''s own "YES if grounding shows option (2)" council condition therefore never fired. Shipped `_dispatch_ollama_with_standard_memory_tools` + 6 sibling helpers mirroring the OpenAI arm''s loop SHAPE (max_iterations=16, shared `_standard_memory_tool_context`, deepcopy-before-mutate schema discipline, `LLMDispatchPayloadShapeError` fail-loud convention) against ollama''s different wire shapes: no `choices[]` envelope (top-level `ChatResponse.message`, ollama/_types.py:418), `arguments` already decoded as a Mapping (_types.py:346, no json.loads on the happy path), and NO `tool_call_id` anywhere in `Message` (_types.py:304-355) -- the tool-result turn correlates by name as {"role":"tool","tool_name":"<dotted>","content":"<json>"}. Malformed-call semantics deliberately MIRROR OpenAI (fail-loud `MemoryToolExecutionInputError` propagation); a feed-back-as-error-turn recovery was rejected as a per-provider design extension. 6 deterministic tests + 2 mutation probes. Out-of-family Codex round 1 then found TWO real durable-double-write defects in the new loop, BOTH of which the mandatory sibling check confirmed the OpenAI arm has shared since it shipped -- fixed SYMMETRICALLY in this PR: [P1] a later invalid call was validated only AFTER earlier (possibly write-like) calls had executed, so the abort left durable memory changed; both loops now resolve+validate the COMPLETE batch via `_openai_prepared_memory_tool_calls`/`_ollama_prepared_memory_tool_calls` before executing any of it. [P2] the final iteration executed its batch and only THEN raised loop-exhausted, committing a write for a dispatch that reports failure; both loops now raise BEFORE executing once no iteration budget remains to send results back. Both aborts classify TRANSIENT_RETRY (`retry_breaker_fallback.py:299-304` fail-fasts only ProviderUnreachable/PayloadShape/401-403), so `RetryBreakerFallbackDispatcher` re-ran the whole dispatch and the committed call executed twice -- that retry classification is what made these P1/P2 rather than cosmetic. The exhaustion error type is DELIBERATELY unchanged (the same generic `RuntimeError` both loops always raised, now via the shared `_memory_tool_loop_exhausted` helper); re-typing it would change retry routing, a separate decision from the execute-before-raise defect. 4 further witnesses (batch-pre-validation + iteration-bound, one pair per provider) each mutation-probed. Codex round 2 then found TWO MORE [P1]s, both again PRE-EXISTING on the OpenAI sibling and fixed symmetrically: [P1-a] the dispatch-side context builder required `arguments["scope_ref"]` for EVERY tool, but `memory.read`/`memory.propose_promotion`/`memory.request_redaction` declare no `scope_ref` AND set `additionalProperties: false` (`harness-as/src/harness_as/memory_tool_contracts.py:181-217`, `:250-283`, `:284-...`), so a schema-conformant model CANNOT send one -- three of the five ADVERTISED tools failed before ever reaching the executor. Latent on OpenAI since the memory loop shipped (tests only exercised `memory.search`). The check is now scoped to the two contracts that declare the field, mirroring BOTH `_bind_schema_fixed_value`''s properties-presence authority AND the executor''s own partition -- `StandardMemoryToolExecutor._require_scope_ref` is reached only from `_search`/`_write_note` (`memory_tool_executor.py:195`/`:262`); the authoritative value was always `RuntimeMemoryContext.scope_ref` anyway, the argument being only a cross-check. [P1-b] a model call to a legitimate caller-advertised NON-memory tool (preserved by the dedup filter) hit the memory resolver and raised, so enabling automatic memory broke ordinary tool workflows. Both loops now classify the batch first: if ANY call names something outside our advertised memory identities, the whole response returns to the caller unprocessed with ZERO memory calls executed -- bare-path parity (`_dispatch_openai`/`_dispatch_ollama` return every tool_call untouched whatever it names, so hallucinated names go back to the caller too rather than becoming a new failure mode that appears only under automatic memory) plus batch atomicity. Raises are now reserved for MEMORY-named calls with malformed payloads. 6 further witnesses (memory.read without a scope_ref argument; mixed memory+caller batch; caller-only batch -- one triple per provider), both fixes mutation-probed. Codex round 3 added two bounded [P2]s, again symmetric: [P2-a] round 2''s bound check ran BEFORE batch preparation, so a malformed memory call in the TERMINAL batch surfaced as the generic (TRANSIENT_RETRY) exhaustion `RuntimeError` instead of the fail-fast `LLMDispatchPayloadShapeError` -- replaying up to 16 provider calls for a request that can never succeed; both loops now validate the batch, THEN check the bound, THEN execute (the caller-owned return stays ahead of all three). [P2-b] four test fixtures passed `text` to `memory.write_note`, whose contract requires `note` (`memory_tool_contracts.py:218-249`); all four corrected, and one witness now runs through a REAL `StandardMemoryToolExecutor` over a tmp_path filesystem store (built the same way `tests/test_memory_tool_executor.py::_executor` builds it) because required-argument-key enforcement lives in the EXECUTOR (`memory_tool_executor.py:266` -> `_string_arg` at `:549-553`), NOT at the dispatch layer -- no new dispatch-side validation semantics were added. 4 further witnesses (a malformed TERMINAL batch fails fast rather than as exhaustion, per loop; a real-executor write_note round trip committing a durable record; the same call with the wrong required key failing loud at the executor), each mutation-probed -- reverting the reorder reproduces the masking `RuntimeError: ... exceeded 16 continuation turns` verbatim, and restoring the `text` key fails at `memory_tool_executor.py:552`. Codex round 4 closed one more [P2] and registered one bounded residual: the loops bundled usage from only the FINAL response, so every continuation turn''s tokens vanished from turn capture / gen_ai.usage.* / cost attribution -- the OpenAI arm shared the shape verbatim (`_openai_response_bundle` read the final response''s `.usage`), and both now accumulate per-turn input/output counts across every provider call in the loop (None means ABSENT, never 0; `response_id` is NOT accumulated -- it identifies one response, so the final turn''s is preserved). Witnessed by extending both existing loop tests, whose two calls already carry distinct counts (10/4 + 12/5 on OpenAI, 20/8 + 31/9 on ollama) so the sums are discriminating against both final-turn-only and first-turn-only readings; mutation-probed. THE BOUNDED RESIDUAL IS REGISTERED AS `B-84`: an executor-level argument failure (e.g. `memory.read` missing `memory_ref`) still occurs MID-batch during sequential execution, so a valid earlier write commits before the later call raises, and the transient classification re-runs the dispatch and duplicates the write. Deliberately NOT fixed here -- dispatch-side full-contract prevalidation would mirror-copy the executor''s own semantics, the drift class this workspace treats as a defect. Codex round 5 closed one more bounded regression: `reflect_provider_capabilities` returns supports_tools=True for EVERY ollama model string (`harness-cp/src/harness_cp/provider_capabilities.py:127`, pre-existing), so the new branch sent `tools=` to models with no tool template (e.g. llava-llama3) and the daemon 400''d what had been a working TEXT dispatch. Fixed with the DAEMON as the authority rather than a per-model capability table (a real design question, out of scope): on the FIRST chat call of the memory loop only, a tool-unsupported rejection re-dispatches through the bare `_dispatch_ollama` WITHOUT tools, byte-restoring the pre-B-82 path for exactly those models (SUPERSEDED at B-83/PR #1142: the retry remains tool-free — the daemon fix is intact — but now carries the C-MEM-12 packet folded into the single system source when the B-83 repair is authorized); a mid-loop rejection stays fail-loud. Both SDK facts probed LIVE, not assumed: `ollama.ResponseError` (`ollama/_types.py:632-651`) carries only `.error` + `.status_code` (no machine-readable discriminator), and on ollama 0.6.2 the tool rejection is `.error` containing "does not support tools" with status 400 while model-not-found is the SAME type with status 404 -- so a blanket `except ResponseError` would swallow unrelated faults and the message substring is the only available discriminator. The string-match brittleness is documented at the catch site; an upstream rewording fails CLOSED (a loud dispatch failure), never silently absorbing a different error. The predicate duck-types on class name + `.error` substring rather than importing `ollama`, keeping the module free of provider-SDK imports; the TESTS use the real `ollama.ResponseError`. The OpenAI loop needs NO equivalent and none was added -- every OpenAI chat model supports tools, so a mirrored catch would be dead code. 3 witnesses, each mutation-probed against a distinct conjunct (remove the fallback; widen the catch to any ResponseError; drop the first-call restriction). A fourth round-5 observation -- the SDK silently dropping declared schema constraints -- was verified, judged an AGGRAVATOR of an existing registered class rather than a new defect, and recorded on `B-84`. Full harness-runtime non-e2e suite green (3123 passed / 10 skipped).'
  council: 'No for the mechanical half (mirroring an existing, already-reviewed openai dispatch arm). YES if grounding shows option (2) is the right answer -- narrowing a declared provider capability changes which memory access mode an entire provider family receives, which is a C-MEM-13 selection-semantics decision, not impl discretion.'
  heading: '### B-82 · Ollama dispatch branch never serializes the standard memory tools its selected access mode promises *(surfaced at the gate-(d) R-300 live re-confirmation, 2026-07-27; CLOSED 2026-07-27 — PR #1140)*'
- id: B-83
  title: 'No dispatch-side guard that the selected STANDARD_MEMORY_TOOLS access mode is actually served by the provider arm reached'
  status: closed
  pr: '#1142'
  summary: 'Surfaced by the B-82 fix (2026-07-27). B-82 was one instance of a general shape: `select_memory_access_mode` (`harness-cp/src/harness_cp/memory_access_mode.py:158-245`) picks an access mode from DECLARED provider capabilities, and `RuntimeLLMDispatcher.dispatch` then routes to a provider arm -- but nothing checks that the arm reached actually serves the mode selected. With B-82 closed, both arms the DEFAULT `reflect_memory_provider_capabilities` can select STANDARD_MEMORY_TOOLS for (openai, ollama) now serve it, so the defect is not reachable through default reflection. It remains reachable two ways: (a) a caller supplying `MemoryAccessModeRequest.provider_capabilities` explicitly (the `request.provider_capabilities or reflect_...` short-circuit at memory_access_mode.py:163-166) can declare supports_standard_memory_tools=True for anthropic or an external-CLI binding, whose dispatch arms ignore memory tools entirely (the anthropic arm branches only on `step_has_memory_tool(payload.tools)`/`hitl_tool_loop`, never on access mode; `_payload_to_external_cli_prompt` is text-only by contract); (b) more importantly, a STATICALLY INJECTED `RuntimeLLMDispatcher.memory_context` (the no-`memory_runtime` path at `llm_dispatch.py:1302`) is composed ONCE and is NOT recomposed when `RetryBreakerFallbackDispatcher` rebinds the provider per attempt (`retry_breaker_fallback.py:188-191` builds a fresh StepEffectiveBinding with a different provider) -- so a context composed for openai under STANDARD_MEMORY_TOOLS can be dispatched against an anthropic or external-CLI fallback and degrade to zero memory access, silently. The `memory_runtime`-bound path is NOT affected (it recomposes per attempt via `compose_for_dispatch`). GROUNDING NOTE -- what this row is NOT: the same pass also checked whether C-MEM-13''s "no_memory_access is a valid policy outcome and must be ledgered when memory was requested" (`Spec_Memory_Substrate_v1.md:463`) lacks a ledgering witness. It does NOT: `MemoryContextComposer.compose_run_start` ledgers the denial via `_write_injection_decision` and emits a DENIAL span with POLICY_DENIAL failure class (`harness-runtime/src/harness_runtime/memory_context.py:165-205`), witnessed at `harness-runtime/tests/test_memory_context.py:364-388`. That candidate is recorded as CHECKED-AND-CLOSED, not registered, so a future reader does not re-open it. REACHABILITY (c), ADDED 2026-07-27 CORRECTING THIS ROW''''S OWN EARLIER CLAIM: this row originally asserted the defect was "not reachable through the DEFAULT capability reflection". That is FALSE, falsified by the B-82 round-5 fallback filed the same day. `reflect_provider_capabilities` returns supports_tools=True for every ollama model string (`harness-cp/src/harness_cp/provider_capabilities.py:127`), so a model with no tool template (e.g. llava-llama3) selects STANDARD_MEMORY_TOOLS through PLAIN DEFAULT REFLECTION and the round-5 fallback then deliberately re-dispatches it bare -- no memory access at all, and NO LEDGER TRACE of the degradation: exactly this row''''s shape, on the common no-special-configuration path. The fallback remains correct for its own problem (it byte-restores a previously-working text dispatch, and the daemon is the only authority on which models take tools); it simply makes B-83 default-reachable rather than reachable only via (a)/(b), which RAISES this row''''s priority. ADJACENT, SAME FAMILY: the caller-owned mixed-batch return (B-82 round 2) hands a mixed response back whole for batch atomicity + bare-path parity, so the memory call the model asked for is not served and nothing records that it wasn''''t -- the caller cannot execute it either, not owning the memory tools. A consequence of a deliberate tradeoff rather than an independent defect, so it is scoped under this row: whatever posture close-out step (1) settles on should cover that exit path too. CLOSED 2026-07-28 (PR #1142) — dispatch-time serve-check + repair-to-packet, covering all three reachabilities from ONE authority. `_standard_memory_tools_context` (`harness-runtime/src/harness_runtime/lifecycle/llm_dispatch.py`) is now the single predicate answering "will THIS dispatch inject the C-MEM-14 tools?" — read by both arm guards AND by the serve-check, so the branch and the check cannot disagree; its provider-identity conjunct (`selection.selected_provider != provider_name`) DETECTS (b), since `MemoryAccessModeSelection.selected_provider` is `request.model_binding.provider` verbatim (`harness-cp/src/harness_cp/memory_access_mode.py:372`) and the `memory_runtime` path recomposes per attempt so the conjunct is inert there. TWO DISPOSITIONS, split at out-of-family Codex round 1 [P1-a]: (a) and (c) are REPAIRED -- the context was composed FOR the dispatched provider, so its packet is provider-matched by construction and discloses nothing the selection had not already cleared; (b) is REPORT-ONLY -- neither the tools NOR the packet reach the rebound provider, because retrieval and injection enforce PROVIDER-FAMILY scope before ranking (`Spec_Memory_Substrate_v1.md:481`) and the packet was assembled under provider X''s `MemoryScope.provider_family`, so forwarding its TEXT to a Y-family provider would bypass that scope boundary (a DISCLOSURE leak, which read-only framing does not fix -- distinct from, and not covered by, the write-authority argument this row originally gave). Recomposition is impossible on that path by construction (it is definitionally the `memory_runtime`-UNBOUND configuration) and fail-closed would convert a silent degradation into a run failure, so the degradation is made VISIBLE in telemetry rather than repaired. On the REPAIRED dispositions, the already-retrieved, already-policy-checked C-MEM-12 packet is rendered into the effective system prompt via a new `render_packet_for_degraded_dispatch` sibling in `memory_context.py` (same body as `render_prompt_extension_packet` through a shared `_render_packet`; only the access-mode gate is dropped, so existing callers are byte-identical) and appended through the shared `append_rendered_memory_packet` seam. Reachability (c) — the ollama tools-unsupported fallback — repairs at its own site and reports back on a third return element so ONE emitter covers every case. ONE `memory.operation` span per degraded dispatch, every attribute reporting what ACTUALLY happened so the two dispositions are distinguishable without parsing a reason string: REPAIRED emits operation_name=injection / operation_kind=inject / access_mode=prompt_extension_packet / the SERVED packet_hash + record_count, no failure_class (a successful injection through a different seam); REPORT-ONLY emits operation_name=denial / operation_kind=inject / access_mode=no_memory_access / record_count=0 / NO packet_hash (claiming a served hash for a withheld packet would be a lie), mirroring `compose_run_start`''s own DENIAL+INJECT shape for the no-memory outcome. failure_class is deliberately UNSET on both -- no member of the closed `MemoryTelemetryFailureClass` describes a provider-scope mismatch, and reusing POLICY_DENIAL would assert a decision no resolver made. `memory.degraded_serve` + `.reason` (`arm_unservable` | `provider_scope_mismatch`) + `.selected_access_mode` carry the B-83 detail, on the MEMORY tracer''s span only (C-OD-04 §4.3 namespace discipline); the reasons are span-attribute VALUES, never new enum members. Spec anchors verified byte-exact: C-MEM-14 `Spec_Memory_Substrate_v1.md:489` states the exposure as a present-tense obligation; C-MEM-13 `:460` authorizes the packet for providers without usable tool support. POSTURE CHOSEN: repair-to-packet, NOT the fail-loud raise close-out step (1) leaned toward — a raise turns a currently-silent degradation into a run failure for any deployment on the injected-context + fallback shape, and C-MEM-13:460 already sanctions the packet, so the conservative reading serves memory rather than killing the run. NOT BUILT, deliberately, and recorded so nobody silently absorbs it later: the literal "explicit LEDGERED degradation" half of close-out (1). Writing a degradation ENTRY (as opposed to the span emitted here) is fork-shaped — the load-bearing blocker is the absent store carrier on the dispatch path (a new dispatcher-visible Protocol/field surface), an X-AL-3 design extension. (Qualified at the merge-gate: reusing the run-start DENIAL+INJECT shape needs no new enum members — compose_run_start already ledgers a no-memory outcome with existing members; new members on the three closed enums (`MemoryOperationKind`, `MemoryTelemetryOperationName`, `MemoryTelemetryFailureClass`) would be needed only for a dispatch-time-DISTINCT operation kind.) BEHAVIOR CHANGE, flagged: the B-82 round-5 ollama fallback no longer BYTE-RESTORES the pre-B-82 bare dispatch — the retry still drops the tools (which is what the daemon rejected) but now carries the packet as read-only prompt text; the R5 comment block and its witness (`test_ollama_tool_unsupported_model_falls_back_to_the_tool_free_path`, renamed) were updated to the new contract rather than deleted. OUT-OF-FAMILY CODEX ROUNDS 1-7 caught TEN real findings across FOUR defect shapes -- packet SCOPE, single-system-SOURCE folding, the repair''s own AUTHORIZATION, and the OBSERVABILITY of the decision -- all fixed on this branch, all reproduced empirically before fixing. ROUND 7 (final fix round before merge-gate), one [P2] at the intersection of the last two surfaces: [P2-e] the span always reported `packet_policy_denied` whenever the packet fallback was ineligible, because the carrier was a BOOLEAN -- so a run denied by an EMPTY TOKEN BUDGET, or by an absent provider capability, was reported as an operator POLICY decision. That is a false accusation about a configuration the operator never made, and it points any investigation at the wrong file. Fixed by replacing `RuntimeMemoryContext.prompt_packet_fallback_eligible: bool` with `prompt_packet_fallback_denial: str | None` -- None = authorized; otherwise the counterfactual selector''s OWN `MemoryAccessModeDenialReason` value, carried verbatim to the span. GROUNDED CORRECTION to the round-7 brief''s hypothesis: it anticipated three distinguishable causes (policy / budget / capability), but the selector yields only TWO reachable values -- `token_budget_empty` for the budget gate, and `no_supported_mode` for BOTH a denying `injection_access` AND an absent `supports_prompt_extension_packet`, which it does not separate once past its packet branch. Verified empirically across all five configurations before writing a line. The fix therefore removes the FALSE distinction without inventing one the selector cannot observe -- a witness asserts that non-distinction explicitly so a later reader does not mistake it for a gap. The fail-safe default is a `not_derived` sentinel, asserted DISJOINT from every real `MemoryAccessModeDenialReason` value, so an underived context is never mistaken for a gate that actually closed. ROUND 6, one [P2]: [P2-d] the degraded-serve span was emitted from a POST-dispatch block, so whenever the provider call raised (timeout, adapter error, the bare ollama retry itself failing) control left before emission and the only B-83-specific signal vanished -- even though by then the packet had already been SENT (the disclosure happened) or already been WITHHELD (the denial happened). Fixed by moving emission into a `finally` around the whole arm-dispatch chain, with a `memory.degraded_serve.dispatch_outcome` attribute (`completed` | `provider_error` | `cancelled`) plus `memory.degraded_serve.provider_error_type` on failure. Cancellation is labelled separately rather than blamed on the provider; the enclosing `gen_ai` span already records the exception itself via OTel''s `record_exception` / `set_status_on_exception` defaults, which this module relies on everywhere rather than calling explicitly, so the short degraded span carries the class as an attribute instead. SECOND HALF, and the reason round 2''s return-bundle choice had to be REVERSED: the R5 fallback decides its degradation INSIDE the arm call and returned it as a tuple element -- which travels ONLY on success, so an R5 retry that itself failed lost the report entirely, and the arm site''s own local was None on that path (the serve-check returns None for a servable arm). Replaced with a `_DegradedMemoryServeSink` single-slot carrier written the moment the disposition is settled, BEFORE the retry it describes. Both halves are separately load-bearing and separately probed. RESIDUAL EXIT PATHS, stated plainly: `asyncio.CancelledError` propagates THROUGH `finally`, so the span is still emitted (witnessed, not assumed); the same holds for any BaseException. The only losses left are process-level -- SIGKILL, a hard interpreter crash, or an OTel exporter that drops the span downstream -- none of which any in-process placement can address, and all of which lose the enclosing `gen_ai` span too, so the degraded span is no weaker than the dispatch telemetry it accompanies. ROUND 5, one [P1]: [P1-e] the repair rendered the packet WITHOUT evaluating the prompt-packet mode''s own gates. `select_memory_access_mode` returns at the FIRST mode whose gates pass, so a STANDARD_MEMORY_TOOLS selection proves NOTHING about PROMPT_EXTENSION_PACKET -- that branch was never evaluated. A policy allowing `standard_tool_access` while `injection_access` denies prompt packets is legal and expressible (DENY is the field default, and the in-repo test `test_external_cli_route_metadata_composes_with_standard_tool_context` already builds exactly that shape), and the packet branch additionally requires `token_budget > 0` which the tools branch does not -- so the degradation could disclose memory through a mode the operator had switched off, on an unbudgeted run. AUTHORITY GAP, stated plainly: the needed inputs (`workflow_policy` / `step_policy` / `token_budget` / `provider_capabilities`) live on the COMPOSITION request and are on NEITHER `RuntimeMemoryContext` NOR `MemoryAccessModeSelection`, so the dispatcher cannot answer the question at dispatch time. Rather than mirror-copying policy predicates into harness-runtime (the drift class this workspace treats as a defect) or parsing `decision_trace` strings, the answer is settled at COMPOSITION -- where the inputs are in scope -- by RE-RUNNING the real `select_memory_access_mode` with native+standard-tools capabilities masked off (the exact counterfactual the repair faces) and carried forward on a new additive `RuntimeMemoryContext.prompt_packet_fallback_eligible` field. The probe is pure (the selector is documented "without touching credentials") and composes the WHOLE decision tree in canonical order with zero duplicated logic. The field DEFAULTS FALSE: a context assembled anywhere but `compose_run_start` has not proven eligibility, and unproven reads as ineligible -- `compose_run_start` is the ONLY production producer (the static `RuntimeLLMDispatcher.memory_context` seam has no production wiring; `materialize_llm_dispatcher_stage` defaults it None), so production coverage is total while hand-built contexts fail safe. FIXTURE HONESTY, per the round-5 brief: the B-83 dispatch fixtures WERE silently relying on the unchecked path -- their implied `policy:u-mem-16` document leaves `injection_access` at its DENY default -- so the flag is now an EXPLICIT fixture parameter (default True, i.e. these witnesses model an `injection_access=PROMPT_PACKET` policy with a non-empty budget) instead of an unstated assumption. AUTHORIZATION NOW COMPOSES, and the set is EXHAUSTIVE against the selector''s own decision tree: the repair requires (1) provider IDENTITY, (2) provider FAMILY scope, (3) prompt-packet eligibility, which itself composes every gate on the path to PROMPT_EXTENSION_PACKET -- `policy.enabled`, `retrieval_access` DENY, external-CLI route/auth denial, `supports_prompt_extension_packet`, `injection_access` != PROMPT_PACKET, and `token_budget <= 0`. Verified mechanically by driving each of those six gates negative one at a time: three (`enabled`, `retrieval_access`, external-CLI auth) collapse the selection to NO_MEMORY_ACCESS, where `_packet_matches_mode` forbids a packet at all and the repair is unreachable BY CONSTRUCTION; the other three leave STANDARD_MEMORY_TOOLS selected (repair reachable) and the eligibility flag correctly reads False. There is no seventh gate on that path. ROUND 4, one [P2], the anthropic member of the fold-shape family: [P2-c] the fold asked "is there an existing system source?" by TRUTHINESS while the conflict check asks it by PRESENCE (`"system" in kwargs`). Two VALID shapes slipped through the gap -- the SDK content-block ARRAY (the same `[{"type": "text", ...}]` form `_anthropic_system_cache_block` itself emits) and the empty string -- landing in the `system`-variable branch, where the still-present `params["system"]` then collided and raised PromptInjectionConflictError: the repair converting a VALID dispatch into a failure. Fixed by keying the fold on `"system" in payload.params`, so the fold predicate and the conflict predicate agree on what "present" means, and by routing the value through the round-3 `_content_with_appended_packet` -- whose sequence branch appends a `{"type": "text", ...}` block, a valid Anthropic `TextBlockParam` (`cache_control` optional) -- so no divergent serialization was introduced. COMPLETENESS SWEEP (round 4 close-out, run through the REAL translators, 17 arm x shape combinations): for each of the four arms the FOLD predicate now mirrors that arm''s own CONFLICT predicate -- anthropic on `"system" in payload.params`; openai/ollama on a leading `role:"system"` in the POST-`params`-merge `kwargs["messages"]` (so a `params["messages"]` override is covered, matching `_inject_leading_system_message`); external-CLI on a leading `role:"system"` in `payload.messages` (that renderer ignores `params` for messages, so there is no post-merge divergence to cover) -- and every value shape reaching a fold is total: `_content_with_appended_packet` (str/None/sequence/other) for anthropic+openai+ollama, `_external_cli_message_content` (str/other) for the CLI. All 17 combinations kept the original text AND carried the packet, with no raise and exactly one system source. ONE residual, characterized not fixed: the "exactly one system source" property is INDEX-0-SCOPED on openai/ollama -- a `role:"system"` message at index>0 is seen by neither the conflict check nor the fold, so the fold prepends a leading one and the wire carries two system messages. That is the PRE-EXISTING conflict-check semantics (R-PM-1), not a B-83 regression, it raises nothing and replaces nothing, and OpenAI accepts multiple system messages. ROUND 3, both [P2], both in the fold helpers the round-2 fix introduced: [P2-a] OpenAI accepts a system-message `content` as either a plain string OR a content-part ARRAY, and the fold coerced it through `str()` before appending -- putting a Python repr (`"[{''type'': ''text'', ...}]"`, reproduced verbatim at the probe) on the wire and destroying the parts. Fixed with `_content_with_appended_packet`, which folds each shape in its own terms: string/None -> string append; a parts SEQUENCE -> ONE ADDITIONAL `{"type": "text", "text": ...}` part (the same part shape this module already emits at the Anthropic system block and the external-CLI response) with every original part preserved in order; any other shape -> JSON-serialized (`sort_keys` + `default=str`, matching `_inject_upstream_context_message`) then string-appended, so an unexpected shape is neither mangled nor raised on. GROUNDED AND SKIPPED for ollama: `ollama._types.Message.content` is `Optional[str]` (`ollama/_types.py:312`), str-only, so a parts array cannot reach the daemon through the typed client -- ollama shares the helper but can only take the string branch. [P2-b] the external-CLI fold passed None to the append helper for any non-string content, REPLACING the step''s own system instructions with the packet alone -- and since the external-CLI arm is text-only it ALWAYS degrades standard_memory_tools, making that the COMMON path there rather than an edge case. Fixed by extracting the renderer''s own serialization into `_external_cli_message_content` and reusing it at BOTH the render loop and the fold, so a repaired dispatch can never represent the same content differently from an unrepaired one. ROUND 2: [P1-c] the round-1 scope conjunct was IDENTITY-level while the disclosure boundary is FAMILY-level: on the `memory_runtime` path a cross-family fallback RECOMPOSES the context for the current candidate (so `selected_provider` matches and the identity conjunct passes) while `compose_for_dispatch` keeps deriving `record_scope.provider_family` from `fallback_chain.primary.family` (`automatic_memory.py:191-199`), and `MemoryRetriever._scope_mismatch` (`memory_retrieval.py:371-384`) filters records on exactly that field -- so a PRIMARY-family packet reached the ollama R5 retry and was rendered. Fixed by adding a family conjunct keyed on the packet''s ACTUAL `record_scope.provider_family` versus `provider_family_for_provider(provider)` (`cross_family_cost_tag.py:82` -- the workspace''s existing provider->family authority; a second mapping would be the mirror-copy drift class), reason `provider_family_scope_mismatch`, and both conjuncts now live in ONE shared `_degraded_serve_disposition` read by the arm-selection check AND the R5 site. An absent scope or absent family counts as NOT matching -- `_scope_mismatch` treats a None request family as "no constraint", so the packet may hold records of any family and unverifiable is not safe. This also exposed a FIXTURE LIE: the test helper hardcoded `provider_family=OPENAI` for every context regardless of provider, so anthropic/ollama witnesses were asserting a scope their provider did not have; the fixture now derives the family from the provider through the same authority. [P1-d] the ARM-SELECTION repair still appended the packet as a SECOND system source -- the exact class round 2 fixed at the R5 site, unfixed at its sibling -- so a payload already carrying its own system prompt raised PromptInjectionConflictError across the openai/ollama/external-CLI/anthropic translators. Fixed by threading the packet as a `memory_packet` parameter so EACH translator folds it into ITS OWN single effective system source (anthropic''s `params["system"]`-or-kwarg, folded BEFORE the cache-breakpoint decision so the block covers the merged text; openai/ollama''s leading `role:"system"` message post-`params`-merge; the external CLI''s system section) rather than duplicating each translator''s rule at the call site. A genuine TWO-BASE collision (active prompt AND payload system) still fails loud, witnessed. GROUNDING FINDING, registered not absorbed: the SERVABLE tools path crosses the same family boundary with strictly greater reach (read AND write via the fixed-value `scope_ref`), pre-existing since U-MEM-16/B-82 and gated on a C-MEM-11/13 scope-semantics decision -- NEW row B-86. ROUND 1: [P1-a]: the (b) repair forwarded provider X''s packet to a Y-family provider -- the provider-family scope leak described above; (b) is now report-only. [P1-b]: the R5 retry supplied the packet as a SECOND system source, so `_inject_leading_system_message` raised `PromptInjectionConflictError` for any payload already leading with a system message -- the previously-working tool-free fallback hard-failed for the idiomatic self-system-prompt step shape (reproduced live before fixing). Closed by folding the packet into the ONE effective system source (`_fold_memory_packet_into_system` + a defaulted `memory_packet` kwarg on `_dispatch_ollama`; None keeps every other caller byte-identical), operating on FINISHED kwargs post-`params`-merge for the same reason `_inject_leading_system_message` does -- a `params["messages"]` override can hide the real leading system message, so a payload-level merge would reintroduce the collision. 27 deterministic witnesses, 16 mutation probes (disable the serve-check → 4 fail; revert the R5 packet injection → only (c) fails; drop the provider-identity conjunct → only (b) fails; repair the provider mismatch → only the (b) report-only witness fails; revert to the two-source retry shape → the P1-b witness reproduces PromptInjectionConflictError; drop the family conjunct → only the cross-family witness fails; revert the arm-selection repair to append-as-second-source → both P1-d witnesses reproduce PromptInjectionConflictError; revert the OpenAI content fold to `str()` → the parts-array witness fails on a Python repr; revert the external-CLI fold to the None-pass → the mapping-content witness fails with the step''s directive entirely absent; revert the anthropic fold to the truthiness key → BOTH the block-array and empty-string witnesses reproduce PromptInjectionConflictError; drop the eligibility conjunct → both packet-policy-denied witnesses fail (arm site AND R5 site); stub the composition-time derivation to always-eligible → both composer-level derivation witnesses fail; move the emission back post-dispatch → all four exception-path witnesses fail; publish the R5 sink AFTER its retry instead of before → the R5-retry-failure witness fails alone; collapse the composer derivation back to one label → both composer-level precise-reason witnesses fail; collapse the span reason at the disposition → all three dispatch-level precise-reason witnesses fail). The mixed memory+caller batch case, previously scoped under this row, is genuinely unrepairable at its site and moved to NEW row B-85. Full harness-runtime non-e2e suite green (3151 passed / 10 skipped).'
  close_out: '(1) Decide the failure posture: a fail-loud typed error at the dispatch boundary when `memory_context.access_mode is STANDARD_MEMORY_TOOLS` and the resolved provider arm has no standard-memory-tools sibling, versus an explicit, ledgered degradation to PROMPT_EXTENSION_PACKET/NO_MEMORY_ACCESS (which C-MEM-13:463 would then require be ledgered -- the mechanism already exists per the grounding note, only the dispatch-side re-composition trigger would be new). Fail-loud is the cheaper and more consistent reading given the surrounding `LLMDispatchPayloadShapeError`/`MemoryToolExecutionInputError` conventions. (2) Separately decide whether a statically injected `memory_context` should be re-composed (or invalidated) on a fallback provider rebinding, or whether that configuration should simply be refused at bind time when a `fallback_chain` is also bound -- the latter is a much smaller surface. (3) Witness with two deterministic tests: an explicit-capability-override dispatch against the anthropic arm, and a rebinding test where a STANDARD_MEMORY_TOOLS context composed for openai is dispatched through a cross-family fallback to anthropic. RECORDED RESIDUAL OF THE OBSERVABILITY SURFACE: `B-87` -- the `finally` emission introduced at round 6 over-reports a PRE-wire translation failure as a completed injection (packet_hash present, zero adapter calls made). Registered rather than fixed: the imprecision OVER-reports, and this arc reached its fix-round cap at Codex R7.'
  council: 'Likely for step (1), no for step (3). Choosing fail-loud versus explicit-ledgered-degradation is a C-MEM-13 selection-semantics decision with a blast-radius dimension (a fail-loud raise turns a currently-silent degradation into a run failure for any deployment relying on the injected-context + fallback configuration) -- C10 (blast radius) paired with whichever voice owns the memory access-mode selection semantics. Step (2)''s bind-time refusal is mechanical once (1) is settled.'
  heading: '### B-83 · No dispatch-side guard that the selected `STANDARD_MEMORY_TOOLS` access mode is actually served by the provider arm reached *(surfaced by the B-82 fix, 2026-07-27; CLOSED 2026-07-28 — PR #1142)*'
- id: B-84
  title: 'Memory tool batch: an executor-level argument failure mid-batch can commit earlier writes, then retry-duplicate them'
  status: registered_finding
  summary: 'Out-of-family Codex round 4 on the B-82 arc (2026-07-27). Round 1 made both memory tool loops validate the COMPLETE batch before executing any of it, closing the DISPATCH-side half of the partial-batch problem. A second half remains one layer down: validation the dispatch layer legitimately does not perform still happens mid-execution, at the executor. A batch of [memory.write_note (valid), memory.read (missing the contract-required `memory_ref`)] passes every dispatch-side check, so the result-message builders execute in order -- the write COMMITS a durable record, then the read raises MemoryToolExecutionInputError from `_string_arg` (`harness-runtime/src/harness_runtime/memory_tool_executor.py:549-553`). That error WAS retry-classified TRANSIENT (`_classify_provider_exception` fail-fasted only LLMDispatchProviderUnreachableError / LLMDispatchPayloadShapeError / HTTP 401-403), so RetryBreakerFallbackDispatcher re-ran the whole dispatch and the committed write executed once per retry -- the same double-write class as the round-1 [P1], reached through a different door. PARTIAL MITIGATION LANDED (2026-07-28): MemoryToolExecutionInputError now joins the fail-fast branch of `_classify_provider_exception` (`harness-runtime/src/harness_runtime/lifecycle/retry_breaker_fallback.py:326-334`), so the retry staircase no longer re-runs the dispatch for this class -- on the default single-candidate chain the mid-batch failure now consumes exactly ONE dispatch instead of max_attempts. THE ROW STAYS registered_finding: the RETRY-duplication half is closed, the PARTIAL-COMMIT half is NOT -- the earlier write in the batch still commits before the later call raises, and a MULTI-candidate fallback chain still re-dispatches the whole batch on each remaining candidate (one extra copy per candidate, versus max_attempts x candidates before). ALREADY PREVALIDATED by the B-82 rounds-1/3 pre-pass, for every call, before anything executes: tool_call wire shape (function mapping; OpenAI id present); name resolution to a MemoryToolName (wire map on OpenAI, dotted-only on ollama); arguments normalizing to a mapping (fail-loud otherwise); and the RuntimeMemoryContext checks (record_scope/scope_ref present; scope_ref argument matching the context for the two tools whose contracts declare it). NOT checked: per-tool required-argument keys and per-tool policy gates -- those are the EXECUTOR''''s semantics. Reachability requires a multi-call batch with an earlier valid write AND a later dispatch-valid-but-executor-invalid call; unreachable for single-call batches. AGGRAVATOR (out-of-family Codex round 5, verified empirically at registration time against the locked ollama 0.6.2 SDK): the ollama client REVALIDATES caller-supplied tool mappings as its own `ollama.Tool` model before posting to /api/chat (`ChatRequest.tools: Optional[Sequence[Tool]]`, `ollama/_types.py:400`), and that model is a CLOSED FIELD SUBSET over a plain pydantic BaseModel -- `SubscriptableBaseModel` (`_types.py:19`) sets no `model_config`, so pydantic''''s default `extra=''ignore''` applies; `Tool.Function.Parameters` (`_types.py:365-371`) declares only type/$defs/items/required/properties, and `Parameters.Property` (`_types.py:372-379`) declares only type/items/description/enum. Every other JSON-Schema keyword is therefore SILENTLY DROPPED on the way to the daemon. Measured directly on the real C-MEM-14 contracts: `memory.search` loses top-level `additionalProperties: false` and `limit.minimum: 1` and `query.minLength: 1`; `memory.write_note` loses `note.minLength: 1`. The model therefore never sees the constraints the contracts declare, which raises the odds it emits an argument payload the EXECUTOR then rejects -- i.e. it feeds exactly this row''''s mid-batch / transient-retry class. Aggravator only: it changes the likelihood, not the mechanism, and the mitigation menu below is unchanged. Note this is orthogonal to the separate, already-fixed B-82 round-5 issue of non-tool-template models (e.g. llava) 400-ing on `tools=` at all. 2026-07-30 post-#1159 re-check (gate-log LOW batch): the DEFECT premise is unchanged (both halves re-verified at the 2026-07-29 pass above and untouched since), but direction (2)''s COST ASSESSMENT predates U-MEM-27. Two substrate pieces the (1)-vs-(2) framing was written without now exist: a GENERIC compare-and-commit seam on the canonical store (`CanonicalMemoryStore.write_record_guarded`, `harness-is/src/harness_is/memory_store.py` -- it carries no promotion, provenance, or policy semantics, so a batch executor can supply its own precondition), and a REENTRANT per-root cross-process hold (`cross_process_scope_lock`) under which a multi-write section can evaluate and commit without releasing. Neither makes an append-only store transactional by itself, and the compensation question direction (2) actually turns on is untouched -- but "make the whole batch atomic" no longer starts from nothing, so the (1)-vs-(2) tradeoff leans differently than this row records. Re-price BOTH directions at build time rather than reading the recorded lean.'
  close_out: 'Two candidate directions, neither obviously dominant. (1) An executor-exposed pure `validate()` pre-pass: the executor grows a side-effect-free method running exactly the argument/policy checks `_execute_authorized` would run, and the dispatch batch pre-pass calls it for every call before executing any -- keeps ONE source of truth (the executor still owns the semantics; dispatch only asks) at the cost of a new public surface plus the discipline that every future check lands in the shared path. (2) Transactional / journaled batch execution at the executor: accept a batch and either commit all durable operations or none, using the existing memory-operation ledger as the journal -- strictly stronger (it also covers mid-batch failures no pre-pass could predict, e.g. a policy resolver flipping or an I/O error) but materially larger, touching durable-write ordering, and it needs a decision about what rollback means for an append-only canonical store (likely compensating ledger entries, not deletion). The third, cheaper mitigation is LANDED (2026-07-28) and does NOT close this row: executor-level INPUT errors are now fail-FAST rather than transient. Grounding verdict before building: IMPL-DISCRETION, not spec-enumerated. Runtime spec §14.6 D2 states the predicate as retry-eligible IFF the exception matches the CP §21.2 transient staircase, FAIL-FAST OTHERWISE (AUTH, payload-shape, shutdown) -- fail-fast is the RESIDUAL class and the parenthetical is illustrative, not a closed set; the §14.5 C-RT-15 table classes and the CP C-CP-21 §21.1 five-value ValidatorRetryExitClass are what is closed, and neither enumerates which concrete Python exception types map to fail-fast. The classifier body already documented itself as MVP-conservative. A contract-invalid C-MEM-14 memory tool call matches nothing in §21.2 (network / rate-limit / 5xx); it is the same permanent malformed-input class as RT-FAIL-PAYLOAD-SHAPE, raised one layer deeper, so the reclassification moves the impl TOWARD the spec predicate rather than extending it. NOTE the register originally justified this as identical-arguments-fail-identically, which is imprecise: a retry re-dispatches to the provider and re-samples the tool-call arguments, so a retry COULD emit valid arguments. The defensible rationale is the spec predicate plus the RT-FAIL-PAYLOAD-SHAPE parity, and the harm removed is the duplicate commit, not wasted attempts. SCOPE: MemoryToolExecutionDeniedError is deliberately EXCLUDED -- `_read_record_by_ref` (`harness-runtime/src/harness_runtime/memory_tool_executor.py:446-449`) wraps ANY store exception, including genuinely transient I/O, into the denied class, and `_allowed_index_entry` (`:424-435`) raises it off mutable index/store state, so fail-fasting the base class would kill retries for real flakes; whether a policy DENIAL is permanently terminal is a C-MEM policy-semantics decision this narrow change does not take. Three witnesses at `harness-runtime/tests/test_lifecycle_retry_breaker_fallback.py` (fail-fast candidate-advance plus permanent-fail-exit span class; single-candidate exactly-one-dispatch; denied-still-retries scope guard), each mutation-probed: reverting the isinstance addition fails the first two (3 dispatches instead of 1 -- the duplication class made visible), widening it to the MemoryToolExecutionError base fails the third. ROUND-1 OUT-OF-FAMILY CODEX FOLLOW-ON (same arc): `_allowed_kinds` (`harness-runtime/src/harness_runtime/memory_tool_executor.py:574-598`, the bare conversion was at pre-fix `:584`) raised a BARE ValueError from `MemoryRecordKind(item)` on an unknown allowed_kinds string, so a memory.search with a bad kind following a committed memory.write_note still replayed transient -- MemoryToolExecutionInputError SUBCLASSES ValueError, not the reverse, so a bare ValueError misses the isinstance check entirely. Wrapped to raise the typed input error naming the offending value plus the accepted kinds. MANDATORY SIBLING SWEEP RESULT -- this was the ONLY gap. Every model-supplied argument in the executor reaches exactly five helpers, all already typed: `_string_arg` (:549-553), `_optional_string_arg` (:556-562), `_positive_int_arg` (:565-571), `_allowed_kinds` (:574-598, the fixed site), `_promotion_kind` (:654-669, KeyError already wrapped); `_kind_from_memory_ref` (:635-642) already wraps its enum conversion. MemoryID / Identifier are NewType (`harness-is/src/harness_is/memory_record_envelope.py:23`, `state_ledger_entry_schema.py:33`) -- zero runtime validation, so not raise sites. MemoryRetrievalRequest / PromotionCandidate / MemoryOperationPayload pydantic constructions carry no constraint reachable from a model argument (query_summary is an unconstrained str; token_budget comes from the harness-built context). MemoryToolExecutionContext._non_empty_string (:113-118) raises a bare ValueError but validates HARNESS-supplied context strings, never model input. Dispatch side: both `MemoryToolName(name)` conversions (`llm_dispatch.py:3562` openai, `:4160` ollama) and every other wire-shape check already raise LLMDispatchPayloadShapeError, which was already fail-fast. Witness: a real-executor memory.search with an unknown allowed_kind asserting the typed error, its message content, and -- cross-layer, on the REAL exception instance -- `_classify_provider_exception(...) is None`. Mutation-probed: unwrapping the conversion fails the witness with `ValueError: ''not_a_real_kind'' is not a valid MemoryRecordKind`, and the same exception then classifies `transient-retry` (the replay). ADJACENT ROW: typing this site also SHIFTED its emitted telemetry class (the pre-fix bare ValueError classified provider_adapter_failure, the typed error classifies io_failure) -- neither value is correct; the substring-keyed classifier defect that causes it is registered as B-88. NEITHER (1) NOR (2) was done unilaterally at the B-82 arc: the naive fix -- full per-tool contract prevalidation at the dispatch layer -- would MIRROR-COPY the executor''''s required-key and policy semantics into a second location, the drift class this workspace treats as a defect in its own right (the copy rots the first time a contract''''s required set changes, and the two copies then disagree about which calls are legal). B-82 round 3 established the boundary empirically: required-key enforcement lives at `memory_tool_executor.py:266` -> `:549-553`, and the dispatch layer validates only scope_ref/policy_ref. 2026-07-29 dormancy re-check: premise intact at HEAD dd2a8c1a -- both halves of the batch pre-pass are untouched by the #1149-#1155 telemetry/reap arcs (the executor''s own last change is #1148; #1151/#1154 moved only span attributes at the dispatch site), so the dispatch-side complete-batch validation still precedes an executor that validates mid-execution, and the mid-batch commit-then-retry-duplicate window stands as described.'
  council: 'Likely. Direction (2) is a durable-write-semantics decision (all-or-nothing across a batch, and what compensation means for an append-only store) with a blast-radius dimension -- C10 paired with whichever voice owns the IS-side memory operation ledger. Direction (1) and the fail-fast reclassification are closer to mechanical once the direction is chosen, but the choice between (1) and (2) is not: it is the difference between preventing the predictable case and making the whole batch atomic. Picking (1) forecloses nothing; picking (2) subsumes it.'
  heading: '### B-84 · Memory tool batch: an executor-level argument failure mid-batch can commit earlier writes, then retry-duplicate them *(surfaced by out-of-family Codex round 4 on the B-82 arc, 2026-07-27)*'
- id: B-85
  title: A mixed memory+caller tool batch returns the advertised memory call unserved and un-ledgered
  status: closed
  pr: '#1145'
  summary: 'Surfaced at the B-83 fix (2026-07-28), split out of B-83''s own "adjacent, same family" note because the B-83 repair provably cannot reach it. Both standard-memory-tool continuation loops, on seeing a response whose tool_calls[] mixes a C-MEM-14 memory call with a caller-advertised tool call, hand the WHOLE response back unprocessed and execute nothing from it — a deliberate B-82 round-2 choice for batch atomicity + bare-path parity (a mixed batch must not half-commit memory before control returns). The consequence: the memory call the model explicitly asked for is never served, and NOTHING records that it wasn''t — no span, no ledger entry, no error. The caller cannot serve it either; it does not own the memory tools. Reachability: `harness-runtime/src/harness_runtime/lifecycle/llm_dispatch.py:3389-3401` (openai arm) and `:3979-3987` (ollama arm), line numbers at the B-83 arc final HEAD (corrected at the merge-gate after later-round drift) — the two `if not _all_calls_are_memory_tools(...)` early returns; both sites now carry an inline `B-85` marker. WHY NOT FIXED AT THE B-83 ARC: B-83''s repair is prompt-composition, applied BEFORE the provider call. This exit happens AFTER a response is already composed, and a prompt packet cannot retroactively answer a tool call the model already emitted — so there is no mechanical repair to apply, only a posture to choose. NOT a defect in the atomicity choice itself, which remains correct.'
  close_out: 'Choose the posture; the mechanics follow trivially from whichever is chosen. (1) FAIL: raise at the mixed-batch detection so the unserved memory call is loud rather than silent — consistent with the surrounding `LLMDispatchPayloadShapeError` conventions, but it turns a currently-working caller-tool dispatch into a failure. (2) SPLIT: execute the memory calls, return the caller''s calls unprocessed — restores service but reopens exactly the half-commit window B-82 round 2 closed (the memory writes commit, then the caller''s handling can fail and the whole dispatch retries under the TRANSIENT classification). (3) REPAIR/RECORD: keep the return-whole semantics and emit a degraded/unserved telemetry span at the exit — cheapest and preserves atomicity, but leaves the model''s request genuinely unanswered. Note (3)''s span is emittable with the existing closed enums; a LEDGERED entry is not (same X-AL-3 constraint recorded at B-83''s close-out). CLOSED 2026-07-28 (Round 37 grounding arc, same PR as the B-86 Class 1 fork filing): posture (3) RECORD chosen and landed. GROUNDING VERIFIED THE SPEC IS SILENT -- C-MEM-14 (`Spec_Memory_Substrate_v1.md:489`) obliges tool EXPOSURE, not service; C-MEM-13''s must-ledger clause (`:463`) binds only `no_memory_access` transitions; and C-MEM-08''s closed 12-kind operation enum (`:247`/`:251`) cannot express requested-but-unserved, which confirms the LEDGER half is X-AL-3-blocked exactly as this close-out predicted while the SPAN half is emittable. EMISSION: a SEPARATE single-slot sink + emitter, deliberately NOT the degraded-serve emitter -- that emitter''s `rendered=None` shape hardcodes `DENIAL` / `no_memory_access` / `degraded_serve=True`, all three FALSE at iteration k>0 where the loop has already served k rounds. The new span carries `operation_name=standard_tool_call`, `access_mode=standard_memory_tools`, `record_count=0`, NO packet_hash, NO failure_class, `reason=mixed_batch_caller_owned`, plus a quantitative `memory.unserved_tool_call.count` -- all riding attribute VALUES per the B-83 precedent, never new members of a closed enum. Return-whole semantics are byte-identical, and a zero-memory-call caller-only batch deliberately emits nothing (negative-asserted). POSTURES (1) AND (2) REJECTED AS CLASS-2-SHAPED: (1) FAIL inverts the witnessed bare-path-parity invariant (enabling memory must never turn a working caller-tool dispatch into a failure) and pays fail-fast candidate abandonment for what is an observability gap; (2) SPLIT reopens exactly the duplicate-durable-write window B-82 round 2 and B-84/PR #1143 closed, on a path where the harness cannot serve the caller half anyway. A FOURTH OPTION was enumerated and rejected: withhold the memory tools whenever the step advertises caller tools, making the mixed batch unrepresentable -- preventive, but it disables memory on every tool-declaring step and changes WHICH memory a run reaches, which is B-86''s territory. STATED HONESTLY: the span may fire 0..N times across retry attempts, since model-emitted batches are nondeterministic -- the same property as the B-83 span, and the witnesses do not assert exactly-once. NOT FORECLOSING: advisor + grounding both record that choosing (3) leaves (1) and (2) available later as a Class 2 fork, and that (3) is the option preserving the committed B-82-round-2 atomicity decision.'
  council: 'Likely. This is the same C-MEM-13/14 serve-semantics decision B-83 answered for the pre-call case, now for the post-response case, and each option trades a different harm: (1) blast radius on working dispatches, (2) reopens a durable double-write window, (3) accepts a silent-to-the-model outcome. C10 (blast radius) paired with whichever voice owns memory access-mode selection semantics.'
  heading: '### B-85 · A mixed memory+caller tool batch returns the advertised memory call unserved and un-ledgered *(surfaced at the B-83 fix, 2026-07-28)*'
- id: B-86
  title: Cross-family fallback serves the chain primary's memory scope to a different-family provider on the SERVABLE tools path
  status: closed
  pr: '#1148'
  summary: 'Surfaced while grounding B-83 [P1-c] (2026-07-28). The B-83 fix stops the degraded-serve PACKET from crossing a provider-family boundary, but the SERVABLE tools path crosses the same boundary and was left untouched, deliberately and with a much larger blast radius. On the `memory_runtime` path a cross-family fallback RECOMPOSES the context for the current candidate, so `select_memory_access_mode` re-picks STANDARD_MEMORY_TOOLS from the CANDIDATE''''s capabilities and the tools are injected -- but `automatic_memory.compose_for_dispatch` derives `record_scope.provider_family` from `fallback_chain.primary.family` (`harness-runtime/src/harness_runtime/automatic_memory.py:191-199`), NOT from the candidate. The injected tool schemas bind `scope_ref` (a hash of that PRIMARY-family scope) and `policy_ref` as fixed enum values (`_openai_standard_memory_tools` / `_ollama_standard_memory_tools`), so the candidate can `memory.search` across, and `memory.write_note` INTO, a scope belonging to a different provider family -- read disclosure AND write attribution, where B-83''''s packet leak was read-only. `MemoryRetriever._scope_mismatch` (`harness-is/src/harness_is/memory_retrieval.py:371-384`) filters on `provider_family`, confirming the field is a real enforcement boundary and not merely descriptive. RESIDUAL, same family: `provider_family_for_provider` (`harness-runtime/src/harness_runtime/lifecycle/cross_family_cost_tag.py:82`) falls back to LOCAL_OPEN_WEIGHT for an UNKNOWN provider key, so an unregistered provider compares equal to an ollama-scoped packet at B-83''''s new family conjunct -- conservative for its original cost-attribution use, wrong for a scope-boundary check. PRE-EXISTING, not introduced by B-83: the tools path has behaved this way since U-MEM-16/B-82. Scoped out of the B-83 arc because closing it means either disabling memory entirely on every cross-family fallback or recomposing the scope per candidate -- both change WHICH memory a run can reach, a C-MEM-11/13 scope-semantics decision rather than the dispatch-side serve-check B-83 owns.'
  close_out: 'CLOSED 2026-07-28 at the U-MEM-26 impl leg (this PR). The C-MEM-13 withhold guard landed as the SIXTH conjunct of `_standard_memory_tools_context` (`harness-runtime/src/harness_runtime/lifecycle/llm_dispatch.py`), sharing `_packet_scope_matches_dispatch_family` VERBATIM with the `_degraded_serve_disposition` predicate rather than adding a second cross-family test -- a divergent test would let a cross-family dispatch fail the arm guard, fall through to `_degraded_serve_for_unservable_arm`, pass disposition conjunct 2 and land on the `arm_unservable` REPAIR branch, serving the same cross-family packet as prompt text. Downstream is by construction: the guard returns None, the disposition reports `provider_family_scope_mismatch` with `rendered=None`, the plain arm dispatches with no schemas / no `scope_ref` / no packet, and the degraded span carries DENIAL / `no_memory_access` / `record_count=0` / no `packet_hash`; the dispatch still completes. TWO defect-pinning tests were INVERTED with contract cites rather than deleted -- the B-83-era R5 witness required the tools to be ARMED cross-family so the daemon could refuse them (now `test_u_mem_26_cross_family_ollama_dispatch_withholds_tools_and_packet`), and the r300 `api.run` integration test asserted the five C-MEM-14 wire names DO reach the cross-family openai leg (now the inverted assertion in `test_r300_deterministic_cross_family_fallback_through_production_path`; its wire-name / HTTP-400 coverage is preserved on the same-family paths that still inject). Net effect of the B-86 filing''s own item (3) is unchanged and now report-only: the unregistered-key DENIAL, with harness-authored capture UNAFFECTED -- witnessed with the run''s composed scope at `test_u_mem_26_capture_is_unaffected_by_the_cross_family_withholding`, which asserts the captured record carries the chain primary''s `anthropic` family value on an openai dispatch leg. Mutation-probed: dropping the conjunct reddens all three withhold witnesses; swapping it for a raw provider-name `!=` reddens 18 same-family ollama tests. Arc record at `.harness/u-mem-26-impl-leg-close-2026-07-28.md`.'
  council: 'Likely, for (1) and (2). Whether memory scope follows the chain primary or the dispatched candidate decides which records a run can read and write across a fallback, trading a disclosure/attribution boundary against memory continuity on fallback -- C10 (blast radius) paired with whichever voice owns C-MEM-11/13 retrieval scope semantics. (3) is mechanical once (1) is settled and could land ahead of it.'
  heading: '### B-86 · Cross-family fallback serves the chain primary''s memory scope to a different-family provider on the SERVABLE tools path *(surfaced while grounding B-83 [P1-c], 2026-07-28; CLOSED 2026-07-28 — U-MEM-26 impl leg)*'
- id: B-87
  title: Degraded-serve span over-reports pre-wire failures as completed injections
  status: closed
  pr: '#1149'
  summary: 'Surfaced by out-of-family Codex round 8 on the B-83 arc (2026-07-28); REGISTERED, NOT FIXED -- see the direction rationale below. MECHANISM: B-83 round 6 moved the degraded-serve span emission into a `finally` around the whole arm-dispatch chain so a repair that was SENT and then failed still reports (`harness-runtime/src/harness_runtime/lifecycle/llm_dispatch.py`, the `_emit_degraded_memory_serve_span` call in the `finally`). That correctly covers POST-wire failures. It over-covers PRE-wire ones: when the repair is authorized, `_DegradedMemoryServe.rendered` is populated at the serve-check, BEFORE any translation runs -- and the per-arm translators can raise before the provider adapter is ever called. The `finally` then emits `operation_name=injection` + `access_mode=prompt_extension_packet` + the packet_hash + a non-zero record_count, i.e. the span asserts the packet WAS injected, when in fact nothing left the process. VERIFIED EMPIRICALLY at registration time, not hypothesised: driving the residual two-base case (an `active_system_prompt` bound AND a payload-owned `params["system"]`, which B-83 round 4 deliberately leaves as a fail-loud `PromptInjectionConflictError`) through the real dispatcher on a repair-eligible context produced ZERO adapter calls and yet a span carrying `memory.operation.name=injection`, `memory.access_mode=prompt_extension_packet`, `memory.packet_hash=cccc...`, `memory.record_count=1`, `dispatch_outcome=provider_error`, `provider_error_type=PromptInjectionConflictError`. REACHABILITY: any translation-layer raise on a REPAIRED dispatch -- the two-base `PromptInjectionConflictError` residual (reachable on all four arms), `LLMDispatchPayloadShapeError` from the external-CLI text-only tools rejection, and any future pre-adapter validation. NOT reachable for report-only dispositions (`rendered is None` already emits `denial` / `no_memory_access` / no packet_hash), and not reachable when the repair is unauthorized. Note the existing witness `test_b83_two_base_system_sources_still_fail_loud_through_the_repair` already exercises this exact path but asserts only the raise, not the span -- so the arc''''s suite passes over the defect rather than covering it. CANDIDATE FIX: a reached-the-wire marker set at the provider-call boundary (the one place per arm where the adapter is actually invoked), with the `finally` emitting a DISTINCT classification when the marker is unset -- pre-wire failures reported as e.g. `denial` plus a `dispatch_outcome="translation_error"` value and NO packet_hash, since no packet reached a provider. Mechanically small; the care is in threading the marker to every arm''''s true adapter-call site (including the ollama R5 bare retry) without reintroducing the round-6 loss on genuine post-wire failures.'
  close_out: '(1) Add a reached-the-wire marker at each arm''''s provider-call boundary and branch the `finally` emission on it: marker set -> today''''s behavior verbatim (an injection that reached a provider, `completed` or `provider_error`); marker unset -> a distinct pre-wire classification with NO packet_hash and no `injection` operation name, since claiming a packet_hash for a packet no provider ever saw is the whole defect. Ground the exact adapter-call sites first -- there is more than one per arm (anthropic has three variants; ollama has the standard-tools loop AND its R5 bare retry) -- and mind that the marker must be set BEFORE the awaited call, not after it, or a post-wire failure regresses to being reported as pre-wire (the mirror image of this row, and the exact ordering trap B-83 round 6 [P2-d] already hit once with the R5 sink). (2) Extend the existing `test_b83_two_base_system_sources_still_fail_loud_through_the_repair` to assert the SPAN as well as the raise -- the path is already covered, only the assertion is missing. (3) While there, decide whether `dispatch_outcome` should gain a `translation_error` value or whether pre-wire failures are better carried on the `reason` axis; either is an attribute VALUE, never a new member of the closed C-MEM-19 enums. CLOSED 2026-07-29 at PR #1149 (branch b87-reached-the-wire-prewire-marker) -- all three steps land. (1) MARKER: a frame-local `_ProviderWireReachedSink` (`harness-runtime/src/harness_runtime/lifecycle/llm_dispatch.py`) is constructed once per dispatch and threaded to every arm; `_emit_degraded_memory_serve_span` gained a `reached_wire` parameter and branches on it -- marker SET emits today''s post-wire shape VERBATIM (`injection` + packet_hash + record_count, `completed` or `provider_error`); marker UNSET emits `dispatch_outcome="pre_wire_failure"` plus a new `memory.degraded_serve.pre_wire_error_type` attribute, with NO packet_hash and no `injection` operation name (the existing closed-enum member `packet_assembly` is emitted instead). NAME CHANGE against this row''s own candidate: `translation_error` was REJECTED at out-of-family codex R1 [P2] as over-claiming -- ANY pre-wire phase can fail (payload-shape rejection, adapter selection, a repair-authorization raise), not only translation, so the shipped value is phase-neutral by construction and names the BOUNDARY, not the phase. PLACEMENT, per arm: the direct-SDK arms construct the awaitable, mark, then await -- so a call-time SYNCHRONOUS `TypeError` raised by the SDK is correctly classified pre-wire (R7); the external-CLI arm fires INSIDE the subprocess runner after `create_subprocess_exec` returns, the semantic anchor being that a child process now exists that can observe the payload (a spawn failure therefore stays pre-wire) (R2/R3); the anthropic-memory arm fires once inside `execute_with_memory_callbacks` before its first SDK call (R5), since that helper owns a tool loop the dispatcher cannot see into. TWO DECLINES ON THE RECORD: (a) IN-COROUTINE vendor-side validation that raises after the awaitable is entered is POST-wire BY DESIGN -- resolving it would require SDK-internal hooks that do not exist; (b) consequently the SDK arms'' boundary is OUR last observable point, deliberately, and this row does not claim byte-on-the-wire fidelity. COMPATIBILITY TIERS: an adapter or runner that does not DECLARE an explicit `on_wire` parameter (a bare `**kwargs` deliberately does NOT count, R4) keeps the pre-B-87 marker placement, discriminated by the single shared `accepts_explicit_on_wire` predicate; the public runner seam statically admits BOTH shapes (R6). ROBUSTNESS: an `on_wire` callback that raises after spawn kills and reaps the child, and the orphaned coroutine is closed rather than leaked (R7). (2) LANDED -- `test_b83_two_base_system_sources_still_fail_loud_through_the_repair` now asserts the SPAN as well as the raise. (3) RESOLVED as `dispatch_outcome`, an attribute VALUE; no member added to any closed C-MEM-19 enum. 8 out-of-family codex rounds (9 real findings), ~25 mutation-probed witnesses across 4 test files, `just check` 7014 passed.'
  council: 'No. This is a telemetry-accuracy fix inside an already-settled span contract, with the classification axis (attribute values, not enum members) already established by B-83 rounds 5-7. There is no cross-domain tension to surface: nothing about WHICH memory is served or WHO may see it changes -- only whether the span truthfully reports that a disclosure occurred. The one judgement call, whether pre-wire lands on `dispatch_outcome` or `reason`, is impl discretion once the marker exists.'
  heading: '### B-87 · Degraded-serve span over-reports pre-wire failures as completed injections *(surfaced by out-of-family Codex round 8 on the B-83 arc, 2026-07-28; CLOSED 2026-07-29 — PR #1149)*'
- id: B-88
  title: 'Memory failure telemetry: substring-keyed classify_memory_failure collapses the typed input-error family (and two real policy denials) to io_failure'
  status: registered_finding
  summary: 'Surfaced by the merge-gate lens-2 sweep on the B-84 arc (2026-07-28); PRE-EXISTING and latent, orthogonal to B-84 but made visible by it. `classify_memory_failure` (`harness-is/src/harness_is/memory_observability.py:150-163`) classifies into the C-MEM-19 vocabulary by matching SUBSTRINGS of the exception message and of the lowercased type name. Its third rule is `isinstance(exc, (OSError, IOError)) or "io" in exc_name` -- and "io" is a substring of "execut-io-n", so EVERY member of the MemoryToolExecutionError family matches: memorytoolexecutioninputerror, memorytoolexecutiondeniederror, and the base memorytoolexecutionerror. The rules are ordered, so a member escapes only if an EARLIER message rule fires first -- an accident of wording, not a type distinction. EMPIRICAL EVIDENCE (probed at registration time on real exception instances, not inferred): all four typed input errors (unsupported allowed_kinds entry / argument must be a string / argument must be >= 1 / unsupported promotion target_kind) emit io_failure; the BASE MemoryToolExecutionError emits io_failure; and -- the sharper half -- TWO REAL POLICY DENIALS emit io_failure, namely MemoryToolExecutionDeniedError("memory ref X is superseded") (`harness-runtime/src/harness_runtime/memory_tool_executor.py:433`) and ("memory ref X is not retrievable") (`:435`), because neither message contains policy/denied/unavailable. A denial reading "denied by policy" correctly emits policy_denial -- so the vocabulary axis the spec names is honored only by wording luck. Finally, the pre-B-84 bare ValueError from `_allowed_kinds` emitted provider_adapter_failure, so B-84 typing that site SHIFTED the emitted class (provider_adapter_failure -> io_failure); neither value is correct, which is the point. WHY IT IS A DEFECT: `Spec_Memory_Substrate_v1.md:641` (C-MEM-19 Invariants) requires that failure telemetry "must distinguish policy denial, path violation, IO failure, serialization failure, provider adapter failure, and retrieval empty-result" -- two genuine policy denials emitting io_failure violates that invariant on an axis the vocabulary ALREADY HAS (an operator triaging memory IO failures sees records that were merely superseded or unretrievable). A SECOND, SPEC-SIDE HALF: the six-value vocabulary has NO input-validation class, so even a correct classifier has nowhere truthful to put a malformed-argument failure. REACHABILITY: every standard-memory-tool failure path -- `StandardMemoryToolExecutor.execute` (`memory_tool_executor.py:167-175`) calls classify_memory_failure in its blanket except, so the attribute is emitted on every raise. ADJACENT, SAME FAMILY (merge-gate lens 3): on the B-84 fail-fast exit the wrapper calls breaker.record_failure(cause=_classify_breaker_cause(exc)), which returns None for an exception with no .status_code -- correct, but UNWITNESSED: a mutation hardcoding BreakerCause.AUTH_FAILURE there SURVIVES the B-84 witnesses. Same telemetry-precision family (a failure emitting a confidently wrong classification), same fix shape (assert the emitted classification, not just the control flow), so it is recorded on this row rather than as a separate one. IMPL HALF LANDED 2026-07-28 (spec half REMAINS, so the row stays registered_finding): classification is now TYPE-KEYED. classify_memory_failure first reads a memory_failure_class class attribute declared at the exception definition site (MEMORY_FAILURE_CLASS_ATTRIBUTE, harness-is/src/harness_is/memory_observability.py) and that declaration wins outright; only a real MemoryTelemetryFailureClass member is honoured, so a typo or a bare string cannot invent a class outside the closed vocabulary, and getattr walks the MRO so subclasses inherit for free. The message/type-name heuristics survive ONLY as the residual for types that declare nothing, and the io-in-exc_name clause is DELETED (isinstance(exc, OSError) is the whole IO rule now). SHAPE CHOSEN -- declaration-at-the-definition-site, NOT a frozen name list inside the classifier: a name list would be a SECOND authority for a hierarchy harness-is cannot import (harness-runtime imports harness-is, never the reverse), the mirror-copy drift class this workspace already treats as a defect in its own right; in-repo precedent is memory_tool_executor.py:170-172, which ALREADY keys memory.policy.decision on isinstance(exc, MemoryToolExecutionDeniedError) -- failure_class on the very next line was the only substring-keyed attribute on that span. POPULATIONS (old -> new): (a) MemoryToolExecutionDeniedError, all 14 raise sites: policy_denial-or-io_failure-by-wording -> policy_denial always; FOUR sites actually changed, not the two this row named -- memory promotion review is forbidden, memory ref X is superseded, memory ref X is not retrievable, memory tool scope_ref does not match context (named by message, not by line offset, which this arc own edits shift). (b) MemoryToolExecutionInputError, all 10 sites: io_failure (and policy_denial for the policy_ref-named argument message) -> provider_adapter_failure, the least-wrong existing value. (c) MemoryToolExecutionError base (:293): io_failure -> provider_adapter_failure -- its one raise site re-raises a capture result whose failure_reason is an arbitrary string and may carry no exception at all, so the type determines nothing and declares the residual; a future subclass that declares nothing inherits the residual, never a confidently wrong class. (d) undeclared harness types whose NAME contains io but whose failure is not IO -- MemoryOperationIdempotencyConflictError / ProjectionMismatch / RedactionEventMismatch (reachable at memory_redaction.py:260) and pydantic ValidationError (validat-io-n): io_failure -> provider_adapter_failure. (e) MemoryPathViolationError: path_violation -> path_violation, now by construction. (f) MemoryCallbackIOError non-policy sites (not-found / out-of-range / content_b64 decode): io_failure -> io_failure, PRESERVED by declaring IO_FAILURE on the type -- without the declaration these eight sites would have regressed to the residual once the substring rule died, and the type IS the C-RT-15 RT-FAIL-MEMORY-CALLBACK-IO storage-backend I/O failure. (g) native-adapter POLICY denials -- _require_native_access, _require_capture_allowed, and both _require_retrieval_allowed branches (redaction-state + resolver DENY): policy_denial by wording -> policy_denial by construction, via a MODULE-PRIVATE _NativeMemoryPolicyDeniedError(MemoryCallbackIOError) -- the C-MEM-15 callback surface offers exactly one failure carrier, so a denial must be raised as a MemoryCallbackIOError; isinstance, every except, every pytest.raises and the transient RT-FAIL-MEMORY-CALLBACK-IO mapping are unchanged, so it is a telemetry discriminator and NOT an addition to the section 14.12.1 typed-exception surface. (h) everything else undeclared (MemoryStoreRecordUnavailableError, raw OSError, stdlib): unchanged. INPUT-CLASS RATIONALE, recorded for the spec half to overturn: (i) the fault originates in a provider/model-emitted tool call arriving through the adapter, not in the memory substrate own IO or record codecs; (ii) retry_breaker_fallback._classify_provider_exception already groups MemoryToolExecutionInputError with LLMDispatchPayloadShapeError, the provider-payload-shape family, so both layers read the failure the same way; (iii) it RESTORES the value this population emitted before B-84 typed _allowed_kinds, reverting rather than entrenching B-84 incidental provider_adapter_failure -> io_failure shift; (iv) serialization_failure is reserved for record-codec faults and would poison that bucket for triage. The declaration is written explicitly on MemoryToolExecutionInputError (not inherited) so it is the single flip site when the vocabulary gains an input class. RESIDUAL STATED HONESTLY: undeclared types are still keyed by message wording, which remains wording-luck for e.g. MemoryStoreRecordUnavailableError -- left alone, since those types have no vocabulary-determined class. ADJACENT, UNTOUCHED: memory_capture.py:545 hardcodes IO_FAILURE for the SAME write_record + append_memory_operation pair that memory_redaction.py:260 routes THROUGH the classifier -- two structurally identical except blocks with different contracts, pre-existing and orthogonal. WITNESSES: harness-runtime/tests/test_memory_failure_classification.py (THE population table, 37 parametrized rows over real instances carrying their actual raise-site messages, plus an agreement pin between memory.policy.decision and failure_class on the four previously-disagreeing denials, plus a pin that the private discriminator is still a MemoryCallbackIOError); harness-is/tests/test_memory_observability.py (the declaration mechanism -- wins over conflicting wording, inherited, overridable, non-member declaration IGNORED -- and the residual rules); harness-runtime/tests/test_lifecycle_retry_breaker_fallback.py::test_memory_tool_input_error_fail_fast_trip_carries_no_breaker_cause (the lens-3 half). MUTATION PROBES, all three fail post-fix and were restored: (a) restoring or io in exc_name -> 2 rows fail; (b) removing the DeniedError declaration -> 11 failures; (c) hardcoding BreakerCause.AUTH_FAILURE at the fail-fast record_failure -> 1 failure, the NEW test only, confirming this row own claim that the B-84 witnesses survive it. LENS-3 HALF CLOSED at the same arc: fail_threshold=1 so the single fail-fast failure trips a real breaker, a spying registry captures the emitted BreakerTransition, and the test asserts transition.cause is None AFTER asserting the transition exists (positive control, never vacuous). ROUND 2 (out-of-family Codex [P2] on this arc, same day): round 1 unconditional base declaration INTRODUCED a regression for one population -- a real durable-write failure. _write_note re-raises a MemoryCaptureResult whose status is FAILED, and that status is produced at exactly ONE place, EpisodicMemoryCapture._capture except around write_record + append_memory_operation (memory_capture.py:541-552), which classifies its OWN span io_failure; the base residual therefore reported a disk-full store write as provider_adapter_failure. GROUNDING: MemoryCaptureResult carries failure_reason as a formatted STRING only (f-string of type name plus exception) -- the original exception is NOT retained, so there is nothing structured to propagate and no honest way to sub-classify without message guessing; and MemoryCaptureStatus is a CLOSED two-value enum (CAPTURED | FAILED). FIX: a new module-level MemoryToolExecutionStoreError(MemoryToolExecutionError) declaring IO_FAILURE, raised when status is FAILED -- discriminated on the capture API own closed status enum, never on wording. It ADOPTS the capture layer classification rather than inventing a third answer. The base keeps the residual and its ONLY remaining raise site is _write_note defensive memory_id-is-None branch, unreachable through the real capture API (a CAPTURED result always sets memory_id). BASE RAISE-SITE SWEEP (mirroring the B-84 R1 sweep): raise MemoryToolExecutionError( occurs at exactly one site repo-wide, so the mislabel class was confined to it; store exceptions do not otherwise reach the base -- _read_record_by_ref wraps them into the denied class, and an un-wrapped store exception propagates raw through execute blanket except and hits the residual isinstance(exc, OSError) -> io_failure, already correct. NOTE ON THE PER-INSTANCE OPTION: genuinely foreclosed -- the codex R1 [P2] fix made _declared_failure_class read getattr(type(exc), ...) rather than the instance, so an instance-level assignment cannot shadow the hierarchy. Independently, there is no per-instance value to carry: MemoryCaptureResult exposes no enum. A frozen subtype is therefore both the only available and the type-honest shape. ROUND-2 WITNESS: test_memory_tool_executor.py::test_write_note_store_failure_emits_io_failure_class -- end-to-end through the real executor with store.write_record raising OSError(disk full), asserting memory.failure_class == io_failure on the outer memory.tool_call span. Grounded there: _write_note does NOT thread the executor tracer into EpisodicMemoryCapture, so on this path the outer span is the ONLY telemetry record of the failure. ROUND-2 PROBES: (d) restoring the regression (store failure raises the base again) fails the end-to-end witness; (e) removing the subtype IO_FAILURE declaration so it inherits the base residual -> 4 failures, the span assertion plus the 3 store-subtype table rows. ADJACENT ITEM UPDATED: the memory_capture.py:545 coarseness (ANY exception from the durable-write pair labelled io_failure) is now inherited by one more span; it cannot be refined at the executor, which receives only the reason string. ROUND 3 (merge-gate test-witness lens BLOCK, closed same day): the lens found the three OTHER _NativeMemoryPolicyDeniedError raise sites unwitnessed -- their covering tests asserted only pytest.raises(MemoryCallbackIOError, ...), which the subtype satisfies IDENTICALLY, so reverting any one of them to the base type left the suite green while re-emitting io_failure on a genuine policy denial (the exact defect this arc closes); only _require_native_access was span-pinned. All three are now span-pinned at test_native_memory_adapter.py -- _require_capture_allowed, _require_retrieval_allowed resolver-DENY branch, and its redaction-state branch (which had NO test at all) -- via a _failure_span_attributes helper that selects the failure span by memory.policy.decision == failed and unpacks a single-element list, so two-or-zero failure spans fails rather than silently asserting the wrong span. PROBE (f): reverting each site individually fails exactly ONE test, its own, with AssertionError: assert io_failure == policy_denial. ROUND-3 ADJACENT ITEMS, all landed: (1) the THIRD classify_memory_failure consumer (memory_redaction.py:260) is now span-pinned by a two-row parametrized witness with DIFFERENT expected classes -- OSError -> io_failure and MemoryOperationIdempotencyConflictError -> provider_adapter_failure -- so the assertion pins the classification, not a constant; PROBE (g): hardcoding failure_class=io_failure at that emission site fails the non-IO row only (assert io_failure == provider_adapter_failure) while the IO row still passes, the correct discriminating shape. (2) WORDING-CONFLICTING rows added for three declarations that were deletable-green -- the base (message denied by policy, residual would say policy_denial), MemoryPathViolationError (a message with no path in it, residual would say provider_adapter_failure), and MemoryToolExecutionStoreError (a store LookupError reason reading is unavailable, residual would say policy_denial) -- so deleting any of the three now fails a row instead of passing. (3) Count corrections: DeniedError has 14 raise sites, not 12 (both files); the table row count is 37 parametrized rows (the YAML said 32, the prose 34 -- mirror drift, both now correct). (4) An inaccurate comment at test_memory_observability.py claiming the declaration beat a message that trips an earlier heuristic was fixed by making the message genuinely trip rule 2 (path traversal), so the row is a real conflict rather than a residual-agreement.'
  close_out: 'IMPL HALF LANDED 2026-07-28; the SPEC half keeps this row registered_finding. (1) TYPE-KEYED CLASSIFICATION -- LANDED, per the summary populations table. (3) WITNESSES + MUTATION PROBES -- LANDED, including the lens-3 breaker-cause pin. (2) DECIDE THE INPUT-VALIDATION CLASS -- REMAINS OPEN and spec-side: the impl half took the least-wrong existing value (provider_adapter_failure) with its rationale recorded in the summary; adding a member to the closed C-MEM-19 vocabulary is a Class 1 back-flow to Spec_Memory_Substrate_v1.md C-MEM-19, NOT absorbable at Phase 7 per X-AL-3, and when it lands the single flip site is MemoryToolExecutionInputError.memory_failure_class. ORIGINAL CLOSE-OUT TEXT FOLLOWS. Deliberately NOT fixed inside the B-84 arc: changing the classifier changes emitted telemetry for every memory failure path (a blast-radius decision of its own), and the vocabulary half is spec-side. (1) TYPE-KEYED CLASSIFICATION -- dispatch on exception TYPE (an isinstance ladder, or a registry keyed on the typed families) instead of message/type-name substrings, so MemoryToolExecutionDeniedError maps to policy_denial BY CONSTRUCTION rather than by wording, and narrow the IO rule to isinstance(exc, OSError), dropping the "io" in exc_name clause entirely -- it cannot be made safe, since any type name containing execution / region / revision collides. (2) DECIDE THE INPUT-VALIDATION CLASS -- either map input errors onto an existing value with a stated rationale (impl-side), or amend the C-MEM-19 vocabulary to add one, which is SPEC-SIDE: a Class 1 back-flow to `Spec_Memory_Substrate_v1.md` C-MEM-19, NOT absorbable at Phase 7 per X-AL-3. (3) Witness with a table-driven test over one real instance per typed family asserting the emitted memory.failure_class, plus an assertion pinning the breaker cause on the fail-fast exit (the lens-3 gap above); mutation-probe by restoring the substring rule. Cross-ref B-84 (the arc that surfaced this and shifted one class). 2026-07-29 dormancy re-check: premise intact at HEAD dd2a8c1a -- the type-keyed classifier (`_declared_failure_class` wins outright, name-substring IO rule deleted) and the six-member `MemoryTelemetryFailureClass` vocabulary (`harness-is/src/harness_is/memory_observability.py:33-41`) are both unchanged, and the U-MEM-26 contract-table rows extend B-88''s own idiom rather than diverging from it (the scope-value-domain exceptions declare `memory_failure_class` at their definition sites, `memory_capture.py:215` and `:236`), so step (2) -- the input-validation class, a Class 1 C-MEM-19 vocabulary amendment -- remains the sole open half.'
  council: 'Likely, for step (2) only. Adding a member to a closed C-MEM-19 enum is a spec amendment with an observability-vocabulary blast radius (every consumer switching on the value) -- C7/C8 (observability) paired with whoever owns the memory-substrate contract. Step (1) is mechanical once (2) is settled, and step (3) follows from both.'
  heading: '### B-88 · Memory failure telemetry: substring-keyed `classify_memory_failure` collapses the typed input-error family — and two real policy denials — to `io_failure` *(surfaced by the merge-gate lens-2 sweep on the B-84 arc, 2026-07-28)*'
- id: B-89
  title: 'Memory-scope producer asymmetry: capture stamps raw provider KEYS while retrieval requests carry family VALUES'
  status: closed
  pr: '#1148'
  summary: 'Surfaced by the B-86 grounding pass (2026-07-28). MECHANISM: `harness-runtime/src/harness_runtime/memory_capture.py:585-591` constructs its OWN `MemoryScope` with `provider_family=provider` -- the raw per-turn dispatched provider KEY (vocabulary `claude_code`/`codex`/`gemini`/`antigravity`/`ollama`/`anthropic`/`openai`/`google`, `harness-runtime/src/harness_runtime/lifecycle/cross_family_cost_tag.py:60-69`) -- while retrieval requests carry the composed `record_scope`''s `ProviderFamily` VALUE (`harness-runtime/src/harness_runtime/automatic_memory.py:197`). All three enforcement sites compare raw strings with NO normalization (`harness-is/src/harness_is/memory_retrieval.py:371-384`, `memory_retrieval_index.py:379-396`, `memory_policy.py:336-359`). EMPIRICALLY CONFIRMED AT REGISTRATION: an `ollama`-written note is invisible even to a `local_open_weight`-scoped request OF ITS OWN FAMILY, and tool-written notes are write-only for 5 of the 8 registered provider keys (only `anthropic`/`openai`/`google` coincide with a family value, and by accident). CONSEQUENCE: memory continuity under primary-derived keying is largely NOTIONAL today -- the continuity side of B-86''s Q1 tension only becomes real after this row lands. EXISTENCE IS INDEPENDENT OF B-86 Q1: both Q1 readings leave the ollama note invisible, because Q1 asks primary-or-candidate while this row asks key-or-value -- orthogonal axes. DIRECTION, HOWEVER, IS DETERMINED BY THE B-86 COUNCIL RECORD (fork doc section 5-Q1): the WRITER adopts the reader''s key -- the capture path stops constructing an independent `MemoryScope` and consumes the run''s composed `record_scope` (one-source-of-truth; will incidentally close B-90 when it lands). INTRINSIC EVIDENCE FOR THE FAMILY READING: the field is literally named `provider_family` (`harness-is/src/harness_is/memory_record_envelope.py:120`) while C-MEM-03 declared no value domain AT REGISTRATION TIME -- evidence for the fork to weigh, NOT an impl licence. C-MEM-03 now DECLARES the value domain at v1.1, so this row builds against a stated contract rather than an inference. HASH-INERT: `MemoryScope` is not folded into `memory_id` (content-hash + run_id only, `memory_capture.py:574-575`), so a writer normalization moves no identities and the blast radius is low.'
  close_out: 'CLOSED 2026-07-28 at the U-MEM-26 impl leg (this PR). `EpisodicMemoryCapture` gained a `record_scope` parameter and writes records under the run''s composed scope VERBATIM instead of constructing its own from the per-turn provider key; BOTH construction sites pass the composed scope. The `provider` argument is unchanged and still feeds the C-MEM-08 payload and the C-MEM-19 span as the raw key it is -- only the RECORD scope stops deriving from it. The residual self-construction remains for callers with no composed scope and is bound by the C-MEM-03 value domain instead. The ollama divergence is the discriminating witness throughout (its provider KEY is not value-equal to its `ProviderFamily`, so a test passing under `anthropic` or `openai` proves nothing), and round-trip retrievability is witnessed directly: `test_captured_scope_round_trips_where_the_pre_repair_scope_does_not` in `harness-runtime/tests/test_u_mem_26_write_boundary.py`, carrying an explicit precondition anchor because both sides of its comparison are derived from the writer and it would otherwise stay green against a writer that repaired nothing. Mutation-probed: ignoring the composed `record_scope` reddens all four capture witnesses. Forward-only migration residual stands as stated at C-MEM-03 -- pre-repair raw-key records are not rewritten and stay unreachable under family-scoped requests.'
  council: 'No -- the keying decision is the B-86 council record''s; once the spec-leg ratifies, the repair is mechanical (writer consumes the composed record_scope).'
  heading: '### B-89 · Memory-scope producer asymmetry: capture stamps raw provider KEYS while retrieval requests carry family VALUES *(surfaced by the B-86 grounding pass, 2026-07-28; CLOSED 2026-07-28 — U-MEM-26 impl leg)*'
- id: B-90
  title: 'Capture-path MemoryScope omits tenant and workload_class -- tool-captured records are tenant-unpartitioned'
  status: closed
  pr: '#1148'
  summary: 'Surfaced at the B-86 council convening (2026-07-28), as the adjacent half of Probe C. MECHANISM: `harness-runtime/src/harness_runtime/memory_capture.py:585-591` constructs its `MemoryScope` with only `project` / `workflow` / `provider_family` / `cli_profile` / `visibility` -- `tenant` and `workload_class` are omitted ENTIRELY -- while the composed REQUEST scope populates them (`harness-runtime/src/harness_runtime/automatic_memory.py:194-199`). Under the enforcement predicates'' wildcard-on-`None` semantics a `None` RECORD value passes all three sites: `MemoryRetriever._scope_mismatch` skips a `None` on either side (`harness-is/src/harness_is/memory_retrieval.py:377-383`); the index `_scope_matches` carries the same field list (`memory_retrieval_index.py:379-396`); and `memory_policy._scope_not_broader` guards only NON-`None` record values (`if record_value is not None and requested_value != record_value`, `memory_policy.py:336-359`), so a `None` record tenant passes. NET: every tool-captured / episodic record is tenant-UNPARTITIONED and reachable by ANY tenant''s family-matching request -- against the cleared threat-model mandate at `design-substrate/Spec_Memory_Substrate_v1.md:481` (''Retrieval and injection enforce project, workflow, tenant, provider-family, CLI-profile, and visibility scope before ranking''). HONEST CAVEATS: single-tenant local deployment is the current default posture, so live exposure is bounded today; and the wildcard-on-`None` semantics were, AT REGISTRATION TIME, load-bearing but undocumented -- they are DOCUMENTED as of Spec_Memory_Substrate v1.1 (C-MEM-03: a stored `null` is the unpartitioned wildcard; a `null` REQUEST does not widen access past a family-scoped record).'
  close_out: 'CLOSED 2026-07-28 at the U-MEM-26 impl leg (this PR), incidentally by the B-89 writer repair exactly as route (1) predicted: the run''s composed `record_scope` carries `tenant` and `workload_class`, so tool-captured records are no longer tenant-unpartitioned. Witnessed per this row''s own step (3) by THREE SEPARATE per-predicate tenant-denial assertions in `harness-is/tests/test_memory_scope_value_domain.py` -- `test_b90_tenant_denial_at_the_retriever_predicate` (`MemoryRetriever._scope_mismatch`), `test_b90_tenant_denial_at_the_index_predicate` (`_scope_matches`), and `test_b90_tenant_denial_at_the_policy_predicate` (`_scope_not_broader`) -- never one composite retrieval test, which is precisely how the omission survived; a fourth witness (`test_b90_null_tenant_request_is_denied_at_every_predicate`) pins the wildcard-on-`None` arm. Each is mutation-probed. The cleared threat-model mandate at `design-substrate/Spec_Memory_Substrate_v1.md:481` is now conformant for the capture path.'
  council: 'No -- conformance repair to a cleared threat-model invariant (:481); no cross-domain tension. Fold into the B-89 writer repair at the B-86 spec-leg''s impl leg.'
  heading: '### B-90 · Capture-path `MemoryScope` omits `tenant` and `workload_class` — tool-captured records are tenant-unpartitioned *(surfaced at the B-86 council convening, 2026-07-28; CLOSED 2026-07-28 — U-MEM-26 impl leg)*'
- id: B-91
  title: 'Report-only degraded-serve failure_class/policy.decision semantics for scope-mismatch and not_derived reasons'
  status: closed
  pr: '#1154'
  summary: 'Surfaced by the merge-gate spec-conformance lens on the C-MEM-19 emitter-attrs arc (PR #1151, 2026-07-29). The B-83 degraded-serve emitter''s REPORT-ONLY branch (`degraded.rendered is None`, `harness-runtime/src/harness_runtime/lifecycle/llm_dispatch.py`) fires on THREE reason families, not one: (1) the scope-mismatch conjuncts (`provider_scope_mismatch` / `provider_family_scope_mismatch`); (2) genuine `MemoryAccessModeDenialReason` values carried verbatim from `prompt_packet_fallback_denial` (`no_supported_mode` / `token_budget_empty`, `harness-runtime/src/harness_runtime/memory_context.py:134-138`); and (3) the `not_derived` / `prompt_packet_denial_undetermined` sentinels (`memory_context.py:48-52`). Family (2) was CLOSED at this PR -- it now carries `failure_class=POLICY_DENIAL`, mirroring the primary DENIAL span which sets exactly that for exactly those values (`memory_context.py:210-216`) off a real `select_memory_access_mode` run (`memory_context.py:545-549`). TWO QUESTIONS REMAIN OPEN, both bounded telemetry-semantics decisions. Q1 -- should family (1) carry `POLICY_DENIAL` too? Post-B-86 the cross-family withhold is policy-MANDATED, not a mere absence of decision: `design-substrate/Spec_Memory_Substrate_v1.md:511` records it on the C-MEM-19 surface "with the denial reason carried as an attribute value", `:523` states it as a C-MEM-13 invariant, and `:559` qualifies C-MEM-14 exposure by it. So the pre-existing rationale ("no resolver made a policy decision on this branch") is over-stated. What is genuinely undecided is whether a CONTRACT-mandated withhold is the same telemetry CLASS as a RESOLVER''s denial. Q2 -- does `not_derived` belong on `memory.policy.decision` at all? It is a fail-safe NON-decision, and it is defined to be distinct from every `MemoryAccessModeDenialReason` value (`memory_context.py:48-52`), yet it lands on the same attribute that otherwise names a gate a resolver closed; a different axis (or a dedicated sentinel-aware attribute) may be the truthful home. NO CONTRACT DEFECT EITHER WAY: C-MEM-19 requires `memory.policy.decision` on every memory span and does not enumerate which spans owe a `failure_class`, so both current answers are conformant -- this row is about telemetry TRUTHFULNESS, not conformance. CONSERVATIVE POSTURE HELD AT THIS PR: families (1) and (3) leave `failure_class` UNSET and are pinned as absent by witnesses, because adding the attribute later is additive while retracting a wrong one is not.'
  close_out: 'CLOSED 2026-07-29 (this PR). BOTH questions decided on one grounded pass against the byte-read spec. Q1 -- YES, the scope-mismatch family DOES carry `failure_class=POLICY_DENIAL`. The deciding text is the C-MEM-13 recording-surface paragraph at `design-substrate/Spec_Memory_Substrate_v1.md:511`: the withholding is recorded on the C-MEM-19 surface "whose declared coverage already includes standard memory tool calls and policy denial". That sentence justifies needing no NEW coverage item by pointing at the EXISTING list at `:674-683`, and of its two candidate items a withheld exposure is definitionally not a tool CALL (the schemas never reach the model), so "Policy denial" (`:683`) is the item being invoked. `memory.failure_class` is the only required attribute (`:687-698`) whose value domain carries that classification, and the failure-class invariant at `:703` uses the identical phrase -- so reading the coverage item and the vocabulary as unrelated would leave the coverage item with no carrier at all. The vocabulary is scoped by OUTCOME KIND (policy denial / path violation / IO failure / serialization failure / provider adapter failure / retrieval empty-result), never by WHICH component decided, which settles the genuinely-open part of the question: a CONTRACT-mandated withhold and a RESOLVER''s denial are one telemetry class. Corroborating: the withhold is a MUST NOT at `:509`, a C-MEM-13 invariant at `:523`, a C-MEM-14 exposure qualification at `:559`, and `no_memory_access` -- what both branches report -- is itself named "a valid policy outcome" at `:522`. Q1 SCOPE REFINED the same day by out-of-family Codex R1, two [P2]s both upheld -- the first application set the class on BOTH scope conjuncts unconditionally, which over-claimed on two counts, and the arc own truthfulness principle (never report a determination that was not made) is what condemns it. [P2-1] the IDENTITY conjunct must not carry the class merely because it FIRED: it fires whenever the provider KEY moved, including an `openai`-composed context rebound to `codex` -- one family, two keys -- where C-MEM-13, which withholds only across FAMILIES, mandates nothing whatsoever. R1 corrected this to an unconditional False on that branch, which out-of-family Codex R2 (same day) then found to UNDER-report by the mirror amount: an `anthropic`-composed context rebound to `openai` resolves BOTH families and finds them UNEQUAL -- a CONFIRMED cross-family withhold -- yet the identity return exits before the relation is consulted, so the span omitted the class purely because of TEST ORDER. CONVERGED RULE (R2, applied): `policy_denial` is a function of the family RELATION alone and never of which conjunct fired -- `policy_denial` iff CONFIRMED_MISMATCH, on BOTH scope conjuncts. `_packet_scope_family_relation` is now resolved ONCE, before the identity test; it reads only `record_scope` + `provider_name`, neither touched by the identity test, so evaluating it earlier carries no ordering hazard and costs two dict lookups on an already-degraded path. A SAME-family rebind and an UNVERIFIABLE rebind both stay unclassified, the withholding is unchanged on every branch, and `memory.policy.decision` still names the gate verbatim. [P2-2] the FAMILY conjunct carries the class ONLY on a CONFIRMED mismatch: `_packet_scope_matches_dispatch_family` returned False for an absent `record_scope`, an out-of-domain scope family, or an unregistered provider key -- states where the relationship is UNKNOWN, not known-unequal -- so the unconditional flag reported fail-closed VALIDATION as an operator policy decision. The Q1 reading above is unchanged and still governs the case it actually addressed: a CONFIRMED cross-family withhold, both families resolved and unequal. DISCRIMINATION MECHANISM: `_packet_scope_family_relation` (new) returns a tri-state `_ScopeFamilyRelation` -- MATCH / CONFIRMED_MISMATCH / UNVERIFIABLE -- over the SAME existing `provider_family_for_scope_check` + `canonical_scope_family` authorities, no second policy path; `_packet_scope_matches_dispatch_family` is now a pure projection of it (`is MATCH`), so both WITHHOLDING callers behave identically to before and only the telemetry class changed. Q2 -- KEEP AS IS: the `not_derived` / `prompt_packet_denial_undetermined` sentinels stay on `memory.policy.decision` verbatim, NO code change. `memory.policy.decision` is a REQUIRED attribute on every memory span (`:694`), so omitting it on the one branch where no gate closed would drop a required attribute exactly where a reader most needs to know the decision axis was empty; and mapping to the primary span''s generic `denied` fallback would assert a denial nobody issued -- the same false accusation the per-reason [P2-e] split exists to prevent. Verbatim is truthful on both halves of the B-87/B-91 principle: the sentinel names NO gate (it is defined distinct from every `MemoryAccessModeDenialReason`, `memory_context.py:48-52`, so it can never be misread as one), while the span still reports `denial` / `no_memory_access` / `record_count=0`, so the degradation is never hidden. WITNESSES STAY DISCRIMINATING per close-out step (3): the split is policy-DETERMINED (selector-denial + CONFIRMED cross-family, under EITHER scope conjunct) vs nobody-determined (same-family identity rebind + UNVERIFIABLE family states + sentinels), and all cells are pinned -- `test_u_mem_26_cross_family_ollama_dispatch_withholds_tools_and_packet` (scope family `openai`, dispatch `ollama` to `local_open_weight`, both resolve and are unequal) asserts `failure_class` PRESENT; `test_b83_provider_rebound_context_is_reported_but_never_served` (`anthropic`-composed rebound to `openai` -- CROSS-family, both sides resolve and differ) asserts it PRESENT on the IDENTITY guard, while `test_b91_same_family_provider_rebind_is_not_a_policy_denial` (`codex`-composed rebound to `openai`, ONE family) asserts it ABSENT on that same guard -- the R2 pair that pins the class to the relation rather than to the branch; `test_b83_absent_record_scope_fails_closed_to_report_only` and `test_b86_unregistered_provider_key_fails_closed_against_local_scope` assert it ABSENT on the two UNVERIFIABLE shapes; `test_b83_undervied_eligibility_reports_not_derived_not_a_gate_denial` asserts it ABSENT on the sentinel and additionally pins the Q2 verbatim value. MUTATION PROBES, ALL KILLING (two re-run at the R2 convergence, on top of three at the R1 refinement and four at the first application): reverting the family construction to an unconditional True reddens BOTH UNVERIFIABLE witnesses; dropping the CONFIRMED_MISMATCH True reddens the U-MEM-26 cross-family witness; R2 (a) forcing the identity construction back to a relation-blind False reddens the cross-family rebound witness (KeyError on `memory.failure_class`); R2 (b) forcing it unconditionally True reddens the same-family rebind witness. NO CONTRACT DEFECT AND NO SPEC AMENDMENT -- this was a telemetry-truthfulness reading of already-cleared text, decided within the C-MEM-19 CLOSED enum (attribute VALUES only, no new members).'
  council: 'No -- a bounded telemetry-semantics decision inside an already-cleared contract, with no cross-domain tension to surface. It does require a careful spec READING (C-MEM-13 `:511`/`:523` + C-MEM-14 `:559` against C-MEM-19), so it is not mechanical, but a single grounded pass settles both questions together.'
  heading: '### B-91 · Report-only degraded-serve `failure_class` / `policy.decision` semantics for the scope-mismatch and `not_derived` reason families *(surfaced by the merge-gate spec-conformance lens on the C-MEM-19 emitter-attrs arc, 2026-07-29; CLOSED 2026-07-29 — Q1 policy_denial applied (R2-converged: class follows the family relation, not the conjunct), Q2 keep-as-is)*'
- id: B-92
  filing: .harness/class_1_fork_c_mem_10_cross_family_promotion_eligibility.md
  title: 'C-MEM-10 promotion eligibility of records captured during a cross-family fallback leg'
  status: closed
  pr: '#1159'
  summary: 'The spec''s OWN named-but-undischarged open question, now filed as a Class 1 fork (`.harness/class_1_fork_c_mem_10_cross_family_promotion_eligibility.md`). Since U-MEM-26 (PR #1148) capture writes under the run''s COMPOSED scope, so a cross-family fallback leg lands an `anthropic`-family record while the dispatch that produced its content ran on `openai` -- witnessed by a shipped test, `test_u_mem_26_capture_is_unaffected_by_the_cross_family_withholding` (`harness-runtime/tests/test_automatic_memory_runtime.py:515`, assert at `:579`). Whether such a record may be PROMOTED, and thereafter injected back into future runs under the primary''s family, is the C-MEM-10 question the spec change-note paragraph "Named open question carried forward, not discharged." (`Spec_Memory_Substrate_v1.md`, change-note v1 -> v1.1) explicitly carries forward -- "v1.1 neither resolves nor forecloses it" -- and that `Implementation_Plan_Memory_Substrate_v1.md` lists out-of-scope for U-MEM-26 with the same carry, at U-MEM-26''s "Out of scope for this unit:" subsection. CITE CONVENTION (Codex R3 [P2-2]): this row cites `Spec_Memory_Substrate_v1.md` by contract ID + section name + byte-verified quoted fragment, never by line, per that spec''s own v1.1 instruction ("Surfaced finding, not patched.": "Cite this spec by contract ID and section name, not by line, in any text authored after v1.1."); code cites keep file:line and were verified at HEAD `6ab41d7f`, against which no code file differs from the `dd2a8c1a` grounding HEAD. CURRENT BEHAVIOUR: SILENT AT BOTH ENTRY POINTS, BUT ZERO LIVE AUTO-PROMOTION EXPOSURE AT HEAD -- the exposure claims of the first draft were corrected by out-of-family Codex R1 (2026-07-29, one [P1] and one [P2], both upheld on direct re-read of the code). (1) The hint path -- the candidate-side family is PRODUCER-DEFINED, hence UNDEFINED today: `_candidate_from_hint` (`harness-runtime/src/harness_runtime/memory_promotion.py:296`) builds risk flags from the HINT with `source_scope=record.envelope.scope` (`:626-629`), but the CANDIDATE side that `_family_escapes_source` (`:715-743`) compares is `hint.suggested_scope` (`:682`) -- a REQUIRED caller-supplied field (`:191`) with no default and no derivation from the record, so nothing in the pipeline makes it the family of the source record. A producer mirroring the composed run scope supplies anthropic (no flag); a producer supplying the DISPATCHED family already trips `CROSS_SCOPE` (`:683`). WHICH convention a producer must supply is itself part of what C-MEM-10 owes, and it cannot be read off code that has no producer. `_auto_promote_allowed` (`:776-790`) carries no family term and no risk-flag term. The path is also UNFED: the sole production caller passes `promotion_candidates=()` (`automatic_memory.py:273`), and the extractor is otherwise reached only from compaction safety (`memory_compaction_safety.py:159`). (2) The model-facing tool path -- NOT a live auto-promotion exposure, for two INDEPENDENT reasons. `MemoryToolExecutor._propose_promotion` (`memory_tool_executor.py:399-435`) serves the C-MEM-14 `memory.propose_promotion` tool, hardcodes `confidence=HIGH` (`:423`), and computes `risk_flags=_promotion_risk_flags(source)` (`:425`) which inspects ONLY `redaction_state` (`:882-885`) -- that no-scope-comparison point STANDS. What does NOT stand is reachability for a CAPTURED record. (a) The record KIND is denied before a candidate is ever constructed: `_read_retrievable_record_by_ref` (`:554-567`) routes the source through `resolve_retrieval`, and `_record_kind_allowed` (`harness-is/src/harness_is/memory_policy.py:327-333`) denies any kind outside `eligible_record_kinds` (`:300-304`); the SOLE production policy `_policy_from_config` (`automatic_memory.py:532-557`) -- the only ENABLED `MemoryPolicyDocument` constructed anywhere under `src/`, the other being `DEFAULT_DISABLED_MEMORY_POLICY` (`memory_policy.py:105`, `enabled=False`) -- pins that set to `_retrievable_kinds()` (`:560-569`), the seven promoted/derived kinds, EXCLUDING every kind the capture path writes (`EPISODIC_RUN` / `EPISODIC_TURN` / `TOOL_EVENT` / `COMPACTION_EVENT`, `memory_tool_executor.py:769-775`), which covers both the witness EPISODIC_TURN record and the TOOL_EVENT output of `memory.write_note` itself (`capture_tool_event`, `memory_capture.py:471-473`); the call raises `MemoryToolExecutionDeniedError` (`:565-566`) BEFORE candidate construction at `:417`. (b) An eligible record could not auto-promote either: `_policy_from_config:542` pins `promotion_decision=PROPOSE_SEMANTIC` while `_promotion_auto_allowed` (`:897-903`) returns True only for `PROMOTE_SEMANTIC`/`PROMOTE_PROCEDURAL`, so `auto_promote_allowed` is False for EVERY candidate on this path and `_propose_promotion` takes the `propose_for_review` branch (`:456`) with review_required True -- a branch that is DURABLE BUT INACTIVE, not ephemeral (the R2 correction of the first draft''s "review, not durability"): `propose_for_review` (`memory_promotion.py:328-352`) calls `_persist_decision` with `status=PROPOSED` and `_persist_decision` (`:451-506`) writes BOTH the semantic/procedural record (`write_record`, `:498`) AND a durable C-MEM-08 operation entry (`append_memory_operation`, `:499-506`); what review withholds is ACTIVATION, not persistence, since a PROPOSED record is excluded from retrieval by construction (`_INACTIVE_STATUS_REASONS["proposed"]` -> `RetrievalExclusionReason.PROPOSED`, `harness-is/src/harness_is/memory_retrieval.py:65`/`:71-77`) and only `approve`/`edit_and_approve` (`:354-390`/`:416-449`) flip it to ACTIVE, neither consulting any family term. WHAT THE QUESTION ACTUALLY IS, stated exactly: not that a live tool auto-promotes cross-family-captured content today, but (i) FUTURE RETRIEVABLE-KIND RECORDS -- `eligible_record_kinds` is a C-MEM-09 POLICY field, not a constant, and a SECOND-ORDER case needs no policy change at all, since a semantic/procedural record ALREADY promoted out of a cross-family leg is an eligible kind by construction and carries the same unrecorded provenance forward; (ii) FUTURE POLICY CONFIGS setting `PROMOTE_SEMANTIC`/`PROMOTE_PROCEDURAL` with `ReviewMode.AUTOMATIC`, which C-MEM-09 explicitly permits; (iii) the FIRST CALLER to populate `promotion_candidates`. NONE OF THE THREE IS INDIVIDUALLY SUFFICIENT, AND THIS ROW STATES THE COMBINATIONS rather than letting "a single policy field" imply otherwise (Codex R6 [P2-2], upheld by direct read at `1c99e208`; the earlier framing was true of candidate-REACHABILITY, not of active PROMOTION). The gate functions are conjunctions and one conjunct is ALREADY SATISFIED IN PRODUCTION. (a) Admitting a capture-written kind into `eligible_record_kinds` alone buys CANDIDATE-REACHABILITY ONLY -- `_policy_from_config` still pins `PROPOSE_SEMANTIC` (`automatic_memory.py:542`), so `_promotion_auto_allowed` (`memory_tool_executor.py:897-903`) is False and the record lands as a durable, retrieval-excluded PROPOSED. (b) Switching the decision to `PROMOTE_SEMANTIC`/`PROMOTE_PROCEDURAL` alone buys ACTIVE AUTO-PROMOTION OF ALREADY-ELIGIBLE KINDS ONLY -- exactly the second-order case -- since capture-written kinds are still denied before a candidate exists. (c) `ReviewMode.AUTOMATIC` buys NOTHING: IT IS ALREADY SET (`automatic_memory.py:555`), so only the decision conjunct of `_promotion_auto_allowed` is unmet at HEAD; the other two modes are live foreclosures a deployment could re-assert (`OPERATOR_REQUIRED` forces review at `:889-890`, `FORBIDDEN` denies the tool at `:406-407`). So on the TOOL PATH live auto-promotion of a CAPTURED record requires (a) AND (b), both hard-coded side by side at `_policy_from_config` (`:542` and `:556`) and drawn from no `config.memory` field -- today a code change, though C-MEM-09 POLICY fields by contract, which is why the gap is real regardless. On the HINT PATH it requires (iii) AND (b) AND non-LOW hint confidence (`memory_promotion.py:786-787`; `PROMOTE_PROCEDURAL` specifically for a `PROCEDURAL_UPDATE` kind, `:788-790`) AND AN ACTUATOR THAT DOES NOT EXIST: the only `PromotionDecisionService.approve` call site anywhere under `src/` is the tool path''s (`memory_tool_executor.py:449`), `extract_from_records` is reached solely from `CompactionSafetyHook.extract_candidates` (`memory_compaction_safety.py:153-159`) whose sibling `complete_compaction` persists DISPOSITIONS and never promotes, and `CompactionSafetyHook` itself has no production caller at all (only its definition and its `harness_runtime/__init__.py` export), so `auto_promote_allowed=True` is computed, persisted and ACTUATED BY NOTHING. The CONTRACT gap is unconditioned by all of it: C-MEM-10 has no provenance term at any policy setting. The §1 witness stands regardless -- it pins the CAPTURE-side fact, which is what makes the C-MEM-10 question well-posed at all. PREREQUISITE FINDING (the load-bearing part), SCOPED BY CODEX R2 TO THE COMPOSED-SCOPE PATH, WHICH IS THE U-MEM-26 PRODUCTION PATH: on that path the promotion pipeline CANNOT DISCRIMINATE even if policy said to. `EpisodicMemoryCapture` takes `record_scope: MemoryScope | None = None` (`memory_capture.py:253`) and `_scope_for_record` (`:1048-1086`) branches on it. COMPOSED path (scope supplied): the envelope is the run''s composed scope (`:1074`) through canonicalize-or-deny (`:1083-1086`) and the per-dispatch `provider` NEVER reaches the envelope; this is production -- the automatic-memory runtime always supplies a composed scope keyed to `fallback_chain.primary.family.value` (`automatic_memory.py:211-221`, family at `:217`, threaded at `:504-512`/`:511`) -- and it is the path the §1 witness exercises. RESIDUAL path (no scope): `_scope_for_record` builds the scope itself with `provider_family=provider` (`:1075-1082`, field at `:1079`), so such a record DOES retain its producing family and the exhaustive claim does NOT hold for it -- but it retains that family by PARTITIONING the record under it, the very per-turn re-derivation B-89 named as a defect and B-90/U-MEM-26 repaired, which means the cross-family question DOES NOT ARISE there at all (a record written under the producing family is not a foreign-family record inside a primary''s partition), so there is nothing for C-MEM-10 to discriminate. FORCE UNDIMINISHED: the path where the question is well-posed is exactly the path that cannot answer it, and it is the production path. On the composed-scope path, `capture_turn_completion` writes `content` with NO provider and NO dispatched-model field (`:407-422`); `provider`/`model` reach only the C-MEM-08 ledger row payload (`:694-707`, `MemoryOperationPayload.provider` at `:1006`, `memory_refs=(memory_id,)` at `:1010`) and the C-MEM-19 span attributes (`:686-688`, `:714-716`) -- and promotion reads neither (`_hints_from_record` reads `record.content` alone, `:545-560`). So readings B and C are not merely unbuilt for composed-scope records (every record the production path writes), they are UNREPRESENTABLE, and surfacing the discriminator is itself contract-altitude work, X-AL-3-blocked at Phase 7. A second grounded correction: `risk_flags` GATES NOTHING today -- a repo-wide grep finds it only at its definition, its two construction sites and its persistence; `_review_required` (`:762-773`) never consults it and `_auto_promote_allowed` reads `review_required`, not flags -- so any flag-based reading must state the GATE as well as the flag or it lands inert. NET, CORRECTED: the permissiveness is STRUCTURAL, not yet exercised -- live auto-promotion exposure at HEAD is NIL on the composed-scope production path (the tool path is closed twice over, by record kind and by policy decision; the hint path is unfed and its candidate convention undefined). What is real NOW is the contract gap -- which NO SINGLE NAMED CHANGE CONVERTS INTO A LIVE EXPOSURE (Codex R6 [P2-2]; the combinations are (a) AND (b) on the tool path, with (c) `ReviewMode.AUTOMATIC` already satisfied in production, or the hint producer AND (b) AND an actuator that does not exist). What a single change DOES buy is the TRANSITION BELOW IT -- (a) makes captured records candidate-reachable and durably PROPOSED; (b) makes the second-order case actively auto-promoting -- and each such transition happens WITH NO FURTHER REVIEW, because no gate on any of these paths has a family term to consult. That is exactly why this is a Class 1 SPEC question and not a Phase 7 bug, and why the URGENCY is low while the NECESSITY is not: nothing is leaking today, the last step to leaking is a two-field policy change nothing forbids, and the contract has no position to fall back on when it happens.'
  close_out: 'CLOSED 2026-07-29 at the U-MEM-27 impl leg (PR #1159). All FIVE parts of the prior LIVE NEXT STEP are discharged; the deliberation record it carried is preserved verbatim in this row''s prose block and at the fork filing. (1) WRITE SIDE, ENVELOPE -- `MemoryRecordEnvelope.captured_cross_family` landed as a tri-state typed to the new `CapturedCrossFamily` value domain (`harness-is/src/harness_is/memory_record_envelope.py`), defaulting to `unknown` so a pre-amendment payload validates and reads undetermined; hash-inert by construction (`content_hash` / `memory_id` are computed from `content` before the envelope exists) and witnessed as such after the edit. (2) WRITE SIDE, DERIVATION -- ORIGIN-AWARE and split exactly as the spec leg fixed it: `_capture` determines the content-origin disposition from `event_kind` (the one method holding it) and passes THAT into `_record`, which computes the final tri-state; origin GATES the family comparison, so non-dispatch-derived content lands `unknown` and the canonicalized-provider-vs-composed-scope comparison is never consulted. `turn_completion` + `tool_event` are DISPATCH_DERIVED unless the invocation''s capture mode is REDACTED (codex R3: wholesale harness-authored replacement material lands `unknown`); `run_start` / `run_close` / `provider_route` / `failure_observation` / `compaction` are UNDETERMINED; an unmapped `event_kind` resolves to UNDETERMINED, so the table fails closed for a writer added later. No `capture_*` signature changed. (3) READ SIDE -- the `cross_family_capture` flag vocabulary member plus the gate at BOTH entry points (`_candidate_from_hint`; the tool executor''s `_promotion_risk_flags` / `_propose_promotion`), biconditional with the gate and unconditional on policy (holds under `PROMOTE_SEMANTIC` and `PROMOTE_PROCEDURAL` with `ReviewMode.AUTOMATIC`); the illegal pair refused at every validating constructor, by direct construction and by deserialization; the reserved flag re-derived in both directions so a hint can neither introduce nor suppress it; the durable content carrier on promotion-written records (the C-MEM-08 ledger shape deliberately unchanged); and the redaction RESET, so a content-replacing transition returns a prior determination to `unknown`. (4) ACTIVATION BOUNDARY -- ONE frozen `_EffectiveProvenance` snapshot per service call feeding both the gate (a pure projection performing no lookup of its own) and every durable write; worst-value aggregation across multiple cited sources; per-branch fail-closed handling (empty refs, unparseable `memory_id`, no usable `run_id`, unreadable record) that withholds AUTOMATIC activation only and leaves the operator-approved path open -- reading B, not reading C; choke-point normalization at `_persist_decision` covering all FOUR callers (`propose_for_review` / `approve` / `deny` / `edit_and_approve`); and COMMIT BINDING via a guarded conditional write executed inside the store''s own write locks (`CanonicalMemoryStore.write_record_guarded`, both locks re-entrant in a documented `_FILE_WRITE_LOCK` -> `_JSONL_WRITE_LOCK` order), raising rather than committing an activation against a source whose recorded provenance changed after the snapshot -- compared as the EXACT per-source tri-state vector (codex R2 correction; a source that becomes unresolvable is kept distinct from a stored `unknown`), never a decision-bearing projection. The cross-process half was BUILT at codex R1 rather than scoped away: the house flock primitive is generalized to a per-root `cross_process_scope_lock` taken by BOTH `write_record` and `write_record_guarded`, witnessed by a genuine two-OS-process interleaving test. (5) CLOSEOUT -- the U-MEM-25 evidence packet''s window 2 is CLOSED the way the U-MEM-26 leg closed window 1: all six `PENDING - U-MEM-27` markers lifted (C-MEM-03, C-MEM-10, R-MEM-01, R-MEM-05, R-MEM-09, R-MEM-14), scope advanced to spec v1.2 / plan v1.2 / U-MEM-01..27, and `just memory-closeout-check` re-run green with the refreshed rows in place. 91 witnesses across the four dedicated U-MEM-27 test modules plus the envelope/store witnesses folded into existing `harness-is` files (+98 suite-wide at `just check`, 7026 -> 7124; out-of-family codex converged clean at round 4 after three fix rounds recorded in the arc note). Arc record at `.harness/u-mem-27-impl-leg-close-2026-07-29.md`. The two BOUNDS the spec leg stated remain bounds, each needing its own later amendment: the field answers PRESENT/ABSENT only (not by-family), and aggregate-run provenance is not representable per-record.'
  council: 'Not required -- the deciding council already sat. The B-86 convening (C10 action-safety/blast-radius + C3 state/memory/persistence co-primary, C6 model-routing consultant, 2026-07-28) produced the continuity argument that forecloses reading C and the write-bounded-irreversible argument that forecloses reading A''s silence; this filing''s §7 reads that record rather than re-convening, per the nameable-tension discriminator (the C10-vs-C3 tension here is the SAME one already surfaced and probe-resolved at B-86, not a new one). What remains is an operator ratification, not a deliberation. Re-convene only if the operator selects a reading against the recommendation and wants the tension re-argued at C-MEM-10 altitude.'
  heading: '### B-92 · C-MEM-10 promotion eligibility of records captured during a cross-family fallback leg *(named open question carried forward at Spec_Memory_Substrate_v1.md v1.1 change-note "Named open question carried forward, not discharged." and U-MEM-26''s "Out of scope for this unit:" list; Class 1 fork FILED 2026-07-29; CLOSED 2026-07-29 — U-MEM-27 impl leg)*'
- id: B-93
  title: 'Whole-root memory-write serialization has no deadline -- an unbounded guarded precondition stalls every memory writer on the host'
  status: registered_finding
  summary: 'Surfaced by the merge-gate concurrency lens on PR #1159 (the U-MEM-27 impl leg, 2026-07-29); classified REGISTER at the post-#1159 gate-log grounding pass (2026-07-30). MECHANISM: every `CanonicalMemoryStore` write takes `cross_process_scope_lock` over the whole memory ROOT (`_write_scope`, `harness-is/src/harness_is/memory_store.py`), and that lock is a plain BLOCKING `flock(LOCK_EX)` with no timeout (`_DirLock.acquire`, `harness-is/src/harness_is/cross_process_ledger_lock.py`). `write_record_guarded` additionally holds it across a CALLER-SUPPLIED precondition callable, so the hold time of a root-wide exclusive lock is set by code the store does not control and cannot bound. NO LIVE HAZARD AT HEAD: the only precondition in the tree is `_provenance_unchanged` (`harness-runtime/src/harness_runtime/memory_promotion.py`), bounded at one `read_record` per cited source memory ref -- a small N of local file reads, no network, no operator wait, no unbounded loop. The exposure is a FUTURE precondition (an operator confirmation, a provider round-trip, a retrieval sweep) whose author gets no signal from the seam that they are holding a host-wide lock: every same-host memory writer -- a `harness run` alongside a `harness daemon`, the shared-root case the seam''s own SCOPE paragraph documents -- then blocks for its duration, with no deadline and no diagnostic.'
  close_out: '(1) Pick the deadline shape: `LOCK_NB` + bounded retry with backoff, or a watchdog around the blocking call. `LOCK_NB`+retry is the portable one and composes with the B-45 Windows-backend work. (2) Choose the timeout''s semantics and its exception -- a NEW typed error distinct from `MemoryStoreGuardedWriteConflictError`, because a refused commit is a precondition outcome and a timeout is a liveness one; collapsing them would let a caller retry-loop against a stuck host. (3) Apply it CONSISTENTLY, and to the right unit of coverage. Counted by direct read at HEAD, there are EIGHT blocking-`flock` ACQUISITION SITES across THREE modules, reachable through SIX entry surfaces -- and the acquisition site, not the entry surface, is where a deadline goes. In `harness-is/src/harness_is/cross_process_ledger_lock.py` (six): `_DirLock.acquire` `:133` `LOCK_EX`, the shared engine behind ALL FOUR of that module''s entry surfaces (`_dir_lock_for` callers at `:213` scope / `:365` write / `:484` replace / `:572` read); `cross_process_write_lock` `:406` `LOCK_EX`; `cross_process_replace_lock` `:507` `LOCK_EX`; `cross_process_read_lock` `:605` `LOCK_SH`; `_acquire_legacy_sidecar_for_writer` `:274` `LOCK_EX`; and `_acquire_legacy_sidecar_if_present` `:330` `LOCK_EX`/`LOCK_SH`. In `harness-runtime` (two): `reconciler_pause_resume_substrate._workflow_lock` `:294` `LOCK_EX` and `protected_result_store._cross_process_lock` `:347` `LOCK_EX`. INTENDED COVERAGE: all eight. TWO traps a naive impl falls into. First, ONE entry surface can block at up to THREE distinct sites in sequence (dir lock -> legacy sidecar -> file lock), so a deadline bolted onto `cross_process_write_lock`''s own `flock` leaves the other two unbounded and the entry surface still has no end-to-end bound. Second, the three `LOCK_NB` calls (`:402`, `:498`, `:599`) are contention PROBES that fall back to a blocking wait on the next line -- they are not deadlines and must not be counted as coverage. Note also that one site is `LOCK_SH`, so "they are all `LOCK_EX`" is false. That is the same primitive set B-45 must give a Windows backend, which is why this is B-45''s natural CO-RIDER -- both arcs traverse it, and doing them together costs one traversal instead of two. (4) Document the hold-time contract at `write_record_guarded` so a precondition author meets the constraint at the seam rather than in production. Not urgent while `_provenance_unchanged` is the only precondition -- but the seam is GENERIC by design, so the SECOND precondition is the trigger, and this row should be re-checked at every new caller.'
  council: 'No -- an implementation-level liveness bound on an already-cleared lock mechanism (C-IS-09 §9.4 defers the mechanism to implementation discretion), with no cross-domain tension to name. It does carry a real design choice at step (2) (fail-fast vs retry, and what a timed-out guarded write means to its caller), so it is not mechanical: advisor() + out-of-family review at build time is the right weight. Council-eligible only if it is taken WITH B-45 and the Windows-backend tradeoff makes the deadline semantics non-obvious.'
  heading: '### B-93 · Whole-root memory-write serialization has no deadline — an unbounded guarded precondition stalls every memory writer on the host *(surfaced by the merge-gate concurrency lens on the U-MEM-27 impl leg, PR #1159, 2026-07-29; classified REGISTER at the post-#1159 gate-log grounding pass, 2026-07-30)*'
- id: B-94
  title: 'Derived-index auto-refresh rebuild overlap race -- two concurrent rebuilds can leave the OLDER snapshot last and reading fresh'
  status: registered_finding
  summary: 'Surfaced by out-of-family Codex R5 at the post-#1159 gate-log PR (2026-07-30). MECHANISM: `DerivedRetrievalIndexStore.rebuild` computes its entry set from the filesystem and then appends the result, holding NO lock across the two (`harness-is/src/harness_is/memory_retrieval_index.py`; `_append_jsonl` is a bare `open("ab")` + write). Two overlapping rebuilds can therefore interleave as: X reads the record set; a commit lands; Y reads the NEWER set and appends it; X appends its OLDER set LAST. `read_current` resolves an untokenized ledger by POSITION (last rebuild wins), so it returns X''s stale snapshot with `stale=False` - a committed record missing from an index reported as current. PRE-EXISTING, verified by `git show fc40fb2b` and NOT widened by the B-93 arc: pre-branch `rebuild` at `:177-200` computed entries at `:180` and appended at `:199` with no lock; `_append_jsonl` at `:571-574` took none either; `read_current` at `:210-227` was purely positional last-wins; and `AutoRefreshingDerivedRetrievalIndexStore.read_current` (`harness-runtime/src/harness_runtime/automatic_memory.py:110-114`) rebuilt on missing/stale with no coordination - the same interleaving yields the same wrong outcome on the pre-branch code. SCOPE OF WHAT THE B-93 ARC DID AND DID NOT COVER: that arc added a commit-ordering protocol (`commit_seq` stamped inside the memory store''''s write hold, and a `rebuilt_coverage` event binding a rebuild to the commit it answers) which orders TOKENIZED rebuilds - the hook path, where the caller has an invalidation event to quote. The PRODUCTION auto-refresh path is untokenized BY DESIGN: it rebuilds because a read found the index missing or stale, not in response to a specific write, so it has no token to pass and correctly falls to the legacy positional rule. The protocol therefore does not reach this race, and an all-untokenized ledger behaves exactly as it did pre-branch.'
  close_out: 'CANDIDATE FIX SHAPE (Codex R5''''s direction, recorded not built): derive a coverage token on the auto-refresh path too, from the ledger length captured at the READ that decided to rebuild. That read already walks the whole ledger, so its byte length at that moment is free and is exactly the same monotonic quantity `_next_commit_seq` uses - it names "the state I found stale", which is the honest under-claiming attribution the rebuild contract already requires. `AutoRefreshingDerivedRetrievalIndexStore.read_current` would capture it in the `except` branch and pass it to `rebuild(commit_seq=...)`; the existing ordering rules then reject the older overlapping snapshot with no further change to `read_current`. OPEN QUESTIONS to settle at build time: (1) the capture must happen INSIDE the failed read rather than after it, or it re-races - `read_current` currently returns nothing on the raise, so the token needs a carrier on the exception or a private read variant; (2) whether the fix belongs at the `harness-runtime` subclass (where the auto-refresh policy lives) or at the IS-axis base (where the token semantics live) - the IS axis has zero outbound cross-axis edges, so a base-class change must not import runtime concerns; (3) whether a losing rebuild should be pruned rather than merely ignored, since the ledger still grows by one full snapshot per overlap. NOT URGENT: the outcome is a stale-but-valid index (a retrieval base that under-serves, never a wrong record), the auto-refresh path self-corrects at the next canonical write''''s stale marker, and single-process local development - the default posture - does not overlap rebuilds at all. Re-check when a second concurrent memory consumer becomes routine (daemon + one-shot both retrieving), which is the same trigger B-93 carries.'
  council: 'No -- a bounded concurrency fix inside an already-cleared derived-index mechanism, with the ordering protocol it would extend already built and witnessed at the B-93 arc. There is no cross-domain tension to surface: the question is where the token is captured, not whether the index should be ordered. It does carry a real placement decision (open question 2, the IS-vs-runtime boundary under the IS axis'''' zero-outbound invariant), so advisor() + out-of-family review at build time is the right weight.'
  heading: '### B-94 · Derived-index auto-refresh rebuild overlap race — two concurrent rebuilds can leave the OLDER snapshot last and reading fresh *(surfaced by out-of-family Codex R5 on the B-93 gate-log arc, 2026-07-30; classified PRE-EXISTING by git-show verification against fc40fb2b)*'
- id: B-95
  title: 'Mixed-version ordering bound -- a live PRE-B-93 WRITER''''s untokenized stale markers cannot be ordered against a covered rebuild'
  status: registered_finding
  summary: 'Surfaced by out-of-family Codex R6 at the post-#1159 gate-log PR (2026-07-30), reproduced deterministically. MECHANISM: during a mixed-version window a NEW hook captures snapshot A; a PRE-B-93 writer commits B and appends an UNTOKENIZED stale marker; the hook then appends A''''s rebuild pair last. In `read_current` (`harness-is/src/harness_is/memory_retrieval_index.py`) the untokenized marker has no `commit_seq`, so it is excluded from `max_stale_seq`, and accepting the covered rebuild resets the positional `stale_after_current` flag -- the A-only index then reads FRESH with B missing. PRECONDITION TRIPLE, each verified by direct read at HEAD and each FALSE today: (a) a live PRE-B-93 *writer* in the window -- not merely an old reader, whose parse compatibility the R3 fix already covers -- because at HEAD `commit_seq` is a REQUIRED field on `DerivedIndexInvalidation`, so every B-93+ writer stamps every marker and an untokenized marker can only come from an older writer process; (b) a WIRED `derived_index_hook` -- re-confirmed ZERO production consumers at HEAD, the only wirings being `harness-is/tests/test_memory_store.py` and `harness-is/tests/test_memory_redaction.py`; (c) an overlapping write + hook-rebuild interleaving. NOTE the sharpening: historical untokenized lines written BEFORE an upgrade are benign, because a later rebuild reads the whole filesystem and genuinely covers them; only a CONCURRENT untokenized write interleaved with an in-flight rebuild is harmful.'
  close_out: 'INFORMATION-THEORETIC LIMIT, stated precisely: a legacy stale marker carries no commit token BY DEFINITION, so no read-side rule can retroactively order it against a covered rebuild -- the information required for the comparison was never written. This is not a missing check; it is absent data. The choices are therefore only three. (1) SERIALIZE NOTIFICATIONS during a detected mixed window -- reintroduces exactly the callback-deadlock surface the arc''''s first commit removed (a hook holding the notify turn while its inner thread''''s write waits behind it), so it trades a latent ordering gap for a latent hang; rejected on that ground unless the window can be detected AND the serialization scoped to it. (2) VERSION-FENCE THE LEDGER -- have B-93+ writers refuse to share a ledger they can detect an older writer is also appending to (a writer-version marker line, or a fence file beside the ledger), converting a silent misorder into a loud refusal during the upgrade window; costs a new failure mode operators must understand and a decision about what a fenced writer should DO. (3) ACCEPT THE BOUND and document it -- taken here, since all three preconditions are counterfactual at HEAD. HOLD RATIONALE: this is the THIRD consecutive self-inflicted `read_current` finding (R4 was caused by R3''''s carrier, R5''''s [P2] by R3/R4''''s two-pass read, and this by R2''''s ordering protocol), which is the arms-race stop rule the arc pre-declared at round 4 firing exactly as written. No further carrier change is made. Re-open when a genuine mixed-version deployment is planned, or when the first production `derived_index_hook` consumer is wired -- whichever comes first, since either alone makes a precondition true.'
  council: 'Not for the bound itself -- accepting a documented limit needs no deliberation. IF the version-fence direction (2) is ever taken it becomes council-eligible: refusing to write during an upgrade window is an operator-visible availability tradeoff (C11 operator-loop / local-deployment against C3 state-and-persistence integrity), and that IS a nameable cross-domain tension rather than an implementation detail.'
  heading: '### B-95 · Mixed-version ordering bound — a live PRE-B-93 **writer**''s untokenized stale markers cannot be ordered against a covered rebuild *(surfaced by out-of-family Codex R6 on the B-93 gate-log arc, 2026-07-30; REGISTER-AND-HOLD under the arc''s own stop rule)*'
- id: B-96
  title: 'The B-77 first-observation grace is bounded by SWEEP COUNT, not elapsed time --
    a short or failing run''s own shutdown sweep can reclaim a crash-recovered entry
    milliseconds after its bootstrap sweep first observed it'
  status: registered_finding
  summary: 'Surfaced by out-of-family Codex round 2 at the B-77 impl arc (2026-07-30),
    against the fix landed in that same PR. `gc_sweep`''s first-observation grace refuses to
    reclaim an entry the store has not already seen past TTL at a PRIOR sweep of the same
    root -- which closes B-77''s named defect (a crash-recovered entry carrying the
    pre-commit stamp is never reclaimed BY THE SWEEP THAT FIRST SEES IT, i.e. never by the
    bootstrap sweep of the recovering process). The residue Codex names is the grace''s
    PRACTICAL DURATION: every `run()`/`resume()` sweeps twice by construction -- once at
    `bootstrap/stage_4_od.py:123` and once, unconditionally, at `shutdown.py` step 5b -- so
    the interval between the first and second observation is the RUN''s own duration, which
    for a short or immediately-failing run is milliseconds. A genuinely-live,
    crash-recovered entry therefore still survives only to that same run''s shutdown, not
    for a wall-clock interval any repair flow can rely on. This is the sweep-COUNT reading
    of B-77''s ratified close_out (verbatim: "should not reclaim an entry it has not
    observed in a PRIOR sweep (a grace period) -- bounded to one sweep interval"), landed
    as ratified and NOT redesigned mid-arc -- the B-77 row records three prior wrong
    mechanism claims on this same file, and a fourth unratified attempt is precisely the
    non-convergent-adversarial-hardening pattern this workspace stops on. Registered here
    instead, with the practical bound stated honestly in the code docstring rather than
    overclaimed. Reachability is the same narrow floor B-74/B-77 already share: it needs a
    deployment `ttl_seconds` short enough that the crash window alone tips a live entry
    past it (the factory default is 86400s, roughly seven orders of magnitude above that),
    AND a crash landing strictly between `os.link` and the post-commit mtime refresh, AND a
    recovering run short enough that its own shutdown sweep fires before any repair read.'
  close_out: 'Replace the sweep-COUNT grace with an elapsed-TIME one, using the first
    observation''s wall-clock as the age authority B-77''s close_out actually names ("an age
    authority that cannot predate publication by construction") -- record `first_observed_at`
    alongside the filename in `_root_observed_expired` and reclaim only when BOTH the
    mtime-derived age AND `now - first_observed_at` exceed `ttl_seconds`. Note the genuine
    tradeoff that makes this a ratification-owned decision rather than a mechanical patch:
    the conservative rule lengthens worst-case retention of a genuine crash orphan by up to
    one full TTL (a day at the factory default), which trades against the spec''s own
    bounded-retention term (Runtime v1.106 SS14.8.11 -- "a signing outage must not grow an
    unbounded store of sensitive payloads"). Pick the bound deliberately; do not narrow
    `ttl_seconds` itself (B-74''s declined option). Witness by driving a full
    bootstrap-then-shutdown pair against a crash-window entry and asserting it survives
    BOTH sweeps when the elapsed interval is under TTL, and is reclaimed once it is not.'
  council: 'conditional -- the mechanism is mechanical, but the retention bound it picks is
    a nameable cross-domain tension (C3 state-and-persistence integrity wanting the
    conservative age authority against C7/C8 wanting the spec''s bounded-retention floor on
    sensitive payloads); convene if the elapsed-time variant is taken.'
  heading: '### B-96 · The B-77 first-observation grace is bounded by SWEEP COUNT, not elapsed time -- a short or failing run''s own shutdown sweep can reclaim a crash-recovered entry milliseconds after its bootstrap sweep first observed it *(surfaced at the B-77 impl arc, out-of-family Codex round 2 [P2], 2026-07-30)*'
- id: B-97
  title: The durable pause journal carries no tenant binding (half (a), OPEN); its appends
    were unserialized across processes (half (b), CLOSED)
  status: registered_finding
  pr: '#pending'
  summary: 'HALF (b) IS CLOSED, HALF (a) IS THE LIVE REMAINDER -- the row stays
    registered_finding because the enum has no half-closed member, and collapsing a
    two-half row to closed on one half would erase the open one. HALF (b), CLOSED at the
    B-97(b) arc 2026-07-31: JournalWorkflowPauseStore._append now runs its ENTIRE body
    (the is_new_file / needs_leading_newline / append TOCTOU triple, the write, the fsync
    and the torn-append self-heal) under _cross_process_append_lock -- a hand-rolled
    fcntl.flock on a dedicated PER-WORKFLOW <journal>.lock file, mirroring the primitive
    already shipped at protected_result_store._cross_process_lock. GRANULARITY IS THE
    GROUNDED PART: the house harness_is.cross_process_ledger_lock.cross_process_scope_lock
    (one lock per directory TREE) was implemented FIRST and rejected at out-of-family
    review round 2 [P2] -- a directory-wide lock makes one workflow''s append wait behind
    ANOTHER workflow''s, which contradicts this store''s own isolation property (per-workflow
    files exist so one workflow cannot block another) and, because reads are unlocked, widens
    the window in which a read of the queued workflow reports the absent cause that Runtime
    spec v1.107 section 30 attributes as PERMANENT. The per-workflow lock leaves that
    pre-existing capture-not-yet-landed race exactly the size it already was. The READ path
    deliberately takes NO lock, which is what keeps section 30''s empty-journal INDETERMINATE
    clause exact as written and is why the arc owed ZERO spec text. A SECOND out-of-family [P1]
    (round 1) found a PRE-EXISTING crash window the arc could have inherited: a process that
    creates the journal directory and dies before writing leaves the dirent present but NOT
    durable, and a parent-fsync keyed on dir_is_new alone then skips it FOREVER. The round-1
    fix keyed it on (is_new_file or dir_is_new); the pre-merge 3-lens gate found that form
    NARROWS but does not CLOSE the window -- a writer whose path.open("a") creates the journal
    file and which dies before the fsync leaves BOTH flags False for every successor, so "a
    journal file exists implies some earlier writer already fsynced" is false for that
    interleaving. SHIPPED FORM: BOTH directory fsyncs are UNCONDITIONAL -- the parent
    (STATE_LEDGER) fsync runs after mkdir and BEFORE the lock, so it precedes any statement
    that could create a journal file, and the journal-dir fsync runs after every append. That
    is true by construction with no interleaving exception, and it DELETES both flags rather
    than adding a third. The journal-dir level carried the identical defect one level down
    (create file, write, die before fsync, every successor reads is_new_file=False) -- purely
    PRE-EXISTING, byte-identical to the pre-B-97 code, and closed here rather than left as a
    known twin of the defect being fixed beside it. Cost: two best-effort directory fsyncs on
    a path that already fsyncs the record, for a human-latency event. SHARPENING RECORDED HONESTLY: the original finding
    framed (b) as interleaved/torn records, and an empirical probe at the arc found that
    half NOT reachable at the shipped record shape -- _append emits each record in exactly
    ONE write() syscall (measured on the real FileIO/BufferedWriter/TextIOWrapper stack at
    60 KB, 4 MB and on the leading-newline self-heal path, whose 1-byte newline is
    coalesced into the same flush), and O_APPEND makes a single write atomic on a local
    POSIX filesystem; a 2x12 concurrent-append run at 12 KB / 60 KB / 500 KB / 4 MB
    produced zero malformed records with the lock REMOVED. What the lock genuinely buys:
    mutual exclusion across processes at all, independence from an UNSPECIFIED platform
    guarantee (O_APPEND atomicity does not hold on NFS/SMB, and the resolved STATE_LEDGER
    dir is operator-configured), and soundness for the self-heal''s documented
    single-writer-only reasoning. HALF (a) REMAINS OPEN and is the row''s live text:
    Runtime spec section 14.8.11 (:4804 heading, :4809 tenant-composite key, :4812
    tenant-bound lookup -- cites REFRESHED at this arc; the prior :4636/:4639 pair was
    stale by about 168 lines after v1.107) commits a FULL-STRENGTH tenant-composite key
    plus a typed cross-tenant refusal for comparable durable state, while
    JournalWorkflowPauseStore is workflow_id-keyed, one file per workflow, and now carries
    recovered branch outputs. PRE-EXISTING and explicitly NOT B-69''s: api.resume() reads
    the same key today, and the B-69 accessor adds ZERO tenant exposure.'
  close_out: 'HALF (b): CLOSED -- see the summary; 13 witnesses at
    harness-runtime/tests/test_journal_pause_store_cross_process_append_b97.py (a genuine
    two-OS-process blocking witness with the B-73 flock-attempt handshake, a lock-file INODE
    identity witness, a per-workflow-granularity witness pinning that two workflows lock
    DISTINCT targets, both read-path no-lock witnesses, and two directory-fsync witnesses
    covering the ordering claim and both crash residues -- each mutation-probed, with the
    probe matrix DERIVED programmatically (tools-side script, 10 mutations x the real suite;
    the pre-merge gate caught a hand-carried probe row that had been measured against an
    earlier implementation and never re-verified -- the same count-drift class the ledger
    tally gates exist for). SPEC REFRESH OWED AT THE HALF-(a) LEG: two Runtime spec v1.107
    section 30 sentences go stale-as-described once half (b) lands -- :3313 term 5 ("makes no
    claim about cross-process write-write serialization of the journal, which remains
    unguarded") and :3319 ("cross-process append serialization is explicitly unresolved
    (registered at B-97)"). Neither is a Class-1 halt: both sentences'' asserted PROPERTIES
    still hold (term 5''s supersession-window claim is untouched; :3319''s empty-journal
    indeterminacy never depended on append serialization), only their parenthetical
    descriptions of the store are now wrong. The half-(a) leg touches section 30 anyway for
    the sixth cause member, so it carries this refresh. FORWARD NOTE (out-of-family [P2],
    pre-merge gate): the flock is a BLOCKING syscall taken on the event loop, since capture()
    is called synchronously from the async capture_pause_snapshot; precedented (the sibling
    protected result store grew resolve_result_ref_off_loop for exactly this), deliberately
    NOT built in this arc, and left for the half-(a) leg or a follow-on to decide. HALF (a): OPEN, and FORK-SHAPED
    rather than an impl task, because it changes the store''s KEYING and is therefore
    capture-side and hash-adjacent. The chain mirrors B-65''s: Class 2 fork doc ->
    operator ratification -> spec leg -> impl leg. FOUR decisions the fork must put to the
    operator, none of which an impl leg may settle silently: (1) KEY COMPOSITION -- does
    the tenant scope enter the sha256 FILENAME (opaque, but makes an existing journal
    unaddressable) or ride IN-RECORD alongside workflow_id (readable, but leaves the path
    tenant-blind); (2) REFUSAL SEMANTICS -- a cross-tenant read must be REFUSED TYPED per
    section 14.8.11 :4812, which needs a SIXTH cause in the deliberately CLOSED five-member
    PauseJournalReadCause vocabulary (Runtime spec section 30), so widening a closed
    vocabulary is itself the spec question; (3) MIGRATION -- an existing untenanted journal
    must be readable or deliberately abandoned, against section 14.14.8''s append-only /
    NEVER-truncated substrate invariant which forbids rewriting in place; (4) the
    (workflow_id, run_id) rider -- whether the same arc should carry run-instance
    distinctness, since both are keying changes and a second keying arc would pay the
    migration cost twice. NOTE the (b) lock SHRINKS but does not close the window B-102
    names.'
  council: 'conditional -- half (a) is C3''s surface (state/persistence keying) with a
    nameable C3 vs C11 tension if a tenant key adds local-deployment config burden. Half
    (b) was mechanical and is closed, so the prior "convene only if (a) is taken without
    (b)" condition is now unconditionally MET: opening (a) means convening.'
  heading: '### B-97 · The durable pause journal carries no tenant binding *(surfaced at the B-69 council convening as residual R-3, routed OUT of that arc, 2026-07-30; half (b), cross-process append serialization, CLOSED 2026-07-31; half (a), the tenant binding, OPEN)*'
- id: B-98
  title: Gate description / question text is absent from every durable pause carrier
  status: registered_finding
  summary: 'An operator inspecting durable pause state can learn WHERE a workflow is paused and
    through WHICH resolution channel, but not WHAT was asked. Verified across every PauseSnapshot
    field at the B-69 convening, and symmetrically for the closed-vocabulary counter-proposal:
    HITLPlacementKind exists as a StrEnum, but NO durable pause carrier declares a field of that
    type -- every placement occurrence in pause_resume_protocol_types.py is docstring prose. Both a
    free-text description and a closed-vocabulary placement field are therefore CAPTURE-SIDE scope,
    and the same empirical fact defeats both proposals. hitl_gate_config_hash was tested as a
    substitute and rejected on its surviving ground: it is a MATERIAL-DIFF IDENTITY, not a
    description -- an opaque digest whose only operator-meaningful semantic is "the gate config
    changed since capture"; it discriminates a config EDIT, never a re-pause.'
  close_out: 'Capture-side, hash-affecting, X-AL-3-relevant -- materially bigger than the read-only
    projection B-69 authored, and explicitly declined for that arc by the ergonomics voice itself.
    Close-out requires a capture-side carrier decision (which field, on which resume-state carriers,
    with what hash disposition per the drop-when-empty precedent) before any read-side projection
    field is added. DISTINCT FROM B-71, which adds a run-instance correlation id to
    HITLEscalationBrief and the webhook payload -- B-71 is about DISAMBIGUATING two identical-looking
    escalations; this row is about DESCRIBING one. Open only if the operator loop demands it: the
    B-69 projection deliberately ships without it, and position plus pause_reason were judged
    sufficient for the map-composition task.'
  council: 'yes if opened -- a nameable C10 vs C11 tension (action-safety wanting a closed vocabulary
    and no unbounded free-text channel in durable state, against operator-loop wanting a description
    a human can actually act on), and the B-69 convening surfaced exactly that tension without
    resolving it, because the empirical absence closed the seam first.'
  heading: '### B-98 · Gate description / question text is absent from every durable pause carrier
    *(surfaced at the B-69 council convening, SEAM 3, routed OUT of that arc, 2026-07-30)*'
- id: B-99
  title: The B-69 projection's summary_text exclusion must be re-adjudicated when the
    pause_context_reader deferral is discharged
  status: registered_finding
  summary: 'A NAMED REOPENING CONDITION, not a defect and not a gate -- filed so the B-69
    projection''s own justification cannot go stale silently. Runtime spec v1.107 section 31.2
    excludes StateSummary.summary_text from the caller-facing projection. That exclusion originally
    rested on TWO legs; one was falsified at the convening''s own adversarial pass. The FALSIFIED
    leg: "the exclusion is free, since summary_text is empty everywhere" -- true today, but only
    because the MVP binding is the injected placeholder pause_context_reader that Runtime spec
    section 14.14.7 marks explicitly deferred and whose own docstring says its successor "reads the
    current ledger head." The SURVIVING leg, which now carries the argument alone: the field is an
    UNBOUNDED FORWARD CHANNEL -- a placeholder for real ledger content with no redaction contract
    anywhere. Honest counter left unsmoothed: when a real reader is composed, the ergonomics case
    for INCLUSION genuinely reopens.'
  close_out: 'TRIGGER: the discharge of Runtime spec section 14.14.7''s pause_context_reader
    deferral -- i.e. when a real reader is composed and summary_text begins carrying ledger content.
    OBLIGATION AT THAT POINT: re-adjudicate the B-69 projection''s field set, WITH A REDACTION
    CONTRACT AS A PRECONDITION OF ANY INCLUSION, and re-adjudicate the paired OD spec v1.36
    section 30.5.4 redaction posture (currently NOT ENGAGED precisely because nothing redactable is
    emitted) in the SAME arc. NO redaction gate is imposed now, and that restraint is deliberate:
    the field is excluded, so there is nothing to redact, and gating an absent channel is textbook
    over-gating. Also re-examine at the same trigger: Runtime plan v2.55 U-RT-148 AC #5 (the W4
    characterization witness) asserts a PLACEHOLDER property and will fail for a good reason once a
    real reader lands -- its correct disposition is then DELETION or INVERSION, never repair.'
  council: 'no -- the tension was already convened and adjudicated at the B-69 record (C10 vs C11 on
    payload boundary); this row records the condition under which that adjudication must be re-run,
    and the re-run inherits the same voice pair without needing a fresh activation decision.'
  heading: '### B-99 · The B-69 projection''s `summary_text` exclusion must be re-adjudicated when
    the `pause_context_reader` deferral is discharged *(named reopening condition registered at the
    B-69 spec leg, 2026-07-30)*'
- id: B-100
  title: The empty-idempotency_key key-ABSENT carve-out is scoped to the fan-out crash-reconstruction
    carrier, but the LINEAR and orchestrator fence capture sites admit an empty key too
  status: registered_finding
  pr: '#1166'
  summary: 'Surfaced at the B-69 IMPL leg (2026-07-31), NOT absorbed. CP spec v1.112 section 2.1
    and Runtime spec v1.107 section 14.14.9.2 both scope the empty-key / key-field-ABSENT source
    shape to EffectFencePausedBranchResumeState -- the fan-out crash-reconstruction carrier, which
    the spec leg verified constructs idempotency_key="" deliberately (workflow_driver.py:4078). The
    shipped LINEAR site constructs EffectFenceResumeState(idempotency_key=_fence_key) whenever
    isinstance(_fence_key, str) (workflow_driver.py:5456), which ADMITS "", and the orchestrator
    site is unconstrained the same way. Both real resume sites consult a fence resolution only when
    the key is TRUTHY, and compute_effect_fence_tree_wide_abort_present already filters ALL empty
    keys regardless of carrier -- so an empty key surfaced on either of those two shapes is the
    SAME drop-not-refuse livelock (the operator response is silently DROPPED, not refused) that the
    branch-carrier carve-out exists to foreclose, arriving one door over. The B-69 impl leg
    therefore conforms to the cleared enumeration EXACTLY (the two shapes carry their key field
    unconstrained) and files this rather than widening the carve-out, because adding keyless
    sibling source shapes for those two carriers would extend the cleared eight-shape enumeration
    -- an X-AL-3 design extension an impl leg must not make silently.'
  close_out: 'Two separable dispositions, and the choice is a real one rather than a formality.
    (a) SPEC-SIDE: widen section 2.1 / section 14.14.9.2''s key-ABSENT treatment from "the
    crash-reconstruction carrier" to "any effect-fence source shape whose captured key is empty",
    adding a keyless sibling source shape for the LINEAR and orchestrator carriers -- the variant
    set stays at FOUR either way, only the SOURCE column widens, which is exactly the shape the two
    prior widenings at the spec leg took (rounds 1 and 2). (b) CAPTURE-SIDE: refuse an empty key at
    the LINEAR/orchestrator capture sites instead, so the read side never has to represent it --
    cheaper in type surface but capture-side and therefore hash-adjacent, which is why it is NOT
    the default recommendation. Note the exposure is currently DEFENSIVE-ONLY at both sites (the
    key is read by name off a runtime error, and no production path is known to yield ""), so this
    is a soundness gap rather than a live defect -- which is why it is registered rather than
    treated as a halt.'
  council: 'no -- the tension was already convened and adjudicated at the B-69 record; this row
    only asks whether the SAME adjudicated rule reaches two more source carriers, which is a
    scoping question for a spec-writer apply pass, not a fresh cross-domain tension.'
  heading: '### B-100 · The empty-`idempotency_key` key-ABSENT carve-out does not reach the LINEAR
    and orchestrator fence carriers *(surfaced at the `B-69` impl leg, reported not absorbed,
    2026-07-31)*'
- id: B-101
  title: Accessor-derived resume-context provenance is LOST through base-typed Pydantic
    serialization, and closing it requires a ResumeContext spec change
  status: registered_finding
  pr: '#1166'
  summary: 'Surfaced at the B-69 IMPL leg by out-of-family review round 3 [P1], reported not
    absorbed. AccessorDerivedResumeContext is a SUBCLASS of the CP-owned ResumeContext, and
    Pydantic v2 serializes a subclass through a base-typed field or TypeAdapter using the BASE
    schema -- so a round-trip through a ResumeContext-typed boundary emits only the four legacy
    fields and silently DROPS pause_state. Revalidating yields a plain ResumeContext, after which
    api.resume()''s variant check sees a legacy context and the section 30 staleness fence does not
    fire. NOT reachable on any shipped path today (api.resume takes the object directly and the
    in-process MCP handoff stores it without serializing), so this is a latent hazard rather than a
    live defect. It is an instance of the residual CP spec v1.112 section 1.2 already states on the
    record -- "a caller who takes an accessor read and then, independently, constructs a legacy
    ResumeContext is unfenced ... the type system cannot track a side effect that happened before
    construction" -- but it arrives through ORDINARY SERIALIZATION rather than a deliberate act,
    which is the sharper form and the reason it is filed. Pinned by
    test_provenance_is_lost_through_base_typed_serialization_registered_b101, which asserts the
    CURRENT behavior so the boundary is visible and any future change to it is deliberate. NEAREST-APPROACH VECTOR (scoped re-gate at the B-97(b) arc, 2026-07-31): ResumeContext is ALREADY a base-typed field of StepExecutionContext (workflow_driver_types.py:460). It is not dumped today -- only HandoffContext is model_dump_json''d, model_copy preserves object references rather than revalidating, and revalidate_instances defaults to never -- so the not-reachable-today claim STANDS. But the hazard is ONE model_dump away on an existing carrier, not a hypothetical future boundary, and disposition (b) (documenting the boundary as out of scope) would NOT close that vector.'
  close_out: 'CANNOT be closed from the subclass: the behavior is controlled by the BASE type''s
    Pydantic schema, and CP spec v1.112 requires ResumeContext''s field set be PRESERVED VERBATIM,
    so adding a variant discriminator to it is a SPEC change an impl leg must not make. Two
    dispositions, both spec-side: (a) amend CP spec section 1 so ResumeContext itself carries a
    closed variant discriminator and the two variants become an explicit discriminated union --
    strictly stronger, but it breaks the "field set preserved verbatim" guarantee section 0.4 makes
    and would need its own byte-compat argument for every existing construction site; (b) declare
    the serialization boundary formally OUT of the fence''s scope, extending section 1.2''s stated
    residual to name it, so the limit is documented at contract altitude rather than only in a
    test. (b) is the cheaper and more honest default given the residual is already on the record;
    (a) is warranted only if a serialization boundary ever appears on a real resume path.'
  council: 'no -- this is a scoping question about an already-adjudicated residual, for a
    spec-writer apply pass; no new cross-domain tension is present.'
  heading: '### B-101 · Accessor-derived provenance is lost through base-typed Pydantic
    serialization *(surfaced at the `B-69` impl leg, out-of-family review round 3, reported not
    absorbed, 2026-07-31)*'
- id: B-102
  title: corrupt-latest AND absent are presented as decisive while the same cross-process
    reachability argument that qualifies empty-journal applies to both
  status: registered_finding
  pr: '#pending'
  summary: 'Surfaced at the B-97(b) arc (lens-1 F1, 2026-07-31), reported not absorbed;
    WIDENED at the same arc''s out-of-family review round 2, which found the identical
    omission on a second row. Runtime spec v1.107 section 30''s cause table scopes its
    MUST-NOT-present-as-decisive clause to ONE row of three: empty-journal (:3319) carries "INDETERMINATE across processes -- a
    concurrent capture() may complete immediately after this read" plus "an implementation
    MUST NOT present it as decisive loss where a second writer is reachable". The
    corrupt-latest row (:3321) says only "permanent", and the shipped read hard-codes
    retryable=False, indeterminate=False for it (journal_workflow_pause_store.py, the
    non-empty branch of read_latest_attributed). But the SAME argument applies: a torn
    trailing line is exactly what an in-flight append looks like from a reader, so a read
    that lands mid-append attributes corrupt-latest to a record that is about to become
    well-formed -- and where a second writer is reachable that outcome is INDETERMINATE,
    not decisive loss. The two rows differ only in WHERE the concurrent writer is caught
    (before its first byte vs between its bytes), which is not a difference the operator
    repair column can act on. B-97(b) SHRINKS the window (concurrent APPENDS are now
    serialized, so a torn tail can no longer be produced by two live writers racing) but
    does NOT close it: a writer killed mid-append still leaves a torn tail, and a reader
    racing a single live writer is unaffected by a lock the reader deliberately does not
    take. THE SAME OMISSION REACHES absent (:3318, "permanent"), found independently by
    out-of-family review round 2 at this arc: a read of a workflow whose capture has been
    dispatched but has not yet created its journal file reports absent with
    indeterminate=False, and that capture may complete moments later. So section 30
    qualifies ONE of the three permanent-absence causes and leaves the other two
    unqualified on the same reachability. NOT a live defect on the shipped single-process
    deployment -- filed as a soundness gap in the attribution contract, exactly as B-100
    was.'
  close_out: 'SPEC-TOUCH OWED -- an impl leg must not widen a cleared cause table on its own
    authority (X-AL-3). (a) Amend Runtime spec section 30''s cause table so corrupt-latest
    AND absent carry the same reachability qualification empty-journal already carries, then
    flip the read-side attribution to indeterminate=True for those causes where a second
    writer is reachable. (b) The narrower alternative: leave the table alone and document why a torn
    tail IS decisive despite the symmetry -- viable only if someone can produce the
    asymmetry, which this row could not. Prefer (a). Note the fix is attribution-only: the
    fail-closed disposition is unchanged either way, and no new cause member is needed (which
    keeps it independent of B-97 half (a), whose refusal semantics DO need a sixth member).
    Cross-ref B-97: its half (a) touches the same closed vocabulary, and its half (b) is the
    reachability amplifier that motivated this row.'
  council: 'no -- this asks whether an already-adjudicated qualification reaches one more row
    of the same table; it is a scoping question for a spec-writer apply pass, not a fresh
    cross-domain tension.'
  heading: '### B-102 · `corrupt-latest` is presented as decisive, but a torn in-flight append tail is cross-process reachable exactly as `empty-journal` is *(surfaced at the `B-97`(b) arc, lens-1 F1, 2026-07-31)*'
