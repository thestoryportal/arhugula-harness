    spec_delta: "operator-ratified precedence + additive CP signal — CP spec v1.49 → v1.50 (NEW `StepEffectiveBinding.model_binding_override` signal at C-CP-06 §6.2 + §6.6 provenance) + runtime spec v1.70 → v1.71 (NEW §14.6.2 the 5-tier precedence authority + the decline-mirror invariant + the wrapper workload_class field). The PRECEDENCE ORDERING was the genuine operator gate, ANSWERED by AskUserQuestion 2026-06-22 ('Model-resolution consolidation' chosen over the per-workload sliver). Additive CP signal (no committed invariant sacrificed; no new contract/fail-class/§5.2-hash/Protocol-widening/CXA edge). Subsumes the narrower registered B-ROUTING-MANIFEST-MODEL-FOLD scope (this id RESCOPED to the consolidation 2026-06-22)."
    gives: "A per-step (`StepOverride.model_binding`) OR per-workload (`per_workload_overrides[workload].model_binding_override`) MODEL override now reaches dispatch — both were SILENTLY DROPPED before (the C-RT-16 wrapper never read `binding.model_binding` and had no `workload_class`). The dispatched model resolves from ALL 5 sources at the SINGLE `_effective_chain` authority in the operator-ratified precedence per-step > per-workload > per-role > routed > default. Mechanism: (1) CP adds the per-step MODEL `None`-or-override SIGNAL `StepEffectiveBinding.model_binding_override` (the v1.37/v1.38 precedent; `model_binding` stays concrete for back-compat); (2) the wrapper gains an explicit `workload_class` field (stage-5-bound); (3) `_effective_chain(binding, agent_role, *, routed)` resolves the 5-tier precedence, each non-default winner through the existing `_augment_primary`; (4) the §14.6.2 invariant — `resolve_routed_binding`'s decline predicate is aligned to MIRROR `_effective_chain` EXACTLY (never STRICTER, else a model that should route drops to default): per-step `model_binding_override is not None` (was coarse `override_applied`); per-role default-role exclusion; per-workload `or _MVP_DEFAULT_WORKLOAD_CLASS` mirror. Per-step + per-workload MODEL tiers are LIVE present-tense (single provider, routing off); routed tier production-dormant until a 2nd provider. Witnesses: full-chain wrapper by-execution (per-step dispatched / per-workload routing-off / default-workload-class mirror / 5 precedence pairs / negative control) + inner-decline alignment (model-specific per-step pins; non-model per-step + default-role do NOT block embedding) + CP signal (applies/none/provenance). pyright 0/0/0; harness-cp 1165+1xfail, harness-runtime non-e2e 2025, harness-od 950, harness-cxa 28, harness-is 171 (cross-axis ripple clean). advisor (the multi-site seam + the decline-mirror/workload-None/default-role asymmetry catches) + out-of-family Codex. Bundled-absorption: CP v1.50 + run