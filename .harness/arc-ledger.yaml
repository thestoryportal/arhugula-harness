the discovered-tool path's over-applying direction = fence silently disabled = unsafe, so witnessed end-to-end). advisor (BUILD-vs-gate discriminator + tool-intrinsic strict-semantic catch + the production-path full-chain-witness pre-push catch) + out-of-family Codex (only the expected §12.2.1 dashboard-lag [P2]). B-EFFECT-FENCE-HITL-ROUTE is now the sole registered §14.22.7 follow-on."
