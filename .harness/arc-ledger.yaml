    gives: "The inner C-RT-15 gen_ai span's routing.layer now reports the REAL EMBEDDING/L3 layer the C-RT-16 wrapper resolved for the routed PRIMARY, instead of the inner's faithful DECLARATIVE echo (RoutingLayer.DECLARATIVE == 'manifest'). Mechanism (the §14.6.1-named 'per-dispatch context', NOT a Protocol widening): `resolve_routed_binding` now returns a `RoutedPrimaryResolution` (the routed ModelBinding it already returned + the resolving RoutingDecisionTrace + binding rationale it previously DISCARDED at the partition() line); the wrapper extracts `.model_binding` for chain composition unchanged AND — for the routed PRIMARY candidate ONLY — publishes `(routing_trace, binding_rationale)` on a module ContextVar `ROUTED_PRIMARY_SPAN_TRACE` around the inner dispatch; `_invoke_provider` reads it for routing.layer/binding_rationale, else the local echo. ContextVar (per-task, fan-out-safe — the B-INTERSTEP-PERRUN-ISOLATION v1.64 precedent), NOT an instance attr (the dispatcher is shared across concurrent branches). Fallback candidates (chain-selected, not routing-selected) keep the faithful echo — the ContextVar is cleared to None for them (scope-boundary held). routing.provider/routing.model still reflect the actually-dispatched candidate. RoutedBindingResolver Protocol + RoutedPrimaryResolution + the ContextVar are ALL harness_runtime-internal → CP spec UNCHANGED, no StepDispatcher Protocol widening, no §5.2-hash change, observability-additive (no selection/dispatch behavior change). Capability is production-dormant until a 2nd provider makes routing-among-candidates meaningful; this is the observability-fidelity fix for that dormant-but-real capability. Witnesses (+3 by-execution through the REAL wrapper + REAL resolver + recording provider): routed-primary span reports 'embedding' + routing-off span reports the 'manifest' echo (negative control) + a failed routed primary → haiku span 'embedding' while opus fallback span 'manifest' (scope-boundary held). 5 existing