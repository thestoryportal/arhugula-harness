ance markers). advisor (2 passes — the BUILD-not-gate reframe + the key-bound/consume-once + clear_claim/ABORT-claim witnesses) + out-of-family Codex. The §14.22 effect-fence family is now COMPLETE through the operator-recoverability story (DURABLE-AUTO + PER-TOOL + HITL-ROUTE + PAUSE-RESOLUTION)."
