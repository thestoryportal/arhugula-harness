# Arc ledger — single structured source of truth for R-FS-1 arc + unit status.
#
# Authored for the roadmap-dashboard overhaul (full forward-arc + unit visibility,
# dynamic, pruned). Mirrors the proven `.harness/substitutions.yaml` →
# `tools/substitution_ledger.py` → dashboard + blocking CI gate pattern (R-600).
#
# WHY THIS EXISTS: arc status used to live in hand-maintained markdown
# (`.harness/r-fs-1-arc-and-unit-map.md` §5) that the dashboard PARSED — and it
# drifted (the §5 table lagged #671; `test_dashboard_generate.py` hardcoded counts
# that went stale = R-IF-114). The ~15 registered-forward arcs were invisible
# entirely (they lived only in spine-ledger prose). This file is the ONE
# structured source: `tools/arc_ledger.py` derives every count + view from it,
# `generate.py` renders the dashboard from that derivation, and
# `tools/arc_ledger.py --check` is a blocking CI gate so an impossible/stale tally
# is a CI failure, never a months-later discovery.
#
# ─────────────────────────────────────────────────────────────────────────────
# ONE SCHEMA, THREE UNIT SHAPES:
#   kind: frozen      → the 11-arc build order (B1..M); each carries its REAL
#                       as-built `units` (id/what/pr/leg; id:null for
#                       contract-extender slices like B4/CA that minted no U-*).
#                       position 1..11; status: closed.
#   kind: standalone  → arcs that surfaced DURING implementation. status one of:
#     closed     — built + merged (own PR). Contract-extenders: `pr` + `spec_delta`
#                  ARE the deliverable; `units: []` (no U-* minted).
#     gated      — build-authorized, blocked on `depends_on`.
#     resolved   — built inside the frozen order OR foreclosed N/A; `resolution:`.
#     registered — forward; NOT yet built. REQUIRES `decompose_at_open: true` +
#                  `parent_arc` + `anticipated_scope`; `units: []` and ZERO U-* ids
#                  (real units are decomposed only when the arc opens + grounds —
#                  the presence-not-correctness discipline; do NOT fabricate units).
#
# PROSE HOME: rich rationale stays in `.harness/beyond-mvp-capability-boundary-ledger.md`
# (the spine ledger). Each standalone row carries a one-line `gives`/`anticipated_scope`
# + a `ledger_ref` back-link — no prose is duplicated into this file.
#
# FORWARD-ONLY: a real transit (arc closes/resolves, or a new arc/unit surfaces)
# edits the row AND bumps the `snapshot:` block in the SAME commit. The snapshot
# pin is the guard against a silent status flip that every structural check passes.
#
# BASE: this ledger is canonical against `origin/main`. B-L2-FALLBACK-COMPOSITION
# landed at PR #675 (status `closed`); its follow-on B-L2-ROUTING-SPAN-LAYER-ATTRIBUTION
# is `registered` (the observability layer-attribution fidelity gap it surfaced).
# ─────────────────────────────────────────────────────────────────────────────

