    resolution: "RESOLVED-AS-HOLLOW (PR #705; runtime spec v1.74 §14.21.7/§14.21.5 prose correction; advisor-confirmed body-read). Recording inter-step output for the 3 CONCURRENT non-linear strategies (ORCHESTRATOR_WORKERS, PARALLELIZATION, HIERARCHICAL_DELEGATION) has NO non-vacuous consumer under the cleared C-CP-25 §25.11/§25.12 deterministic-fold semantics: the concurrent executors compose via DETERMINISTIC folds (_aggregate_orchestrator_workers / _aggregate_parallelization) that receive branch_outputs DIRECTLY, not from the channel, and topology is per-workflow so the fold output is the terminal RunResult — there is NO post-join LLM read and NO subsequent linear step to read most_recent_output(). The aggregate fold docstring states it verbatim: 'there is NO second compose dispatch (that would need the deferred inter-step DATA flow, B-INTERSTEP)'. So channel recording would fail the §14.21.5-invariant-6 non-vacuity bar (a HOLLOW carrier, [[r-cxa-seam-wiring-is-producer-discovery]]). The v1.59 '(orchestrator synthesis post-join) … channel composes once recording lands' framing was a spec-prose-vs-impl drift, corrected at v1.74. The DECENTRALIZED_HANDOFF case it once enumerated already closed at B-INTERSTEP-HANDOFF (#677). The GENUINE capability — a post-join LLM synthesis step reading sibling outputs — makes the fan-out output non-deterministic, contradicting §25.12 → a committed-decision sacrifice → an OPERATOR GATE, registered as the new B-POSTJOIN-LLM-SYNTHESIS arc (NOT a silent build; X-AL-3). Two excavated NON-HOLLOW micro-options were rejected as over-excavation: Option A (record the fan-out aggregate for a subsequent linear step) has no consumer under per-workflow topology (the parent-linear SUB_AGENT_DISPATCH case is already covered by the v1.59 linear recording); only Option B (= B-POSTJOIN-LLM-SYNTHESIS) is the real, gated capability."
    ledger_ref: ".harness/beyond-mvp-capability-boundary-ledger.md"

