    gives: "The resume-side RESOLUTION of the §26.2 EFFECT_FENCE_AMBIGUOUS pause #702 opened (the CAPTURE shipped INERT; a naive api.resume re-paused identically). The fence raises the ambiguous pause to ASK the operator 'did the effect fire?'; the three resolutions are the operator ANSWERING with ground-truth the harness lacks — SKIP_AS_FIRED='it fired' (proceed with empty output, never re-fire); RE_FIRE='it did NOT fire' (clear_claim + re-dispatch fresh, a first-and-only execution); ABORT='can't tell' (FAILED). RE_FIRE COMPLETES the at-most-once decision the harness couldn't compute, NOT breaches it (a mis-assertion is operator-error responsibility, the #700 idempotent-mis-declaration posture); the palette composes only committed primitives → §13.4 (a) → NO operator gate, NO council. Mechanism (all additive): RuntimeEffectFence.clear_claim (inverse of try_reserve, missing-ok); ResumeContextHolder.peek (non-consuming, HITL one-shot intact); dispatcher key-bound three-branch resolution (apply ONLY when recomputed key == directive key); driver populates effect_fence_resume from the runtime error's idempotency_key + peeks the holder (gated on the carrier) + key-binds + threads the directive onto the RESUMED linear step only; ABORT → EffectFenceAbortedError → generic FAILED (not transient → retry-breaker re-raises verbatim). No new fail-class/§5.2-hash/StepDispatcher-Protocol-widening/CXA edge (the effect_fence_resume carrier rides the PauseSnapshot snapshot_hash, the directive is hash-inert on StepExecutionContext). Witnesses: dispatcher RE_FIRE-fires-fresh + clear_claim-removed-the-real-claim-file + SKIP-empty-no-refire + ABORT-raises + key-mismatch-ignored + clear_claim file-level unit; driver carrier-population + hash-integrity + ABORT→FAILED + full-chain directive-threading producer (peek-not-consume, key-bound, resumed-step-only). pyright 0/0/0; harness-cp 1171+1xfail; harness-runtime non-e2e 2031+. Bundled-absorption (runtime spec v1.73 + CP spec v1.52 + 2 clearance markers). advisor (2 passes — the BUILD-not-gate reframe + the key-bound/consume-once + clear_claim/ABORT-claim witnesses) + out-of-family Codex. The §14.22 effect-fence family is now COMPLETE through the operator-recoverability story (DURABLE-AUTO + PER-TOOL + HITL-ROUTE + PAUSE-RESOLUTION)."
