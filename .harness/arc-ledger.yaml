    gives: "The §14.22 C-RT-31 effect fence's lost-reserve re-dispatch no longer uniformly fail-closes; it SPLITS on a newly-captured output — present → suppress-and-continue (return the captured output, NEVER re-fire) the deliverable; absent/corrupt → raise EffectFenceAmbiguousUncommittedError → the driver routes to a §26.2 WorkflowPauseReason.EFFECT_FENCE_AMBIGUOUS PAUSE (bound PauseResumeProtocol) else FAILED. NEVER an auto-re-fire (the #701 decline-mirror invariant: auto-proceed only on proof-of-completion). The crux (advisor): 'the prior output' was never persisted — B-ENGINE-OUTPUT-REPLAY can't supply it (digest-only + resume_at-driven, ignores the suppressed step's own output) → the fence adds its OWN atomic post-fire capture_output/read_output (present ⟹ complete-and-valid; corrupt → PAUSE). Pause-reason home CORRECTED §22.1 → §26.2 (advisor + primary source: the driver-routed capture_pause_snapshot path is WorkflowPauseReason-typed; the §22.1 PauseReason is the engine-native substrate the driver never calls — the HITL_PENDING-not-HITL_INVOCATION_PENDING precedent). SCOPE (Codex [P2]×2, advisor-reconciled (B) partial-land): ships suppress-and-continue + the ambiguous-pause CAPTURE (labeled, non-terminal, hash-valid — strictly better than the v1.60 terminal FAILED); the resume-side RESOLUTION (skip-as-fired/re-fire/abort, safety-sensitive) is the registered follow-on B-EFFECT-FENCE-PAUSE-RESOLUTION — a naive resume re-pauses identically until it lands (INERT — resume is caller-initiated). Codex also caught the suppress path skipping sandbox.exit (enter-without-exit) → FIXED + span-test. Witnesses: dispatcher suppress + ambiguous-absent + ambiguous-corrupt + durable-restart + suppress-path sandbox.exit; driver PAUSED(bound)/FAILED(unbound) + CP→IS PAUSE_CAPTURED (event_kind_index=3) + interim re-pause; retry-breaker verbatim re-raise; 6-class cardinality. No new fail-class/§5.2-hash/Protocol-widening/CXA edge. pyright 0/0/0; harness-runtime non-e2e 2031 + harness-cp 1169+1xfail + od 950 + cxa 28. advisor (the §22.1→§26.2 correction + the crux + the untested-emission catch + (B) partial-land) + out-of-family Codex (2 rounds, both [P2] reconciled)."
