et-dispatched≠effect-free + the orchestrator false-negative catch + the PAUSE probe-resolution + the Codex-[P1] reconcile narrowing the lift to complete-recovery) + §25.15 probe (impl-to-cleared-spec, no council) + out-of-family Codex (the [P1] dispatch-before-capture catch)."
