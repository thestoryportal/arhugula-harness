# Local orchestrator-workers fan-out with an LLM post-join synthesis; run with
# examples/ollama.local.toml.example copied as harness.toml PLUS the research path
# bindings in examples/README.md.
#
# steps[0] is the orchestrator and runs first. steps[1] and steps[2] are workers that
# the driver fans out concurrently once the orchestrator has finished, each under its
# own role (its step_id). The terminal post-join-synthesis step runs after the barrier
# and receives the two worker outputs, in branch order, appended after its own
# instruction.
#
# Current limits, stated rather than hidden: the worker set is the declared steps,
# not chosen at run time, and workers do NOT receive the orchestrator's output, so
# the orchestrator runs and is recorded as its own step but does not steer the
# workers. The synthesis sees worker outputs only. Only local Ollama is
# bound; the fallback chain is empty, so no hosted provider can be reached.
version = 1

[workflow]
workflow_id = "example-ollama-orchestrator-workers"
workload_class = "research"
persona_tier = "solo-developer"
engine_class = "pure-pattern-no-engine"
topology_pattern = "orchestrator-workers"
layer_budgets = []
hitl_placements = []
per_step_overrides = {}
fallback_chain = { primary = { provider = "ollama", model = "llama3.2:3b", family = "local_open_weight" }, same_family = [], cross_family = [] }

[default_model_binding]
provider = "ollama"
model = "llama3.2:3b"

[[steps]]
step_id = "lead-plan"
step_kind = "inference-step"

[steps.step_payload]
messages = [{ role = "user", content = "In one short sentence, state the question this brief on running language models locally will answer." }]
tools = []
params = { options = { num_predict = 32 } }

[[steps]]
step_id = "worker-benefits"
step_kind = "inference-step"

[steps.step_payload]
messages = [{ role = "user", content = "In one short sentence, name the main benefit of running a language model locally." }]
tools = []
params = { options = { num_predict = 32 } }

[[steps]]
step_id = "worker-costs"
step_kind = "inference-step"

[steps.step_payload]
messages = [{ role = "user", content = "In one short sentence, name the main cost of running a language model locally." }]
tools = []
params = { options = { num_predict = 32 } }

# The synthesis payload carries no tools: the step is read-only, and any tool binding
# is rejected before dispatch.
[[steps]]
step_id = "synthesize-brief"
step_kind = "post-join-synthesis"

[steps.step_payload]
messages = [{ role = "user", content = "Combine the worker findings listed below into a two-sentence brief that weighs the benefit against the cost." }]
params = { options = { num_predict = 64 } }
