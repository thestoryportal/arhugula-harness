<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Auto Smoke Fixture</title>
  <style>
    :root { --ink: #1a1a1a; --paper: #faf7f0; --accent: #c8102e; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--paper); color: var(--ink); }
    .wrap { max-width: 720px; margin: 0 auto; padding: 4rem 1.5rem; }
    .hero-title { font-size: 3rem; line-height: 1.05; margin: 0 0 1rem; }
    .lede { font-size: 1.25rem; color: #555; margin: 0 0 2rem; max-width: 50ch; }
    .cta { display: inline-block; padding: 0.75rem 1.5rem; background: var(--accent); color: white; border-radius: 4px; text-decoration: none; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1 id="hero" class="hero-title">Autonomous live mode</h1>
    <p id="lede" class="lede">A standalone fixture with a hero, a lede, and a call to action — three identifiable elements for the orchestrator to drive.</p>
    <a id="cta" class="cta" href="#">Get started</a>
  </main>
</body>
</html>
