name: arhugula-r420-self-hosted-local

services:
  tempo:
    image: ${R420_TEMPO_IMAGE:-grafana/tempo:2.10.0}
    command:
      - -config.file=/etc/tempo.yaml
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:${R420_PORT_TEMPO:-3200}:3200"
    expose:
      - "4317"
      - "4318"

  otel-collector:
    image: ${R420_OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.153.0}
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:${R420_PORT_OTEL_GRPC:-4317}:4317"
      - "127.0.0.1:${R420_PORT_OTEL_HTTP:-4318}:4318"
    depends_on:
      tempo:
        condition: service_started

  grafana:
    image: ${R420_GRAFANA_IMAGE:-grafana/grafana:12.2.0}
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # [LAW:effects-at-boundaries] Grafana reads the operator-owned Compose secret at startup.
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${R420_PORT_GRAFANA:-3000}:3000"
    secrets:
      - grafana_admin_password
    depends_on:
      tempo:
        condition: service_started

# [LAW:no-silent-failure] Refuse an unset password-file path before any stack command resolves.
secrets:
  grafana_admin_password:
    file: ${R420_GRAFANA_ADMIN_PASSWORD_FILE:?Set R420_GRAFANA_ADMIN_PASSWORD_FILE to the private admin password file}

volumes:
  grafana-data:
  tempo-data:
