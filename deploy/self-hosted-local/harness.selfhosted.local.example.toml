# R-420 SELF_HOSTED_SERVER runtime template.
#
# Copy to `harness.selfhosted.local.toml` at the workspace root and replace
# `/absolute/path/to/arhugula-v2` with the actual root path. Do not commit the
# copied local file if it contains machine-specific paths.

[runtime]
deployment_surface = "self-hosted-server"
repository_root = "/absolute/path/to/arhugula-v2"
default_topology = "single-threaded-linear"

# Keep hosted providers optional for the no-paid local live e2e. The live
# workflow binds to local Ollama and does not invoke hosted-provider inference.
anthropic_optional = true
openai_optional = true
ollama_optional = false
ollama_host = "http://127.0.0.1:11434"

[runtime.provider_secrets]
backend = "self-hosted-keyring"
keyring_service = "harness"

[[runtime.provider_secrets.operator_allowlist]]
name = "r420_probe_key"
scope = { name = "r420-live" }

[runtime.otel]
# Runtime currently uses the OTLP gRPC exporter; the local collector exposes
# gRPC on 4317 and HTTP on 4318.
otlp_endpoint = "http://127.0.0.1:4317"

[runtime.collector]
placement = "SELF_HOSTED_BACKEND_COLLECTOR"

[[runtime.path_bindings.raw_entries]]
path_class = "SKILLS"
workflow_class = "pipeline-automation"
deployment_surface = "self-hosted-server"
path = "/absolute/path/to/arhugula-v2/.agents/skills"

[[runtime.path_bindings.raw_entries]]
path_class = "PROMPTS"
workflow_class = "pipeline-automation"
deployment_surface = "self-hosted-server"
path = "/absolute/path/to/arhugula-v2/prompts"

[[runtime.path_bindings.raw_entries]]
path_class = "ROUTING_MANIFEST"
workflow_class = "pipeline-automation"
deployment_surface = "self-hosted-server"
path = "/absolute/path/to/arhugula-v2/routing_manifest"

# STATE_LEDGER resolves to a DIRECTORY, not a file: bootstrap stage 1
# `materialize_path_registry` runs `Path.mkdir(parents=True, exist_ok=True)` on
# the resolved path, and the ledger itself lands at `<dir>/state.jsonl`. Binding
# a file path (for example the repo's real `.harness/state.jsonl`) aborts the
# run with `FileExistsError` before any ledger logic. This throwaway scratch
# directory gives the smoke run a clean genesis chain; delete it when done.
[[runtime.path_bindings.raw_entries]]
path_class = "STATE_LEDGER"
workflow_class = "pipeline-automation"
deployment_surface = "self-hosted-server"
path = "/absolute/path/to/arhugula-v2/.harness/r420-scratch"

[[runtime.path_bindings.raw_entries]]
path_class = "SKILLS"
workflow_class = "software-engineering"
deployment_surface = "self-hosted-server"
path = "/absolute/path/to/arhugula-v2/.agents/skills"

[[runtime.path_bindings.raw_entries]]
path_class = "PROMPTS"
workflow_class = "software-engineering"
deployment_surface = "self-hosted-server"
path = "/absolute/path/to/arhugula-v2/prompts"

[[runtime.path_bindings.raw_entries]]
path_class = "ROUTING_MANIFEST"
workflow_class = "software-engineering"
deployment_surface = "self-hosted-server"
path = "/absolute/path/to/arhugula-v2/routing_manifest"

# STATE_LEDGER is a DIRECTORY (see the pipeline-automation row above); the
# ledger lands at `<dir>/state.jsonl`.
[[runtime.path_bindings.raw_entries]]
path_class = "STATE_LEDGER"
workflow_class = "software-engineering"
deployment_surface = "self-hosted-server"
path = "/absolute/path/to/arhugula-v2/.harness/r420-scratch"

[[runtime.mcp_clients]]
client_name = "r420-echo"
transport = "stdio"
trust_level = "L1_SIGNED_PINNED"
blast_radius = "READ_ONLY"
connection_url = "stdio://uv run python /absolute/path/to/arhugula-v2/deploy/self-hosted-local/mcp_echo_server.py"
default_minimum_tier = "tier-1-process"
default_blast_radius = "READ_ONLY"
default_sandbox_tier = "tier-1-process"
default_sandbox_tech = "host-process"
default_sandbox_provider = "host"

# --- Tier-3 execution driver (REQUIRED for the stdio echo server above) -------
#
# The `default_*` tier keys above are a FLOOR REQUEST, not the resolved tier.
# C-AS-02 §2.3 row 3 floors ANY stdio MCP transport at TIER_3_MICROVM
# (`harness-as/src/harness_as/sandbox_tier_floor.py`: `if mcp_transport is
# MCPTransport.STDIO: return _resolved(_tier_max(SandboxTier.TIER_3_MICROVM,
# floor))`), regardless of the per-client `tier-1-process` declared above. So
# `r420-echo` resolves to tier-3 and needs a tier-3 execution driver; without
# one, `just r420-self-hosted-live-e2e` aborts at dispatch with
# `SandboxDriverUnavailableError: resolved tier 'tier-3-microvm'`.
#
# Uncomment and adapt the block below. gVisor (`runsc`) is Linux-only and is
# never available on a macOS host directly, so the driver must reach a Linux
# daemon with `runsc` registered. Lima is one provisioning option — the same VM
# the R-411 gVisor smoke uses (see
# `.harness/release-candidate-deployment-readiness-runbook.md` §4 and the
# `R411_GVISOR_DOCKER_COMMAND` recipe); any Docker-compatible daemon with a
# tier-3 runtime works.
#
# `docker_binary` is exec'd as argv[0] with NO shell, so a multi-word remote
# invocation must be wrapped in a single executable script, e.g.
#
#   #!/bin/sh
#   exec env LIMA_HOME=/path/to/lima-home limactl shell <vm> sudo docker "$@"
#
# `command` receives the MCP request JSON on stdin and must write MCP-shaped
# JSON to stdout. Echo back the real argument (as below) rather than a
# constant — a constant makes the e2e pass without proving transit.
#
# [runtime.mcp_clients.sandbox_driver]
# image = "alpine:3.20"                                    # must be pre-pulled inside the VM
# command = [
#   "sh",
#   "-c",
#   'v=$(sed -n "s/.*\"value\"[[:space:]]*:[[:space:]]*\"\([^\"]*\)\".*/\1/p" | head -n 1); printf "{\"content\":[{\"type\":\"text\",\"text\":\"%s\"}],\"isError\":false}" "$v"',
# ]
# docker_binary = "/absolute/path/to/gvisor-docker.sh"     # the wrapper script above
# network = "none"

[runtime.routing_manifest]
manifest_version = 1
per_role_bindings = {}
per_workload_overrides = {}
retry_policies = {}
fallback_chains = [
  { primary = { provider = "ollama", model = "llama3.2:3b", family = "local_open_weight" }, same_family = [], cross_family = [] },
]
