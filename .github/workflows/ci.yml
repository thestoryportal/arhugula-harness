  gate-log-consistency:
    # B-230 Task 1 — the fast path above skips pytest (which runs
    # tools/test_merge_gate_log.py through codex-parity-check.sh) on exactly the commits
    # that append gate rows, and no other job ran the C-HE-23 §2 JSONL↔Markdown
    # consistency reducer. `check` exits 1 on a Markdown verdict row with no JSONL
    # authority row (its hard condition); an orphan JSONL row is the contract's WARN
    # class and reconciles on the next gate run, which is why the classifier refuses the
    # fast path for a JSONL change without its Markdown sibling (codex r1 P2).
    # Unconditional (no `needs`, no `if`). merge_gate_log.py is NOT stdlib-only —
    # its siblings finding_record + review_wrapper_common import the declared jsonschema
    # dependency — so this job installs the project like the light `lint` job does; a
    # bare python3 invocation would fail at import on a clean runner.
    runs-on: ubuntu-latest
    name: merge-gate log consistency (C-HE-23 §2 reducer) — blocking
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv + Python 3.12
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync workspace (all members)
        run: uv sync --all-packages

      - name: JSONL ↔ Markdown gate-log consistency (mismatch = CI failure)
        run: uv run python tools/merge_gate_log.py check

  codex-context-guard:
    # R-600-codex-context-guard — Codex-side context-rot gate. The guard is stdlib-only
    # so the runtime check uses /usr/bin/python3; pytest still runs under uv for the
    # repo's pinned Python/test environment. Hard failures include root-checkout edits,
    # design+implementation mixing, and default-branch roadmap_status.md drift.
    runs-on: ubuntu-latest
    name: Codex context guard (anti-rot gate) — blocking
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # FULL history (not the default shallow depth-1). The guard's `--base-ref`
          # diff AND `_lag_expected()` (which runs `git show --name-only HEAD` to confirm
          # a refresh-tip changed ONLY roadmap_status.md) both need HEAD's PARENT
          # present. On a depth-1 clone the shallow boundary makes `git show HEAD` list the
          # ENTIRE tree (parentless root-commit diff), so `_lag_expected` is always False
          # and EVERY `ops: roadmap status refresh ` push to main HARD-failed
          # ROADMAP_STATUS_DRIFT (the §12.2.1 lag the session-start hook correctly
          # tolerates). Mirrors the `lint` job's fetch-depth: 0.
          fetch-depth: 0

      - name: Install uv + Python 3.12
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Codex context guard runtime check
        run: >
          /usr/bin/python3 tools/codex_context_guard.py check
          --base-ref "${{ github.event.pull_request.base.sha || github.event.before }}"
          --head-ref "${{ github.event.pull_request.head.sha || github.sha }}"
          --allow-roadmap-drift

      - name: Codex context guard tests
        run: uv run python -m pytest tools/test_codex_context_guard.py -q

  split-brain:
    # U-HE-33 / C-HE-12 §2 — SPLIT_BRAIN_LEDGER CI backstop: one arc row per `arc_id`
    # in the metrics ledger (C-HE-25). The plan sketched this job gated to pushes on
    # main; as built it runs on PRs too — `main_protection.blocking_contexts()` derives
    # required PR contexts from every job name ending "— blocking" regardless of `if:`,
    # so a push-only blocking job would be a required context that never reports on PR
    # heads and would block every merge. Running on both venues is a strict superset of
    # the spec's "every push to main" floor and catches a duplicate at the PR that
    # introduces it. A kind-less row predates `record_kind` and IS an arc row (mirrors
    # check_split_brain). The `jq empty` line makes a corrupt ledger fail loud — the
    # default runner shell has no pipefail, so a jq parse error inside the pipeline
    # would otherwise read as "no duplicates". The C-HE-12 emit-not-just-gate contract
    # binds the SPEC'd venue (every push to main), where the codex-context-guard job's
    # check mode dispatches the emitting detections; this PR-venue run is a pure
    # superset GATE added for main_protection compatibility, not an emission venue
    # (adjudicated codex r13).
    name: split-brain ledger backstop — blocking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: one arc row per arc_id
        # `shell: bash` gives -eo pipefail (the default runner shell has neither), so a
        # jq error INSIDE the pipeline fails the job; the all-objects check refuses
        # valid-JSON non-object rows that would otherwise error mid-select and be
        # swallowed (codex r19 P2).
        shell: bash
        run: |
          jq empty .harness/arc-metrics.jsonl
          jq -se 'all(.[]; type=="object")' .harness/arc-metrics.jsonl > /dev/null
          dups=$(jq -r 'select(.record_kind=="arc" or (.record_kind|not)) | .arc_id' .harness/arc-metrics.jsonl | sort | uniq -d)
          [ -z "$dups" ] || { echo "SPLIT_BRAIN_LEDGER: $dups"; exit 1; }

  clearance-corpus:
    # R-CTX-1 / U-CTX-10 — the clearance-marker frontmatter gate. `.harness/clearance/*.md`
    # markers are the version-binding half of the X-AL-3 enforcement triad (root CLAUDE.md
    # §4.5), and 70 of them were unparseable YAML at the arc's grounding sweep (an unquoted
    # `: ` inside a prose scalar) while a further ~100 carried a whitespace-`#` value that
    # parses and then SILENTLY truncates. This job is fail-closed: every marker must parse
    # to a mapping with `artifact` + `version` and carry no lossy scalar, and the ONLY
    # exemptions are the rows explicitly enumerated in
    # `.harness/clearance/parse-manifest.md` — an unlisted unparseable file is an ERROR,
    # never a skip. pyyaml comes from harness-runtime via the all-packages sync; the
    # tools/ test module lives outside the 7 testpaths packages, so the blocking `test` job
    # does not collect it and this job is its home.
    runs-on: ubuntu-latest
    name: clearance corpus (frontmatter gate) — blocking
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv + Python 3.12
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync workspace (all members; provides pyyaml via harness-runtime)
        run: uv sync --all-packages

      - name: Clearance frontmatter parse gate (unparseable + unlisted = failure)
        run: uv run python tools/clearance_frontmatter.py --check

      - name: Clearance frontmatter tests (fail-closed + quote-only repair contract)
        working-directory: tools
        run: uv run python -m pytest test_clearance_frontmatter.py -q

      - name: Artifact heads — generated table equals the committed one
        run: uv run python tools/artifact_heads.py --check

      - name: Artifact heads — marker completeness (every family resolves a head)
        run: uv run python tools/artifact_heads.py --check-completeness

      - name: Artifact heads tests (fail-closed + family normalization + version sort)
        working-directory: tools
        run: uv run python -m pytest test_artifact_heads.py -q
