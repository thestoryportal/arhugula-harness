name: CI

# R-200-ci-pytest-pyright-ruff-matrix — the first substantive CI job for the
# H_T workspace. Runs the same trio the `just check` recipe runs locally
# (ruff lint + pyright strict + pytest) across the uv workspace at every PR
# and on push to main. The X-AL-3 guard (design-substrate back-flow check)
# remains a separate, path-scoped workflow.
#
# Authority: Project_Roadmap_v1.md §5.4 R-200-ci-pytest-pyright-ruff-matrix;
#            CLAUDE.md §3.1 committed stack (Python 3.12+ / uv / pyright strict /
#            ruff / pytest). Tool config lives in the root pyproject.toml
#            ([tool.ruff], [tool.pyright], [tool.pytest.ini_options]).
#
# v1 enforcement posture (IMPORTANT — read before tightening):
#   - pytest IS blocking. `uv run pytest -m "not e2e"` is green tree-wide
#     (3543 passed / 7 skipped as of the R-200 authoring commit).
#   - ruff IS blocking (flipped at R-200-ci-lint-typecheck-blocking). The tree
#     is clean tree-wide under `uv run ruff check .` AND `uv run ruff format
#     --check .` (0 findings). The mechanical sweep (PR #155) + F821 real-defect
#     fixes (PR #157) + this PR's src fixes + test-legitimate per-file-ignores
#     (root pyproject [tool.ruff.lint.per-file-ignores]) drove the residual to 0.
#   - pyright IS blocking (flipped at R-200-ci-lint-typecheck-blocking pyright
#     half). The tree is clean tree-wide under `uv run pyright` (0 errors). The
#     drive-clean pass: test modules scoped-relaxed via
#     [tool.pyright.executionEnvironments] (one entry per harness-*/tests — the
#     analog to the lint half's per-file-ignores); src driven to 0 by real fixes
#     (incl. the genuine two-`Skill`-class bug at types.py — the empty `Skill`
#     Protocol stub was re-exported as the concrete `lifecycle.skills.Skill`) +
#     the `streamablehttp_client` → `streamable_http_client` mcp deprecation
#     rename + targeted narrowing/casts + a handful of documented library-boundary
#     ignores. 3543 passed / 0 regression. New findings fail the PR.
#   - Every setup `uv sync` (here and in pr-metadata.yml) passes `--locked` (WS-10
#     §12.4): CI tests the committed uv.lock, so a manifest dependency that was never
#     re-locked fails setup instead of being re-locked and passing against a lock
#     nobody committed. [LAW:no-silent-failure]

on:
  pull_request:
    # WO-U10 (WS-10 §12.3) staged activation (WT-14 bootstrap): `edited` stays until main's
    # fence requires the `PR title shape (metadata gate) — blocking` context, because until
    # then a retitle is checked only by this run's required arc-ledger job. The activation
    # commit then drops `edited`: metadata edits run .github/workflows/pr-metadata.yml under
    # its own group and check name, so a body edit never restarts or cancels this run.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  # A retargeted base invalidates the old binding even when the head is unchanged. The
  # integration observer dispatches this workflow on the PR branch with exactly these
  # inputs; the `changes` job proves them equal to the live PR before anything runs.
  workflow_dispatch:
    inputs:
      pr_number:
        description: Same-repository open PR number
        required: true
      expected_head:
        description: Full PR head SHA the dispatcher observed
        required: true
      expected_base:
        description: Full PR base SHA the dispatcher observed
        required: true

# Cancel superseded runs on the same ref so a fast push series doesn't queue -- EXCEPT on
# `main`, where the group is keyed by SHA: the merge door (C-HE-06 §4(vii)) holds its lease
# until the merge commit's OWN post-merge run is `success`, and lane B's landing must not
# cancel lane A's run. Tradeoff (stated): cancel-in-progress is effectively off for main
# pushes; under N-lane cadence full runs can queue -- the door emits a NOTIFY when > 2 are
# in progress.
#
# WO-U10: PR runs (pull_request and retarget dispatch alike) group by PR number, so a newer
# head or base supersedes only that PR's older code run; main groups by landed SHA and
# never cancels, so every landing keeps its own run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  changes:
    # B-230 Task 1 — the CI bookkeeping fast path. Two of the five CI runs per landed
    # unit verify a diff that is only `.harness/roadmap_status.md` (the terminating
    # refresh PR and its merge push onto main); this job classifies the diff so the five
    # heavy jobs below (`needs: changes`) skip on exactly those. A skipped job still
    # reports Success to branch protection (GitHub docs, "Using conditions to control
    # job execution"), so every required context keeps reporting — a workflow-level
    # `paths:` filter would leave them "Expected" and block the merge, which is why the
    # gate is a job-level `if:`. Every gated job's `if:` carries `always()`: a failing
    # classifier leaves this output EMPTY and every heavy job runs; without it a broken
    # classifier would mark them `skipped` = Success and pytest would vanish from a
    # mergeable PR. Stdlib-only under the runner's python3 with no uv setup — this job
    # sits on every full run's critical path. The checkout SHA is the pin every other
    # job uses: this job decides whether five checks run, so a movable tag is a bypass.
    name: classify diff (bookkeeping fast path)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # verify-dispatch reads the live PR
    outputs:
      bookkeeping: ${{ steps.classify.outputs.bookkeeping }}
      # [LAW:one-source-of-truth] the ONE binding every job below checks out and reports:
      # head/base under review and the commit actually tested (WS-10 §12.4).
      head: ${{ steps.bind.outputs.head }}
      base: ${{ steps.bind.outputs.base }}
      tested: ${{ steps.bind.outputs.tested }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Both SHAs must be present: base...head is the PR's own changes (merge-base
          # to head), so a base that moved since branching never widens the diff.
          fetch-depth: 0

      - name: Bind head/base/tested commit (WO-U10 exact CI binding)
        id: bind
        # Fails without publishing a binding when the tested commit is not exactly what
        # the event claims: a PR run must test the merge of head onto base, a main run the
        # landed SHA, and a dispatch must name the live same-repository PR's head/base.
        # The binding notice itself is published after classification (below).
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          IN_PR: ${{ inputs.pr_number }}
          IN_HEAD: ${{ inputs.expected_head }}
          IN_BASE: ${{ inputs.expected_base }}
        run: |
          case "$EVENT" in
            workflow_dispatch)
              /usr/bin/python3 tools/ci_result_binding.py verify-dispatch --repository "$REPO" \
                --pr-number "$IN_PR" --expected-head "$IN_HEAD" --expected-base "$IN_BASE"
              git fetch --no-tags origin "+refs/pull/$IN_PR/merge:refs/ci/tested"
              git checkout --detach refs/ci/tested
              head="$IN_HEAD" base="$IN_BASE" want="$IN_BASE $IN_HEAD" ;;
            pull_request) head="$PR_HEAD" base="$PR_BASE" want="$PR_BASE $PR_HEAD" ;;
            push) head="$GITHUB_SHA" base="$BEFORE" want="" ;;
            *) echo "ci-binding: unsupported event $EVENT" >&2; exit 2 ;;
          esac
          tested="$(git rev-parse HEAD)"
          parents="$(git rev-list --parents -n 1 HEAD | cut -s -d' ' -f2-)"
          if [ "$EVENT" = push ] && [ "$tested" != "$head" ]; then
            echo "ci-binding: tested $tested is not the landed $head" >&2; exit 1
          elif [ "$EVENT" != push ] && [ "$parents" != "$want" ]; then
            echo "ci-binding: tested parents '$parents' != base/head '$want'" >&2; exit 1
          fi
          printf 'head=%s\nbase=%s\ntested=%s\nparents=%s\n' "$head" "$base" "$tested" "$parents" | tee -a "$GITHUB_OUTPUT"

      - name: Classify base...head
        id: classify
        # `shell: bash` gives pipefail, so the classifier's exit 2 (unresolvable range;
        # an empty diff is classified, bookkeeping=false) fails the step through the tee;
        # on that path the script writes nothing to stdout, so no partial line reaches
        # $GITHUB_OUTPUT. Same base/head expression as the codex-context-guard job.
        #
        # Self-guard first (codex r1 P1 on b-230-task-1): the classifier executes from
        # the PR head, so a diff that changes the classifier or this workflow may not be
        # judged by it — a regression that prints `bookkeeping=true` would skip the very
        # pytest job that tests it. Those diffs are `bookkeeping=false` by fiat, decided
        # here in the step; for every other diff the head classifier is byte-identical
        # to the base classifier, so running from head IS running from base.
        shell: bash
        env:
          BASE: ${{ steps.bind.outputs.base }}
          HEAD: ${{ steps.bind.outputs.head }}
        run: |
          self_changed="$(git diff --name-only --no-renames "$BASE...$HEAD" -- tools/ci_bookkeeping_diff.py .github/workflows/ci.yml)"
          if [ -n "$self_changed" ]; then
            echo "self-guard: classifier/workflow changed on $BASE...$HEAD — full run" >&2
            echo "bookkeeping=false" | tee -a "$GITHUB_OUTPUT"
          else
            /usr/bin/python3 tools/ci_bookkeeping_diff.py "$BASE" "$HEAD" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Publish binding notice (WO-U10)
        # Runs even when classification failed, so the run still binds its inputs; an
        # empty `bookkeeping` then proves no classification and accepts no skip.
        # `workflow_blob` is the definition that actually executed - the workflow file at
        # github.workflow_sha (a dispatch runs the PR branch's file, not the merge tree's),
        # so tools/ci_result_binding.py can compare it with the merge tree's workflow.
        if: ${{ !cancelled() && steps.bind.outcome == 'success' }}
        shell: bash
        env:
          HEAD_SHA: ${{ steps.bind.outputs.head }}
          BASE_SHA: ${{ steps.bind.outputs.base }}
          TESTED: ${{ steps.bind.outputs.tested }}
          PARENTS: ${{ steps.bind.outputs.parents }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          BOOKKEEPING: ${{ steps.classify.outputs.bookkeeping }}
        run: |
          git cat-file -e "$WORKFLOW_SHA^{commit}" || git fetch --no-tags --depth=1 origin "$WORKFLOW_SHA"
          blob="$(git rev-parse "$WORKFLOW_SHA:.github/workflows/ci.yml")"
          plist="$(printf '"%s",' $PARENTS)"
          echo "::notice title=ci-binding::{\"head\": \"$HEAD_SHA\", \"base\": \"$BASE_SHA\", \"tested\": \"$TESTED\", \"parents\": [${plist%,}], \"workflow_sha\": \"$WORKFLOW_SHA\", \"workflow_blob\": \"$blob\", \"bookkeeping\": \"$BOOKKEEPING\"}"

  # WO-U09 (WS-10 §12.2) — the provider-free package suite and the codex-parity suite run
  # as two independent jobs after classification; neither waits for the other. The
  # required context `pytest (all axis packages) — blocking` is the `test` aggregate below,
  # which decides from both terminal results. Coverage comes from the one package-suite
  # run: the separate informational job that re-ran the whole suite is gone.
  package-tests:
    runs-on: ubuntu-latest
    name: package tests (all axis packages, with coverage)
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.bookkeeping != 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.changes.outputs.tested }}

      - name: Install uv + Python 3.12
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync workspace (all members)
        run: uv sync --locked --all-packages

      # Excludes the `e2e` marker — those tests exercise real external services
      # (Anthropic API etc.) and are gated on credentials not available in CI
      # per the marker definition in the root pyproject.toml. testpaths in
      # [tool.pytest.ini_options] cover all 7 workspace packages (the 5 axes +
      # harness-core + harness-runtime). Coverage config is the root pyproject
      # [tool.coverage.run]. This step's exit status is the package verdict; the
      # advisory steps after it cannot change it.
      - name: Pytest with coverage (excludes e2e)
        run: uv run pytest -m "not e2e" --cov --cov-report=term-missing --cov-report=xml --cov-report=json

      # R-200-ci-coverage-gating — post-pytest publication is advisory (no threshold).
      # The primary coverage-enabled pytest process above retains its blocking exit.
      # WS-10 §12.2/§12.4: coverage-provenance.json binds the artifact to the PR head, its
      # base and the tested (for a PR, synthetic merge) commit as distinct fields, plus
      # workflow/run/attempt, platform, lock digest and command. The job summary is
      # rendered from that same manifest.
      - name: Record coverage provenance and publish total to job summary
        id: coverage_provenance
        if: always()
        continue-on-error: true
        env:
          COVERAGE_HEAD: ${{ needs.changes.outputs.head }}
          COVERAGE_BASE: ${{ needs.changes.outputs.base }}
          COVERAGE_TESTED: ${{ needs.changes.outputs.tested }}
          COVERAGE_COMMAND: uv run pytest -m "not e2e" --cov --cov-report=term-missing --cov-report=xml --cov-report=json
        run: |
          uv run python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import hashlib, json, os, pathlib, platform

          # [LAW:effects-at-boundaries] Publish complete, persisted JSON atomically;
          # only its validation receipt authorizes the advisory artifact upload.
          def read_totals(path):
              if not path.exists():
                  return "missing", None, None
              try:
                  t = json.loads(path.read_text())["totals"]
                  return "valid", (t["percent_covered_display"], t["covered_lines"], t["num_statements"]), None
              except (ValueError, KeyError, TypeError) as exc:
                  return "malformed", None, repr(exc)

          json_state, totals, json_error = read_totals(pathlib.Path("coverage.json"))
          xml_state = "present" if pathlib.Path("coverage.xml").exists() else "missing"
          manifest = {
              "head": os.environ["COVERAGE_HEAD"],
              "base": os.environ["COVERAGE_BASE"],
              "tested_commit": os.environ["COVERAGE_TESTED"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "platform": f"{platform.system()}-{platform.machine()}",
              "uv_lock_sha256": hashlib.sha256(pathlib.Path("uv.lock").read_bytes()).hexdigest(),
              "command": os.environ["COVERAGE_COMMAND"],
              "coverage_xml": xml_state,
              "coverage_json": json_state,
              "coverage_json_error": json_error,
              "coverage_available": xml_state == "present" and json_state == "valid",
          }
          serialized = json.dumps(manifest, indent=2) + "\n"
          temporary = pathlib.Path(".coverage-provenance.json.tmp")
          temporary.write_text(serialized)
          if json.loads(temporary.read_text()) != manifest:
              raise ValueError("persisted coverage provenance differs from its inputs")
          temporary.replace("coverage-provenance.json")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("valid=true", file=output)
          print("### Coverage (informational — v1, no threshold)\n")
          print("```json\n" + json.dumps(manifest, indent=2) + "\n```\n")
          if manifest["coverage_available"]:
              percent, covered, statements = totals
              print(f"**Total line coverage: {percent}%** ({covered}/{statements} statements; "
                    "branch coverage enabled).\n")
              print("Threshold enforcement deferred (`fail_under`) until a baseline trend justifies it.")
          else:
              print(f"_Coverage unavailable: coverage.xml {xml_state}, coverage.json {json_state}"
                    " — see the pytest step._")
          PY

      - name: Upload coverage.xml artifact with its provenance
        # [LAW:parse-dont-validate] Consume the validated publication receipt.
        if: always() && steps.coverage_provenance.outputs.valid == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-xml-${{ needs.changes.outputs.head }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage.xml
            coverage-provenance.json
          if-no-files-found: warn

  parity-tests:
    runs-on: ubuntu-latest
    name: codex compatibility regressions (parity suite)
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.bookkeeping != 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.changes.outputs.tested }}
          # Stop-hook parity verifies terminating-refresh file shape against HEAD's parent.
          fetch-depth: 0

      - name: Install uv + Python 3.12
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync workspace (all members)
        run: uv sync --locked --all-packages

      # B-230 Task 3: tools/test_arc_close_recipe.py (run by codex-parity-check.sh below)
      # EXECUTES `just arc-close` against a PATH shim — a dry run cannot prove `$@`
      # forwarding — so the runner needs the binary. SHA-pinned like every action here.
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      # tools/hooks/test_lane_init.sh (run by codex-parity-check.sh below) pins a zsh-ONLY
      # regression: lane-init.sh is sourced, and ${BASH_SOURCE[0]} is bash-only. That suite
      # now FAILS when a required shell is absent rather than skipping it, because a skipped
      # shell reports the same exit status as a covered one. ubuntu-latest ships no zsh.
      - name: Install zsh (required by the lane-init portability suite)
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Codex compatibility regressions
        run: bash tools/codex-parity-check.sh

  test:
    # The required context. `always()` makes it report on every run, including when a
    # constituent failed, was canceled or was skipped; `needs:` makes it wait until both
    # are terminal, so pending is never read as success. tools/ci_aggregate.py holds the
    # WS-10 §12.2 truth table: only an enumerated row passes, everything else fails.
    # Stdlib-only under the runner's python3, like the `changes` job — no uv setup.
    runs-on: ubuntu-latest
    name: pytest (all axis packages) — blocking
    needs: [changes, package-tests, parity-tests]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.changes.outputs.tested }}

      - name: Aggregate classification, package and parity results
        env:
          CLASSIFIER_RESULT: ${{ needs.changes.result }}
          BOOKKEEPING: ${{ needs.changes.outputs.bookkeeping }}
          PACKAGE_RESULT: ${{ needs.package-tests.result }}
          PARITY_RESULT: ${{ needs.parity-tests.result }}
        run: /usr/bin/python3 tools/ci_aggregate.py

  lint:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    name: ruff (lint + format) — blocking
    # Blocking as of R-200-ci-lint-typecheck-blocking — the tree is ruff-clean
    # (check + format) tree-wide. New findings fail the PR. See header note.
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.changes.outputs.tested }}
          fetch-depth: 0

      - name: Install uv + Python 3.12
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync workspace (all members)
        run: uv sync --locked --all-packages

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    name: pyright (strict) — blocking
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.bookkeeping != 'true')
    # Blocking as of R-200-ci-lint-typecheck-blocking (pyright half) — the tree
    # is pyright-clean (0 errors) tree-wide. New findings fail the PR. See header
    # note for the drive-clean approach (test-dir executionEnvironments + src
    # fixes). Run locally exactly as here: `uv sync --locked --all-packages && uv run pyright`.
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.changes.outputs.tested }}

      - name: Install uv + Python 3.12
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync workspace (all members)
        run: uv sync --locked --all-packages

      - name: Pyright (strict; config at root pyproject [tool.pyright])
        run: uv run pyright

  axis-isolation:
    # R-200-ci-axis-matrix — per-axis test-isolation matrix. Each leg installs
    # ONLY one library package + its DECLARED workspace deps (`uv sync --package`
    # prunes the rest), then runs that package's own tests. A test (or src
    # module) that imports a sibling axis NOT in the package's declared
    # dependency set fails to import — surfacing cross-axis leaks that the
    # all-packages `test` job masks (everything is installed there, so an
    # undeclared sibling import still resolves).
    #
    # Test tooling (pytest, pytest-asyncio) lives in the ROOT [dependency-groups]
    # `dev` group, which `uv sync --package <member>` does not pull (groups are
    # project-scoped, and a member project declares no `dev` group). We layer it
    # in via `uv pip install` AFTER the isolated sync — neither package depends
    # on any harness axis, so the isolation is preserved.
    #
    # harness-runtime is intentionally omitted: it depends on every axis, so its
    # "isolation" is a full install == the blocking `test` job above.
    #
    # Enforcement posture (v1): all 6 legs (core / is / as / cp / od / cxa) are GREEN
    # in isolation and BLOCKING — a NEW cross-axis leak in any of them fails CI.
    # The `od` leg was ADVISORY through R-200-ci-axis-matrix because harness-od had
    # undeclared OD→CP + OD→IS consumer deps (src reads `ReplayDisposition` from
    # harness_cp.engine_namespace; tests import harness_cp + harness_is). Closed at
    # R-200-ci-od-cp-dependency-leak: harness-od now declares harness-cp (OD→CP,
    # canonical CXA §2.3.3) + harness-is (OD→IS, canonical CXA §2.3.4) — both
    # acyclic-safe. od leg verified green in isolation (887 passed). See
    # .harness/class_3_drift_od_cp_undeclared_dependency.md for the direction analysis.
    name: axis isolation — harness-${{ matrix.axis }}
    runs-on: ubuntu-latest
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.bookkeeping != 'true')
    strategy:
      fail-fast: false
      matrix:
        # Each root must be one of pyproject's `testpaths` (tools/test_ci_axis_roots.py).
        include:
          - { axis: core, test_root: harness-core/tests }
          - { axis: is, test_root: harness-is/tests }
          - { axis: as, test_root: harness-as/tests }
          - { axis: cp, test_root: harness-cp/cp_tests }
          - { axis: od, test_root: harness-od/tests }
          - { axis: cxa, test_root: harness-cxa/tests }
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.changes.outputs.tested }}

      - name: Install uv + Python 3.12
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync ONLY harness-${{ matrix.axis }} (+ declared deps; prune siblings)
        run: uv sync --locked --package harness-${{ matrix.axis }}

      - name: Layer test tooling (no harness deps — isolation preserved)
        run: uv pip install "pytest>=8.3" "pytest-asyncio>=0.25"

      - name: Pytest ${{ matrix.test_root }} in isolation (excludes e2e)
        run: uv run --no-sync pytest ${{ matrix.test_root }} -m "not e2e"

  substitution-ledger:
    needs: changes
    if: ${{ !cancelled() }}
    # R-600-substitution-ledger-schema — the tally-validation gate. Derives the
    # bucket counts + canonical integers from `.harness/substitutions.yaml` (the
    # single source of truth) and FAILS on an impossible tally: a bucket sum != 54,
