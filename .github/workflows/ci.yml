  arc-ledger:
    needs: changes
    if: ${{ !cancelled() }}
    # R-FS-1 roadmap overhaul — the arc-ledger tally-validation gate (byte-parallel to the
    # substitution-ledger job above). Derives every R-FS-1 arc + unit count from the single
    # source `.harness/arc-ledger.yaml` and FAILS on an impossible/stale tally: a frozen arc
    # without as-built units, a registered (forward) arc that names a concrete U-* unit or
    # omits decompose_at_open/parent_arc, a row changed without a snapshot bump, or zero OPEN
    # standalone arcs while R-FS-1 is ACTIVE (the count-drift class that produced R-IF-114).
    # `.harness/forward-register.yaml` + `tools/forward_register.py` is a SIBLING schema for
    # the post-Phase-8 forward-work register (arc-ledger's own `rfs1_status: resolved` pin
    # forbids adding new open rows there — R-FS-1/R-FS-2 are closed build arcs); it gets the
    # same tally + prose-drift gate here. The runtime contract-id hygiene tests run here too:
    # like the substitution + overlay modules, tools/ test modules live outside the 7
    # testpaths packages, so the blocking `test` job does not collect them. This job is their
    # home (they had none before, hence the rot). pyyaml comes from harness-runtime via the
    # all-packages sync.
    runs-on: ubuntu-latest
    name: arc ledger (tally gate) — blocking
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.changes.outputs.tested }}
          # FULL history: roadmap_status_refresh.py --check's terminating-refresh
          # shape gate (U-CTX-03 AC #2) needs HEAD's PARENT — on a depth-1 clone
          # `git show HEAD` lists the ENTIRE tree (parentless root-commit diff),
          # which would fail every legitimate refresh push. Same documented
          # failure shape as the codex-context-guard job's checkout below; the
          # check additionally skips (rather than misjudges) at a shallow
          # boundary, so this fetch is what makes it ENFORCE in CI.
          fetch-depth: 0

      - name: Install uv + Python 3.12
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync workspace (all members; provides pyyaml via harness-runtime)
        run: uv sync --locked --all-packages

      - name: Validate the arc ledger (impossible/stale tally = CI failure)
        run: uv run python tools/arc_ledger.py --check

      - name: Validate the forward register (impossible tally / prose drift = CI failure)
        run: uv run python tools/forward_register.py --check

      - name: Validate roadmap_status.md table caps (stray/uncapped rows = CI failure)
        # On pull_request, actions/checkout puts the SYNTHETIC merge ref at
        # HEAD ("Merge ..." subject) — the refresh-shape gate would silently
        # no-op pre-merge; judge the PR's real head instead. The §12.2.1
        # invariant binds on the PR TITLE over the PR's WHOLE base..head diff
        # (a refresh-titled PR whose head commit has an ordinary subject must
        # not slip through) — pass both explicitly; push events fall back to
        # the HEAD commit's own subject + single-commit diff.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: >
          uv run python tools/roadmap_status_refresh.py --check
          --shape-ref "${{ github.event.pull_request.head.sha || 'HEAD' }}"
          ${{ github.event.pull_request.base.sha && format('--shape-base {0}', github.event.pull_request.base.sha) || '' }}
          ${{ github.event.pull_request.title && '--shape-title-env PR_TITLE' || '' }}

      - name: Arc-ledger + forward-register + runtime contract-id tests
        working-directory: tools
        run: >
          uv run python -m pytest
          test_arc_ledger.py test_forward_register.py test_runtime_contract_ids.py
          test_roadmap_status_refresh.py test_roadmap_status_consumers.py
          test_memory_compact.py test_context_budget.py test_axis_claude_pins.py
          test_module_path_guard.py test_leg_selfcheck.py test_roadmap_ritual_smoke.py -q

