name: CI

# R-200-ci-pytest-pyright-ruff-matrix — the first substantive CI job for the
# H_T workspace. Runs the same trio the `just check` recipe runs locally
# (ruff lint + pyright strict + pytest) across the uv workspace at every PR
# and on push to main. The X-AL-3 guard (design-substrate back-flow check)
# remains a separate, path-scoped workflow.
#
# Authority: Project_Roadmap_v1.md §5.4 R-200-ci-pytest-pyright-ruff-matrix;
#            CLAUDE.md §3.1 committed stack (Python 3.12+ / uv / pyright strict /
#            ruff / pytest). Tool config lives in the root pyproject.toml
#            ([tool.ruff], [tool.pyright], [tool.pytest.ini_options]).
#
# v1 enforcement posture (IMPORTANT — read before tightening):
#   - pytest IS blocking. `uv run pytest -m "not e2e"` is green tree-wide
#     (3543 passed / 7 skipped as of the R-200 authoring commit).
#   - ruff IS blocking (flipped at R-200-ci-lint-typecheck-blocking). The tree
#     is clean tree-wide under `uv run ruff check .` AND `uv run ruff format
#     --check .` (0 findings). The mechanical sweep (PR #155) + F821 real-defect
#     fixes (PR #157) + this PR's src fixes + test-legitimate per-file-ignores
#     (root pyproject [tool.ruff.lint.per-file-ignores]) drove the residual to 0.
#   - pyright IS blocking (flipped at R-200-ci-lint-typecheck-blocking pyright
#     half). The tree is clean tree-wide under `uv run pyright` (0 errors). The
#     drive-clean pass: test modules scoped-relaxed via
#     [tool.pyright.executionEnvironments] (one entry per harness-*/tests — the
#     analog to the lint half's per-file-ignores); src driven to 0 by real fixes
#     (incl. the genuine two-`Skill`-class bug at types.py — the empty `Skill`
#     Protocol stub was re-exported as the concrete `lifecycle.skills.Skill`) +
#     the `streamablehttp_client` → `streamable_http_client` mcp deprecation
#     rename + targeted narrowing/casts + a handful of documented library-boundary
#     ignores. 3543 passed / 0 regression. New findings fail the PR.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# Cancel superseded runs on the same ref so a fast push series doesn't queue.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: pytest (all axis packages) — blocking
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Stop-hook parity verifies terminating-refresh file shape against HEAD's parent.
          fetch-depth: 0

      - name: Install uv + Python 3.12
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync workspace (all members)
        run: uv sync --all-packages

      # Excludes the `e2e` marker — those tests exercise real external services
      # (Anthropic API etc.) and are gated on credentials not available in CI
      # per the marker definition in the root pyproject.toml. testpaths in
      # [tool.pytest.ini_options] cover all 7 workspace packages (the 5 axes +
      # harness-core + harness-runtime).
      - name: Pytest (excludes e2e)
        run: uv run pytest -m "not e2e"

      - name: Codex compatibility regressions — blocking
        run: bash tools/codex-parity-check.sh

  lint:
    runs-on: ubuntu-latest
    name: ruff (lint + format) — blocking
    # Blocking as of R-200-ci-lint-typecheck-blocking — the tree is ruff-clean
    # (check + format) tree-wide. New findings fail the PR. See header note.
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install uv + Python 3.12
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync workspace (all members)
        run: uv sync --all-packages

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    name: pyright (strict) — blocking
    # Blocking as of R-200-ci-lint-typecheck-blocking (pyright half) — the tree
    # is pyright-clean (0 errors) tree-wide. New findings fail the PR. See header
    # note for the drive-clean approach (test-dir executionEnvironments + src
    # fixes). Run locally exactly as here: `uv sync --all-packages && uv run pyright`.
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv + Python 3.12
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync workspace (all members)
        run: uv sync --all-packages

      - name: Pyright (strict; config at root pyproject [tool.pyright])
        run: uv run pyright

  axis-isolation:
    # R-200-ci-axis-matrix — per-axis test-isolation matrix. Each leg installs
    # ONLY one library package + its DECLARED workspace deps (`uv sync --package`
    # prunes the rest), then runs that package's own tests. A test (or src
    # module) that imports a sibling axis NOT in the package's declared
    # dependency set fails to import — surfacing cross-axis leaks that the
    # all-packages `test` job masks (everything is installed there, so an
    # undeclared sibling import still resolves).
    #
    # Test tooling (pytest, pytest-asyncio) lives in the ROOT [dependency-groups]
    # `dev` group, which `uv sync --package <member>` does not pull (groups are
    # project-scoped, and a member project declares no `dev` group). We layer it
    # in via `uv pip install` AFTER the isolated sync — neither package depends
    # on any harness axis, so the isolation is preserved.
    #
    # harness-runtime is intentionally omitted: it depends on every axis, so its
    # "isolation" is a full install == the blocking `test` job above.
    #
    # Enforcement posture (v1): all 6 legs (core / is / as / cp / od / cxa) are GREEN
    # in isolation and BLOCKING — a NEW cross-axis leak in any of them fails CI.
    # The `od` leg was ADVISORY through R-200-ci-axis-matrix because harness-od had
    # undeclared OD→CP + OD→IS consumer deps (src reads `ReplayDisposition` from
    # harness_cp.engine_namespace; tests import harness_cp + harness_is). Closed at
    # R-200-ci-od-cp-dependency-leak: harness-od now declares harness-cp (OD→CP,
    # canonical CXA §2.3.3) + harness-is (OD→IS, canonical CXA §2.3.4) — both
    # acyclic-safe. od leg verified green in isolation (887 passed). See
    # .harness/class_3_drift_od_cp_undeclared_dependency.md for the direction analysis.
    name: axis isolation — harness-${{ matrix.axis }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        axis: [core, is, as, cp, od, cxa]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv + Python 3.12
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync ONLY harness-${{ matrix.axis }} (+ declared deps; prune siblings)
        run: uv sync --package harness-${{ matrix.axis }}

      - name: Layer test tooling (no harness deps — isolation preserved)
        run: uv pip install "pytest>=8.3" "pytest-asyncio>=0.25"

      - name: Pytest harness-${{ matrix.axis }}/tests in isolation (excludes e2e)
        run: uv run --no-sync pytest harness-${{ matrix.axis }}/tests -m "not e2e"

  coverage:
    # R-200-ci-coverage-gating — INFORMATIONAL coverage at PR. v1 posture: NO
    # threshold ("gather data first" per the roadmap entry); advisory
    # (continue-on-error) so a coverage hiccup never blocks merge. Re-runs the
    # non-e2e suite under coverage (config at root pyproject [tool.coverage.run]:
    # source = the 7 import packages, tests omitted), publishes a one-line total
    # to the job step-summary (visible on the PR's Checks tab), and uploads
    # coverage.xml as an artifact for inspection. A `fail_under` threshold +
    # cross-PR trend (codecov/badge) land only once a baseline justifies it —
    # the same "advisory until justified, then flip blocking" path the lint +
    # typecheck jobs already walked (both now blocking).
    name: coverage (informational) — advisory at v1
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv + Python 3.12
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync workspace (all members)
        run: uv sync --all-packages

      - name: Pytest with coverage (excludes e2e)
        run: uv run pytest -m "not e2e" --cov --cov-report=term-missing --cov-report=xml --cov-report=json

      - name: Publish coverage total to job summary
        if: always()
        run: |
          uv run python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("coverage.json")
          if not p.exists():
              print("### Coverage\n\n_coverage.json not produced — see the pytest step._")
          else:
              t = json.loads(p.read_text())["totals"]
              print("### Coverage (informational — v1, no threshold)\n")
              print(f"**Total line coverage: {t['percent_covered_display']}%** "
                    f"({t['covered_lines']}/{t['num_statements']} statements; "
                    f"branch coverage enabled).\n")
              print("Threshold enforcement deferred (`fail_under`) until a baseline trend justifies it.")
          PY

      - name: Upload coverage.xml artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  substitution-ledger:
    # R-600-substitution-ledger-schema — the tally-validation gate. Derives the
    # bucket counts + canonical integers from `.harness/substitutions.yaml` (the
    # single source of truth) and FAILS on an impossible tally: a bucket sum != 54,
    # a pipeline-advanced that isn't RETIRED+RETIRE_READY+PARTIAL (the exact 48-vs-49
    # inconsistency the R-700 close caught), a sign_off_label silently promoted into
    # the count, or a row changed without a snapshot bump. The pytest leg pins the
    # canonical 46/49/54 + the two distinct per-axis breakdowns + the label≠count rule.
    # pyyaml comes from harness-runtime via the all-packages sync (the tools/ test
    # module lives outside the 7 testpaths packages, so the blocking `test` job above
    # does not collect it — this job is its home).
    runs-on: ubuntu-latest
    name: substitution ledger (tally gate) — blocking
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv + Python 3.12
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync workspace (all members; provides pyyaml via harness-runtime)
        run: uv sync --all-packages

      - name: Validate the substitution ledger (impossible tally = CI failure)
        run: uv run python tools/substitution_ledger.py --check

      - name: Substitution-ledger tests (canonical pin + invariants + negative tests)
        working-directory: tools
        run: uv run python -m pytest test_substitution_ledger.py -q

  arc-ledger:
    # R-FS-1 roadmap overhaul — the arc-ledger tally-validation gate (byte-parallel to the
    # substitution-ledger job above). Derives every R-FS-1 arc + unit count from the single
    # source `.harness/arc-ledger.yaml` and FAILS on an impossible/stale tally: a frozen arc
    # without as-built units, a registered (forward) arc that names a concrete U-* unit or
    # omits decompose_at_open/parent_arc, a row changed without a snapshot bump, or zero OPEN
    # standalone arcs while R-FS-1 is ACTIVE (the count-drift class that produced R-IF-114).
    # `.harness/forward-register.yaml` + `tools/forward_register.py` is a SIBLING schema for
    # the post-Phase-8 forward-work register (arc-ledger's own `rfs1_status: resolved` pin
    # forbids adding new open rows there — R-FS-1/R-FS-2 are closed build arcs); it gets the
    # same tally + prose-drift gate here. The runtime contract-id hygiene tests run here too:
    # like the substitution + overlay modules, tools/ test modules live outside the 7
    # testpaths packages, so the blocking `test` job does not collect them. This job is their
    # home (they had none before, hence the rot). pyyaml comes from harness-runtime via the
    # all-packages sync.
    runs-on: ubuntu-latest
    name: arc ledger (tally gate) — blocking
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv + Python 3.12
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync workspace (all members; provides pyyaml via harness-runtime)
        run: uv sync --all-packages

      - name: Validate the arc ledger (impossible/stale tally = CI failure)
        run: uv run python tools/arc_ledger.py --check

      - name: Validate the forward register (impossible tally / prose drift = CI failure)
        run: uv run python tools/forward_register.py --check

      - name: Validate roadmap_status.md table caps (stray/uncapped rows = CI failure)
        run: uv run python tools/roadmap_status_refresh.py --check

      - name: Arc-ledger + forward-register + runtime contract-id tests
        working-directory: tools
        run: >
          uv run python -m pytest
          test_arc_ledger.py test_forward_register.py test_runtime_contract_ids.py
          test_roadmap_status_refresh.py test_memory_compact.py -q

  semantic-overlay:
    # R-IF-112 — the spec ↔ code ↔ CXA-seam ↔ substitution overlay drift gate.
    # Deterministically re-derives the overlay from HEAD (parseable docstring cites +
    # the code-resident PATTERN_P1_SEAMS enumeration + substitutions.yaml) and FAILS on
    # HARD drift: a genuine CXA seam whose producer/consumer symbol no longer resolves to
    # a source file (PATTERN_P1_SEAMS vs code drift). overlay.json is a gitignored build
    # artifact (query/summary/check all derive fresh from HEAD), so there is no committed
    # snapshot to go stale — the drift this manufactures is what stage-01 finding #2 warns of.
    # Like the substitution-ledger job, the tools/ test module lives outside the 7 testpaths
    # packages, so the blocking `test` job does not collect it — this job is its home.
    runs-on: ubuntu-latest
    name: semantic overlay (drift gate) — blocking
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv + Python 3.12
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync workspace (all members; provides pyyaml via harness-runtime)
        run: uv sync --all-packages

      - name: Validate the semantic overlay (seam drift / stale artifact = CI failure)
        run: uv run python tools/semantic_overlay/overlay.py check

      - name: Semantic-overlay tests (cite extraction + seam resolution + gate)
        working-directory: tools
        run: uv run python -m pytest semantic_overlay/test_overlay.py -q

  q1-review-gate:
    # R-CL-Q1 — provider-free structured review artifact gate. This tool lives
    # outside pytest's 7 package testpaths, so CI pins its tests explicitly.
    runs-on: ubuntu-latest
    name: Q1 review gate (structured artifact) — blocking
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv + Python 3.12
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Q1 review-gate tests
        run: uv run python -m pytest tools/test_q1_review_gate.py -q

      - name: Q1 review-gate schema is JSON
        run: uv run python tools/q1_review_gate.py --schema | uv run python -m json.tool >/dev/null

  q3-evidence-and-closure-gate:
    # B-35 (.harness/forward-register.yaml) — these tools/*.py test modules
    # lived outside pytest's 7 package testpaths with no CI job of their own,
    # so a real, currently-red qa_evidence_matrix.py --check gap (12 contracts
    # with no test-file citation) sat undetected. This job is their home.
    # pyyaml comes from harness-runtime via the all-packages sync.
    runs-on: ubuntu-latest
    name: Q3 evidence + closure gate — blocking
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv + Python 3.12
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync workspace (all members; provides pyyaml via harness-runtime)
        run: uv sync --all-packages

      - name: Q3 evidence-matrix + closure-gate + r500-proof tests
        working-directory: tools
        run: uv run python -m pytest test_qa_evidence_matrix.py test_closure_gate.py test_r500_multitenant_selfhosted.py -q

      - name: Validate the Q3 evidence matrix (missing test-citation = CI failure)
        run: uv run python tools/qa_evidence_matrix.py --check

      - name: Validate the closure gate (failing automatable predicate = CI failure)
        run: uv run python tools/closure_gate.py --check

  codex-context-guard:
    # R-600-codex-context-guard — Codex-side context-rot gate. The guard is stdlib-only
    # so the runtime check uses /usr/bin/python3; pytest still runs under uv for the
    # repo's pinned Python/test environment. Hard failures include root-checkout edits,
    # design+implementation mixing, and default-branch roadmap_status.md drift.
    runs-on: ubuntu-latest
    name: Codex context guard (anti-rot gate) — blocking
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # FULL history (not the default shallow depth-1). The guard's `--base-ref`
          # diff AND `_lag_expected()` (which runs `git show --name-only HEAD` to confirm
          # a refresh-tip changed ONLY roadmap_status.md) both need HEAD's PARENT
          # present. On a depth-1 clone the shallow boundary makes `git show HEAD` list the
          # ENTIRE tree (parentless root-commit diff), so `_lag_expected` is always False
          # and EVERY `ops: roadmap status refresh ` push to main HARD-failed
          # ROADMAP_STATUS_DRIFT (the §12.2.1 lag the session-start hook correctly
          # tolerates). Mirrors the `lint` job's fetch-depth: 0.
          fetch-depth: 0

      - name: Install uv + Python 3.12
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Codex context guard runtime check
        run: >
          /usr/bin/python3 tools/codex_context_guard.py check
          --base-ref "${{ github.event.pull_request.base.sha || github.event.before }}"
          --head-ref "${{ github.event.pull_request.head.sha || github.sha }}"
          --allow-roadmap-drift

      - name: Codex context guard tests
        run: uv run python -m pytest tools/test_codex_context_guard.py -q
