name: X-AL-3 Silent-Absorption Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'design-substrate/**'

jobs:
  guard:
    runs-on: ubuntu-latest
    name: Verify design-substrate edits route through back-flow
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run X-AL-3 check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: bash .github/scripts/x-al-3-check.sh
