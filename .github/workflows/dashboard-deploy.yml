name: dashboard-deploy

# Operator dashboard (R-XI-01). Regenerates roadmap.html from the roadmap
# substrate and publishes it to GitHub Pages on every relevant push to main.
#
# ONE-TIME OPERATOR SETUP (required before this workflow can deploy):
#   repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Until Pages is enabled with the GitHub Actions source, the `deploy` step will
# fail (expected). The `build` job is independent and always validates the
# generator + uploads the artifact, so a red `deploy` does not hide build breakage.

on:
  push:
    branches: [main]
    paths:
      - "tools/dashboard/**"
      - ".harness/roadmap_status.md"
      - "Project_Roadmap_v1.md"
      - "harness-*/CLAUDE.md"
      - ".github/workflows/dashboard-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deploy; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # commit-cadence sparkline reads `git log --since=30.days`
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate dashboard
        env:
          GH_TOKEN: ${{ github.token }} # `gh pr list` for the in-flight PR panel
        run: |
          mkdir -p tools/dashboard/public
          python tools/dashboard/generate.py --root . --out tools/dashboard/public/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tools/dashboard/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
